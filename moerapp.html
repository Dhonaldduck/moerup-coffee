/* Biaya per gram roast bean untuk HPP resep botolan. Kalau bean itu belum
   pernah diroasting, diperkirakan dari harga green bean ÷ yield standar +
   tarif roasting — supaya resep produk baru tetap bisa dihitung. */
function biayaGramEstimasi(gbId){
  const c=biayaGramRata(gbId); if(c>0) return {v:c, est:false};
  const b=(BOOKS.inv.gb||{})[gbId]||{qty:0,val:0,last:0};
  const g=b.qty>1e-9 ? b.val/b.qty : (+b.last||0);
  const y=(+S.settings.defaultYield||80)/100;
  if(g>0 && y>0) return {v:(g+(+S.settings.roastOverheadPerKg||0)/1000)/y, est:true};
  return {v:0, est:true};
}
/* ------------------------ RESEP BOTOLAN (RACIKAN) -------------------------
   Resep menyimpan TAKARAN BAHAN BAKU — yang benar-benar dipotong dari stok:
   gram kopi, gram krimer bubuk, ml susu. Informasi racikan menempel di
   sampingnya dan tidak memengaruhi stok kecuali air:
   · kopi: gram → hasil espresso (ml)               beans[i].yieldMl
   · bubuk dicairkan: gram + air 1:x → hasil cairan components[i].rasioAir / .yieldMl
   · air biasa tambahan per botol                   sku.airMl
   Seluruh air (pelarut + air biasa) dipotong dari stok air kalau sumbernya
   dipilih (sku.airSupplyId); kalau tidak, air dianggap gratis dan tidak distok. */
function rtdBeans(sku){
  return (Array.isArray(sku&&sku.beans)?sku.beans:[]).filter(b=>b&&b.greenbeanId&&(+b.gram||0)>0)
    .map(b=>({greenbeanId:b.greenbeanId, gram:+b.gram||0, roastLevel:normLevel(b.roastLevel), yieldMl:+b.yieldMl||0}));
}
const hasilCair = (c,s) => { const q=+c.qty||0, r=+c.rasioAir||0;
  if(r>0) return (+c.yieldMl||0)>0 ? +c.yieldMl : q*(1+r);
  return (s && s.unit==="ml") ? q : 0; };
/* Pemakaian stok per botol: satu-satunya sumber untuk HPP standar dan
   isian otomatis form produksi. */
function rtdUsage(sku){
  const beans=rtdBeans(sku);
  const items=[];
  /* Air per botol = air seduh espresso (sama dengan hasil espresso: 10 g → 30 ml
     memakai 30 ml air) + air pelarut bubuk (7,5 g dicairkan 1:1 = 7,5 ml air)
     + air biasa. */
  const airSeduh=beans.reduce((n,b)=>n+(b.yieldMl>0?b.yieldMl:0),0);
  const airBiasa=Math.max(0,+(sku&&sku.airMl)||0);
  let airPelarut=0;
  for(const c of ((sku&&sku.components)||[])){
    if(!c || !c.supplyId || !S.supplies[c.supplyId]) continue;
    const q=+c.qty||0; if(q<=0) continue;
    const ada=items.find(x=>x.supplyId===c.supplyId);
    if(ada) ada.qty+=q; else items.push({supplyId:c.supplyId, qty:q});
    const r=+c.rasioAir||0; if(r>0) airPelarut+=q*r;
  }
  const air=airSeduh+airPelarut+airBiasa;
  const airId = sku && sku.airSupplyId && S.supplies[sku.airSupplyId] ? sku.airSupplyId : "";
  if(airId && air>0){
    const ada=items.find(x=>x.supplyId===airId);
    if(ada) ada.qty+=air; else items.push({supplyId:airId, qty:air});
  }
  return {beans, items, air, airId, airSeduh, airPelarut, airBiasa};
}
/* "seduh 30 + pelarut 7,5 + biasa 150" */
function rincianAir(u){
  return [u.airSeduh>0?"seduh "+num2(u.airSeduh):"", u.airPelarut>0?"pelarut "+num2(u.airPelarut):"",
          u.airBiasa>0?"biasa "+num2(u.airBiasa):""].filter(Boolean).join(" + ");
}
/* Isi cairan per botol: espresso + susu + bubuk yang sudah dicairkan + air biasa. */
function rtdVolume(sku){
  const rows=[]; let total=0;
  rtdBeans(sku).forEach(b=>{ if(b.yieldMl>0){ total+=b.yieldMl;
    rows.push({n:"Espresso", ml:b.yieldMl, dari:num2(b.gram)+" g kopi"}); } });
  for(const c of ((sku&&sku.components)||[])){
    const sp=S.supplies[c&&c.supplyId]; if(!sp || !isBahanMinuman(sp)) continue;
    const ml=hasilCair(c,sp); if(ml<=0) continue;
    total+=ml; const r=+c.rasioAir||0;
    rows.push({n:sp.name+(r>0?" (cair)":""), ml, dari:r>0?num2(c.qty)+" "+(sp.unit||"g")+" + "+num2((+c.qty||0)*r)+" ml air":""});
  }
  const air=Math.max(0,+(sku&&sku.airMl)||0);
  if(air>0){ total+=air; rows.push({n:"Air biasa", ml:air, dari:""}); }
  return {total, rows};
}
/* HPP standar satu botol dari resepnya: kopi + bahan minuman + kemasan + biaya lain. */
function rtdRecipeCost(sku){
  const u=rtdUsage(sku); const parts=[]; let bean=0, bb=0, km=0;
  const est = id => !((BOOKS.inv.sup[id]||{}).qty>0 || (BOOKS.inv.sup[id]||{}).last>0);
  for(const bn of u.beans){
    const e=biayaGramEstimasi(bn.greenbeanId); const v=e.v*bn.gram;
    bean+=v; parts.push({grp:"bean", n:((S.greenbeans[bn.greenbeanId]||{}).name||"?")+" "+num2(bn.gram)+" g"+(bn.yieldMl>0?" → "+num2(bn.yieldMl)+" ml espresso":""),
      q:bn.gram, u:"g", per:e.v, v, est:e.est});
  }
  for(const cp of ((sku&&sku.components)||[])){
    const sp=S.supplies[cp.supplyId]; if(!sp) continue;
    const q=+cp.qty||0; if(q<=0) continue;
    if(cp.supplyId===u.airId) continue;            // dihitung di baris air
    const per=hargaSatuanSup(cp.supplyId), v=per*q;
    const g=isBahanMinuman(sp)?"bb":"km";
    if(g==="bb") bb+=v; else km+=v;
    const r=+cp.rasioAir||0;
    parts.push({grp:g, n:sp.name+" "+num2(q)+" "+(sp.unit||"pcs")+(r>0?" → "+num2(hasilCair(cp,sp))+" ml cair":""),
      q, u:sp.unit||"pcs", per, v, est:est(cp.supplyId), id:cp.supplyId});
  }
  const airQ = u.airId ? ((u.items.find(x=>x.supplyId===u.airId)||{}).qty||0) : u.air;
  if(airQ>0){
    const per=u.airId?hargaSatuanSup(u.airId):0, v=per*airQ; bb+=v;
    const rinci=rincianAir(u);
    parts.push({grp:"bb", n:"Air "+num2(airQ)+" ml"+(rinci&&rinci.indexOf("+")>0?" ("+rinci+")":"")+(u.airId?"":" — belum dihitung, sumber air belum dipilih"), q:airQ, u:"ml", per, v,
      est:u.airId?est(u.airId):false, id:u.airId||""});
  }
  const oh=+(sku&&sku.ohPerUnit)||0;
  if(oh>0) parts.push({grp:"oh", n:"Biaya lain (es, gas, tenaga)", v:oh});
  return {bean, bb, km, oh, total:bean+bb+km+oh, rb:bean, sup:bb+km, parts};
}
/* Panduan racik untuk satu batch produksi, menurut resep. */
function panduanRacik(sku, q){
  if(!sku || !(q>0)) return [];
  const out=[];
  rtdBeans(sku).forEach(b=>{ const g=(S.greenbeans[b.greenbeanId]||{}).name||"kopi";
    out.push(b.yieldMl>0 ? ["Espresso", num2(b.gram*q)+" g "+g+" + "+num2(b.yieldMl*q)+" ml air → "+num2(b.yieldMl*q)+" ml"]
                         : ["Kopi", num2(b.gram*q)+" g "+g]); });
  for(const c of (sku.components||[])){
    const sp=S.supplies[c.supplyId]; if(!sp || !isBahanMinuman(sp)) continue;
    const qq=(+c.qty||0)*q, r=+c.rasioAir||0; if(qq<=0) continue;
    out.push(r>0 ? [sp.name+" cair", num2(qq)+" "+sp.unit+" + "+num2(qq*r)+" ml air → "+num2(hasilCair(c,sp)*q)+" ml"]
                 : [sp.name, num2(qq)+" "+sp.unit]);
  }
  const air=Math.max(0,+sku.airMl||0); if(air>0) out.push(["Air biasa", num2(air*q)+" ml"]);
  const v=rtdVolume(sku).total; if(v>0) out.push(["Total cairan", num2(v*q)+" ml → "+num2(q)+" botol × "+num2(v)+" ml"]);
  return out;
}
/* Resep bean sebuah produk. Mendukung campuran beberapa green bean (blend),
   dan tetap membaca format lama satu-bean supaya produk lama tidak rusak. */
function skuBeans(sku){
  if(!sku) return [];
  if(Array.isArray(sku.beans) && sku.beans.length)
    return sku.beans.filter(b=>b && b.greenbeanId && (+b.gram||0)>0)
      .map(b=>({greenbeanId:b.greenbeanId, gram:+b.gram||0, roastLevel:normLevel(b.roastLevel)}));
  if(sku.greenbeanId && (+sku.roastGram||0)>0)
    return [{greenbeanId:sku.greenbeanId, gram:+sku.roastGram||0, roastLevel:normLevel(sku.roastLevel)}];
  return [];
}
/* Isi resep boleh ditimpa untuk satu baris penjualan — pesanan gramasi tidak
   standar atau bean diganti, tanpa harus membuat produk baru yang cuma dipakai
   sekali lalu mengotori daftar produk. Tanpa timpaan, resep produk yang dipakai. */
function lineBeans(line, sku){
  if(isRTD(sku)) return [];        // botolan: bean-nya sudah terpakai saat produksi, bukan saat jual
  const o = line && line.beans;
  return (Array.isArray(o) && o.length)
    ? o.filter(b=>b && b.greenbeanId)
       .map(b=>({greenbeanId:b.greenbeanId, gram:+b.gram||0, roastLevel:normLevel(b.roastLevel)}))
    : skuBeans(sku);
}
const skuGramTotal = (sku,line) => lineBeans(line,sku).reduce((n,b)=>n+b.gram,0);
/* Roast level BUKAN bagian dari produk: stok roast bean dipisah per level, dan
   level dipilih bebas lewat batch saat penjualan. Karena itu biaya per gram
   dibaca dari kantong (bean × level) yang benar-benar dipakai, atau kalau
   belum ada batch yang dipilih, dari rata-rata seluruh stok bean itu. */
function biayaGramRata(gbId){
  let q=0,v=0; const lasts=[];
  for(const [k,b] of Object.entries(BOOKS.inv.rb)){
    if(rbSplit(k).gbId!==gbId) continue;
    if(b.qty>1e-9){ q+=b.qty; v+=b.val; }
    if((b.last||0)>0) lasts.push(b.last);
  }
  if(q>0 && v>0) return v/q;
  return lasts.length ? lasts.reduce((a,b)=>a+b,0)/lasts.length : 0;
}
function biayaGramRB(gbId, level){
  const b=BOOKS.inv.rb[rbKey(gbId,level)];
  const c=b ? (b.qty>1e-9 ? b.val/b.qty : (b.last||0)) : 0;
  return c>0 ? c : biayaGramRata(gbId);
}
function skuCost(sku, line){
  if(!sku) return {rb:0,sup:0,total:0,parts:[]};
  if(isRTD(sku)){
    /* Botolan dijual dari stok botol jadi: HPP-nya rata-rata hasil produksi.
       Belum pernah diproduksi? Pakai HPP standar dari resep. */
    const b=(BOOKS.inv.fg||{})[sku.id]||{qty:0,val:0,last:0};
    const c=b.qty>1e-9 ? b.val/b.qty : (+b.last||0);
    if(c>0) return {rb:0,sup:0,fg:c,total:c,parts:[{n:"botol jadi (rata-rata produksi)",v:c}]};
    const r=rtdRecipeCost(sku);
    return {rb:0,sup:0,fg:r.total,total:r.total,parts:[{n:"perkiraan resep — belum ada produksi",v:r.total}],est:true};
  }
  const parts=[]; let rb=0,sup=0;
  for(const bn of lineBeans(line,sku)){
    const nama=(S.greenbeans[bn.greenbeanId]?.name||"?");
    const pilih = line && lineAllocs(line,bn.greenbeanId,0).length>0;
    if(pilih){
      const q=+line.qty||1;
      let tot=0; const lv=[];
      for(const k of lineKonsumsi(line,bn,q)){
        tot+=k.gram*biayaGramRB(bn.greenbeanId,k.level);
        if(!lv.includes(k.level)) lv.push(k.level);
      }
      const c=tot/q;
      rb+=c; parts.push({n:nama+" "+lv.join("/")+" "+num2(bn.gram)+" g", v:c});
    } else {
      const c=biayaGramRata(bn.greenbeanId)*bn.gram;
      rb+=c; parts.push({n:nama+" "+num2(bn.gram)+" g", v:c});
    }
  }
  for(const cp of (sku.components||[])){
    const s=S.supplies[cp.supplyId]; if(!s) continue;
    const c=hargaSatuanSup(cp.supplyId)*(+cp.qty||0);
    sup+=c; parts.push({n:s.name+" ×"+num2(cp.qty), v:c});
  }
  return {rb,sup,total:rb+sup,parts};
}

/* Isian angka: menerima "12.000.000", "12000000", atau "0,5", dan merapikan
   pemisah ribuan sambil diketik. Baca nilainya dengan numVal(). */
function numInput(v,attrs){
  const a={...(attrs||{})};
  const onEdit=a.oninput; delete a.oninput;   // dipasang SETELAH perapian, lihat catatan di bawah
  const e=inp({type:"text",inputmode:"decimal",autocomplete:"off",class:"inp num",value:fmtNum(v),...a});
  // Perapian harus jalan lebih dulu supaya pembaca nilai tidak pernah melihat
  // bentuk setengah jadi seperti "1.0000" (yang terbaca 1, bukan 10.000).
  e.addEventListener("input",()=>{
    const raw=e.value;
    if(raw==="" || /,$/.test(raw)) return;      // biarkan saat desimal sedang diketik
    const caret=e.selectionStart==null?raw.length:e.selectionStart;
    const digitsBefore=raw.slice(0,caret).replace(/\D/g,"").length;
    const neg=raw.trim().startsWith("-");
    let t=raw.replace(/[^\d,]/g,"");            // titik milik kita sendiri: buang, lalu pasang ulang
    if((t.match(/,/g)||[]).length>1) t=t.replace(/,/g,"");
    if(t==="") return;
    const bits=t.split(",");
    const out=(neg?"-":"")+fmtID(parseInt(bits[0]||"0",10),0)+(bits.length>1?","+bits[1]:"");
    if(out===raw) return;
    e.value=out;
    let pos=0,seen=0;
    while(pos<out.length && seen<digitsBefore){ if(/\d/.test(out[pos])) seen++; pos++; }
    try{ e.setSelectionRange(pos,pos); }catch(err){}
  });
  if(onEdit) e.addEventListener("input",onEdit);
  return e;
}

/* Angka ringkas untuk sumbu: 48.900.000 -> "48,9 jt" */
function rpRingkas(v){
  const a=Math.abs(v);
  if(a>=1e9) return (v/1e9).toFixed(a>=1e10?0:1).replace(".",",")+" M";
  if(a>=1e6) return (v/1e6).toFixed(a>=1e7?0:1).replace(".",",")+" jt";
  if(a>=1e3) return Math.round(v/1e3)+" rb";
  return String(Math.round(v));
}
/* Jarak antar garis sumbu yang enak dibaca: 1, 2, 2,5 atau 5 dikali kelipatan 10 */
function langkahRapi(rentang, target){
  const kasar=rentang/Math.max(1,target);
  const pow=Math.pow(10,Math.floor(Math.log10(kasar)||0));
  for(const m of [1,2,2.5,5,10]) if(kasar<=m*pow) return m*pow;
  return 10*pow;
}

  const atas=Math.max(1,...omzet,...laba);
  const bawah=Math.min(0,...laba);
  const step=langkahRapi(atas-bawah,4);
  const hi=Math.ceil(atas/step)*step, lo=Math.floor(bawah/step)*step;
  const y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-lo)/(hi-lo||1));
  const bw=(W-pad.l-pad.r)/data.length;
  const y0=y(0);
  let g="";

  // garis bantu + label rupiah di sumbu Y
  for(let v=lo; v<=hi+1e-6; v+=step){
    const yy=y(v), nol=Math.abs(v)<1e-6;
    g+='<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+(nol?"var(--line-2)":"var(--line)")+'" stroke-width="'+(nol?1.3:1)+'"/>';
    g+='<text x="'+(pad.l-8)+'" y="'+(yy+3.5)+'" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--ink-3)">'+rpRingkas(v)+'</text>';
  }
  g+='<line x1="'+pad.l+'" x2="'+pad.l+'" y1="'+pad.t+'" y2="'+(H-pad.b)+'" stroke="var(--line-2)" stroke-width="1"/>';

  // batang omzet
  data.forEach((d,i2)=>{
    const cx=pad.l+i2*bw+bw/2, x=cx-bw*0.26, w=bw*0.52;
    const yy=Math.min(y(d.omzet),y0), h=Math.max(1,Math.abs(y0-y(d.omzet)));
    g+='<rect x="'+x+'" y="'+yy+'" width="'+w+'" height="'+h+'" rx="3" fill="var(--accent)" opacity="'+(i2===data.length-1?1:.45)+'">'
      +'<title>'+fmtMonth(d.m)+' — omzet '+rp(d.omzet)+', laba '+rpS(d.laba)+'</title></rect>';
    if(d.omzet>0) g+='<text x="'+cx+'" y="'+(yy-5)+'" text-anchor="middle" font-size="9.5" font-family="var(--mono)" font-weight="600" fill="var(--ink-2)">'+rpRingkas(d.omzet)+'</text>';
    g+='<text x="'+cx+'" y="'+(H-9)+'" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="var(--ink-3)">'+d.m.slice(5)+"/"+d.m.slice(2,4)+'</text>';
  });

  // garis laba bersih
  const pts=data.map((d,i2)=>(pad.l+i2*bw+bw/2)+","+y(d.laba)).join(" ");
  g+='<polyline points="'+pts+'" fill="none" stroke="var(--pos)" stroke-width="1.8" stroke-linejoin="round"/>';
  data.forEach((d,i2)=>{ const cx=pad.l+i2*bw+bw/2;
    g+='<circle cx="'+cx+'" cy="'+y(d.laba)+'" r="3.4" fill="'+(d.laba<0?"var(--neg)":"var(--pos)")+'" stroke="var(--surface)" stroke-width="1.2">'
      +'<title>'+fmtMonth(d.m)+' — laba bersih '+rpS(d.laba)+'</title></circle>'; });

  const box=el("div",{style:"width:100%;overflow-x:auto"});
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:430px;height:auto;display:block">'+g+'</svg>';
  const tot=data.reduce((a,d)=>a+d.omzet,0), totL=data.reduce((a,d)=>a+d.laba,0);
  const legend=el("div",{class:"row",style:"margin-top:6px;gap:14px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap"},
    el("span",null,"Total omzet "+data.length+" bulan: "+rp(tot)),
    el("span",null,"Laba bersih: "+rpS(totL)),
    el("span",null,"Tertinggi: "+rp(Math.max(...omzet))));
  return el("div",null,box,legend);
}

const TXN_LABEL={purchase:"Pembelian",roast:"Roasting",sale:"Penjualan",expense:"Biaya",capital:"Modal/Prive",
  loan:"Terima pinjaman",loanpay:"Angsuran pinjaman",cashadj:"Penyesuaian kas",
  payable:"Bayar hutang",receivable:"Terima piutang",taxpay:"Setor pajak",adjust:"Penyesuaian stok",transfer:"Pindah dana",qc:"QC / Cupping",
  produce:"Produksi botolan",waste:"Waste botolan"};
function txnAmount(t){
  if(t.type==="cashadj") return Math.abs(+t.amount||0);
  if(t.type==="produce"){ const p=(BOOKS.productions||[]).find(x=>x.id===t.id); return p?p.total:0; }
  if(t.type==="waste"){ const p=(BOOKS.wasteLog||[]).find(x=>x.id===t.id); return p?p.cost:0; }
  if(t.type==="purchase") return (t.lines||[]).reduce((s,l)=>s+(+l.qty||0)*(+l.unitPrice||0),0)+(+t.freight||0)+(+t.otherCost||0);
  if(t.type==="sale") return (t.lines||[]).reduce((s,l)=>s+(+l.qty||0)*(+l.unitPrice||0)-(+l.disc||0),0)-(+t.discount||0)+(+t.shippingCharged||0);
  if(t.type==="roast"){ const r=BOOKS.roasts.find(x=>x.id===t.id); return r?r.total:0; }
  return +t.amount||0;
}
function txnDesc(t){
  if(t.type==="roast"){ const g=S.greenbeans[t.greenbeanId]; return (g?g.name:"—")+" · "+gramTxt(t.inputG)+" → "+gramTxt(t.outputG); }
  if(t.type==="sale") return (t.customer||"Umum")+(t.channel?" · "+t.channel:"");
  if(t.type==="purchase") return (t.party||"Supplier")+" · "+(t.kind==="greenbean"?"green bean":t.kind==="supply"?"bahan":"peralatan");
  if(t.type==="expense") return t.note||accName(t.accountId);
  if(t.type==="capital") return (t.direction==="in"?"Setoran modal":"Prive")+(t.note?" · "+t.note:"");
  if(t.type==="transfer") return accName(t.fromAcc)+" → "+accName(t.toAcc)+(t.note?" · "+t.note:"");
  if(t.type==="cashadj") return accName(t.account||"1-1000")+" · "+((+t.amount||0)>=0?"lebih":"kurang")+(t.note?" · "+t.note:"");
  if(t.type==="qc") return rbName(t.rbKey||rbKey(t.greenbeanId,t.roastLevel))+" · "+num2(t.gram)+" g"+(t.purpose?" · "+t.purpose:"");
  if(t.type==="produce") return ((S.skus[t.skuId]||{}).name||"(produk dihapus)")+" · "+num2(t.qty)+" btl · "+prodCode(t);
  if(t.type==="waste") return ((S.skus[t.skuId]||{}).name||"(produk dihapus)")+" · "+num2(t.qty)+" btl · "+(t.reason||"Kedaluwarsa");
  if(t.type==="adjust") return itemNama(t.itemKind,t.itemId)+" → "+num2(t.qty)+" "+itemSatuan(t.itemKind,t.itemId)+(t.note?" · "+t.note:"");
  return t.note||"";
}

function formRoast(existing){
  const gbs=Object.values(S.greenbeans);
  if(!gbs.length){ return openModal("Belum ada green bean",
    [el("p",{style:"color:var(--ink-2)"},"Tambahkan minimal satu green bean di menu Produk & Aset sebelum mencatat roasting.")],
    [el("button",{class:"btn pri",onclick:()=>{closeModal();location.hash="#/master";}},"Buka Produk & Aset")]); }

  const t = existing || {id:uid(),type:"roast",date:todayISO(),greenbeanId:gbs[0].id,inputG:1000,outputG:800,profile:"Medium",note:""};
  const dateI=inp({type:"date",value:t.date});
  const gbI=sel(gbs.map(g=>({v:g.id,t:g.name+" · sisa "+num2((BOOKS.inv.gb[g.id]||{qty:0}).qty)+" g"})), t.greenbeanId);
  const inI=qtyInput(t.inputG);
  const outI=qtyInput(t.outputG);
  const profI=sel(ROAST_LEVELS.map(v=>({v,t:v})), normLevel(t.profile));
  const noteI=inp({value:t.note||"",placeholder:"mis. batch pagi, drum 1"});
  const calc=el("div",{class:"calc"});

  const kgBtns=el("div",{class:"row",style:"margin-top:6px"},
    ...[500,1000,2000,3000,5000].map(g=>el("button",{class:"btn sm",type:"button",onclick:()=>{ inI.value=fmtNum(g); if(!touchedOut) outI.value=fmtNum(Math.round(g*(S.settings.defaultYield/100))); sync(); }}, g>=1000?(g/1000)+" kg":g+" g")));

  let touchedOut = !!existing;
  inI.addEventListener("input",()=>{ if(!touchedOut) outI.value=fmtNum(Math.round(numVal(inI)*(S.settings.defaultYield/100))); sync(); });
  outI.addEventListener("input",()=>{ touchedOut=true; sync(); });
  gbI.addEventListener("change",sync);

  function sync(){
    const gid=gbI.value, inG=numVal(inI), outG=numVal(outI);
    const b=BOOKS.inv.gb[gid]||{qty:0,val:0,last:0};
    let avail=b.qty, avg=b.qty>0?b.val/b.qty:(b.last||0);
    if(existing && existing.greenbeanId===gid){ avail += (+existing.inputG||0); }
    const gbCost=inG*avg, oh=(inG/1000)*(+S.settings.roastOverheadPerKg||0);
    const total=gbCost+oh, perG=outG>0?total/outG:0;
    const yld=inG>0?outG/inG*100:0;
    calc.innerHTML="";
    const L=(a,b,cls)=>el("div",{class:"l"+(cls?" "+cls:"")},el("span",null,a),el("span",null,b));
    calc.append(

/* Form produksi: bahan terisi otomatis = resep × jumlah botol, dan bisa
   diubah ke pemakaian sebenarnya. Selama belum disentuh, isinya ikut
   berubah saat jumlah botol atau produknya diganti. */
function formProduce(existing, preset){
  preset=preset||{};
  const rtd=Object.values(S.skus).filter(isRTD).sort((a,b)=>a.name.localeCompare(b.name));
  if(!rtd.length && !existing){ return openModal("Belum ada produk botolan",
    [el("p",{style:"color:var(--ink-2)"},"Buat produk botolan beserta resep per botolnya dulu (gram kopi, ml susu, gula aren, botol, stiker). Setelah itu produksi bisa dicatat dan HPP-nya terhitung otomatis.")],
    [el("button",{class:"btn",onclick:closeModal},"Nanti"),
     el("button",{class:"btn pri",onclick:()=>{ closeModal(); formSkuRTD(); }},"+ Produk botolan")]); }
  const skuAwal=(preset.skuId&&S.skus[preset.skuId])?preset.skuId:(rtd[0]||{}).id;
  const t=existing||{id:uid(),type:"produce",date:todayISO(),skuId:skuAwal,qty:20,beans:[],items:[],note:""};
  const tId=t.id;
  let ikutResep=!existing;
  let expTouched=!!existing;
  let beans=JSON.parse(JSON.stringify(t.beans||[]));
  let items=JSON.parse(JSON.stringify(t.items||[]));
  const dateI=inp({type:"date",value:t.date});
  const skuOpts=rtd.map(s=>({v:s.id,t:s.name}));
  if(t.skuId && !S.skus[t.skuId]) skuOpts.unshift({v:t.skuId,t:"(produk dihapus)"});
  const skuI=sel(skuOpts,t.skuId);
  const qtyI=qtyInput(t.qty||0);
  const expI=inp({type:"date",value:t.expDate||""});
  const ohI=moneyInput(t.ohPerUnit!=null?t.ohPerUnit:((S.skus[t.skuId]||{}).ohPerUnit||0));
  const noteI=inp({value:t.note||"",placeholder:"mis. batch pagi, untuk titipan kafe"});
  const beanBox=el("div",{style:"display:flex;flex-direction:column;gap:6px"});
  const itemBox=el("div",{style:"display:flex;flex-direction:column;gap:6px"});
  const resepBar=el("div");
  const panduanBox=el("div");
  const calc=el("div",{class:"calc"});

  const sendiriSup = id => ((existing&&existing.items)||[]).filter(x=>x.supplyId===id).reduce((n,x)=>n+(+x.qty||0),0);
  const sendiriRb  = key => ((existing&&existing.beans)||[]).filter(x=>prodBeanKey(x)===key).reduce((n,x)=>n+(+x.gram||0),0);
  const sisaSup = id => ((BOOKS.inv.sup[id]||{qty:0}).qty)+sendiriSup(id);
  /* Pilihan sumber roast bean: batch roasting yang masih bersisa, lalu
     kantong stok per tingkat sangrai (tanpa batch). */
  function sumberBean(gbId, pilihan){
    const opsi=[];
    Object.values(S.txns).filter(x=>x.type==="roast"&&x.greenbeanId===gbId)
      .sort((a,b)=>(b.date+String(b.seq||0)).localeCompare(a.date+String(a.seq||0)))
      .forEach(x=>{ const sisa=batchSisa(x.id,tId); if(sisa>0.5||x.id===pilihan)
        opsi.push({v:x.id,t:batchCode(x)+" · "+normLevel(x.profile)+" · sisa "+num2(Math.max(0,sisa))+" g",sisa,key:rbKey(gbId,x.profile)}); });
    Object.keys(BOOKS.inv.rb).filter(k=>rbSplit(k).gbId===gbId).forEach(k=>{
      const q=(BOOKS.inv.rb[k]||{qty:0}).qty+sendiriRb(k);
      if(q>0.5||("K:"+k)===pilihan) opsi.push({v:"K:"+k,t:"Stok "+rbSplit(k).level+" (tanpa batch) · "+num2(Math.max(0,q))+" g",sisa:q,key:k}); });
    if(!opsi.length || (pilihan && !opsi.some(o=>o.v===pilihan))){
      const k=pilihan&&pilihan.indexOf("K:")===0?pilihan.slice(2):rbKey(gbId,DEFAULT_LEVEL);
      opsi.push({v:"K:"+k,t:"Stok "+rbSplit(k).level+" · kosong — catat roasting dulu",sisa:0,key:k});
    }
    return opsi;
  }
  function biayaGramKey(key){
    const b=BOOKS.inv.rb[key]; const c=b?(b.qty>1e-9?b.val/b.qty:(+b.last||0)):0;
    return c>0?c:biayaGramEstimasi(rbSplit(key).gbId).v;
  }
  function dariResep(){
    const sku=S.skus[skuI.value]; const q=numVal(qtyI);
    beans=[]; items=[];
    if(!sku) return;
    const pakai=rtdUsage(sku);
    for(const bn of pakai.beans){
      const butuh=bn.gram*q; const opsi=sumberBean(bn.greenbeanId,"");
      const cukup=opsi.find(o=>o.sisa>=butuh-0.5)||opsi.slice().sort((a,b)=>b.sisa-a.sisa)[0];
      beans.push({greenbeanId:bn.greenbeanId, src:cukup?cukup.v:"K:"+rbKey(bn.greenbeanId,DEFAULT_LEVEL), gram:butuh});
    }
    for(const it of pakai.items) items.push({supplyId:it.supplyId, qty:it.qty*q});
  }
  function lepasResep(){ if(ikutResep){ ikutResep=false; gambarResepBar(); } }
  function gambarResepBar(){
    resepBar.innerHTML="";
    resepBar.append(el("div",{class:"row",style:"justify-content:space-between;gap:8px"},
      el("span",{style:"font-size:11.5px;color:var(--ink-3)"}, ikutResep
        ? "Takaran mengikuti resep × jumlah botol. Ubah angkanya kalau pemakaian sebenarnya berbeda."
        : "Takaran sudah diubah manual — tidak lagi mengikuti resep."),
      ikutResep?null:el("button",{class:"btn sm gho",type:"button",onclick:()=>{ ikutResep=true; dariResep(); gambarSemua(); }},"Hitung ulang dari resep")));
  }
  function gambarBeans(){
    beanBox.innerHTML="";
    beans.forEach((b,i)=>{
      const gb=S.greenbeans[b.greenbeanId];
      const opsi=sumberBean(b.greenbeanId,b.src);
      const sb=sel(opsi.map(o=>({v:o.v,t:o.t})), b.src, {onchange:e=>{ b.src=e.target.value; lepasResep(); gambarBeans(); sync(); }});
      const gi=qtyInput(b.gram,{oninput:e=>{ b.gram=numVal(e.target); lepasResep(); ket(); sync(); },style:"text-align:right"});
      const x=el("button",{class:"x",type:"button",title:"Hapus",onclick:()=>{ beans.splice(i,1); lepasResep(); gambarBeans(); sync(); }},"×");
      const k=el("div",{style:"font-size:11px;padding:2px 0 0 2px"});
      function ket(){ const o=opsi.find(z=>z.v===b.src); const s=o?o.sisa:0; const g=+b.gram||0;
        const per=biayaGramKey(prodBeanKey(b));
        k.style.color=g>s+0.5?"var(--warn)":"var(--ink-3)";
        k.textContent=(gb?gb.name:"?")+" · "+num2(g)+" g × "+rpU(per)+"/g = "+rp(per*g)+(g>s+0.5?" · melebihi sisa ("+num2(Math.max(0,s))+" g), stok akan minus":""); }
      ket();
      beanBox.append(el("div",null,el("div",{class:"row",style:"gap:6px;align-items:center;flex-wrap:nowrap"},
        el("div",{style:"flex:1;min-width:0"},sb), el("div",{style:"width:86px;flex:none"},gi),
        el("span",{style:"font-size:11px;color:var(--ink-3);width:34px;flex:none"},"g"), x), k));
    });

    payBox.append(segCtl(sa
      ? [{v:"cash",t:"Lunas — sudah dicairkan ke kas"},{v:"credit",t:"Belum cair — di saldo platform"}]
      : [{v:"cash",t:"Lunas (kas)"},{v:"credit",t:"Tempo (piutang)"}],
      payment, v=>{ payment=v; payTouched=true;
        if(sa && v==="cash" && !cairTouched) cairI.value = (existing&&existing.payment==="credit") ? todayISO() : dateI.value;
        perbaruiBayar(); sync(); }));
    if(sa) payBox.append(el("div",{class:"hint"},
      payment==="credit" ? "Dana masih di "+accName(sa)+" — dihitung sebagai saldo, bukan piutang."
                         : "Dana sudah dicairkan, jadi langsung masuk Kas & Bank."));
  }
  const payBox=el("div");
  dateI.addEventListener("change",()=>{ if(!cairTouched && !(existing&&existing.payment==="credit")) cairI.value=dateI.value; });
  const discI=moneyInput(t.discount||0);
  const feeI=moneyInput(t.adminFee||0);
  const feeHint=el("div",{class:"hint"});
  chanI.addEventListener("change",()=>{
    const ch=chanI.value;
    lines.forEach(L=>{ const sk=S.skus[L.skuId]; if(sk) L.unitPrice=priceFor(sk,ch); });
    feeTouched=false;
    if(!acctTouched){ const w=saldoAccOf(ch) ? "1-1000" : normAcc(chanOf(ch).wallet||"1-1000"); if(ACC[w]) acctI.value=w; }
    /* Penjualan baru di Tokopedia/TikTok masuk saldo dulu; ditandai Lunas nanti saat dicairkan. */
    if(!payTouched) payment = saldoAccOf(ch) ? "credit" : "cash";
    drawLines(); perbaruiBayar(); sync();
  });
  feeI.addEventListener("input",()=>{ feeTouched=true; });
  const mpShipI=moneyInput(t.mpShip||0);
  const appFeeI=moneyInput(t.appFee||0);
  const insFeeI=moneyInput(t.insFee||0);
  const shipChgI=moneyInput(t.shippingCharged||0);
  const shipCostI=moneyInput(t.shippingCost||0);
  const noteI=inp({value:t.note||"",placeholder:"nomor resi, catatan pesanan"});
  const linesBox=el("div",{style:"display:flex;flex-direction:column;gap:6px"});
  const calc=el("div",{class:"calc"});

  function drawLines(){
    linesBox.innerHTML="";
    linesBox.append(el("div",{class:"line-item",style:"font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)"},
      el("span",null,"Produk"),el("span",null,"Qty"),el("span",{class:"r",style:"text-align:right"},"Harga"),el("span",null,"")));
    lines.forEach((L,i)=>{
      const s=selGroup([
          {label:"Kopi biji & bubuk", options:skus.filter(x=>!isRTD(x)).map(x=>({v:x.id,t:x.name}))},
          {label:"Kopi botolan", options:skus.filter(isRTD).map(x=>({v:x.id,t:x.name}))}],
        L.skuId,{onchange:e=>{ L.skuId=e.target.value;
        delete L.beans;                       // timpaan resep milik produk lama
        delete L.batches;                     // begitu juga pilihan batchnya
        const sk=S.skus[L.skuId]; if(sk) { L.unitPrice=priceFor(sk,chanI.value); drawLines(); } sync(); }});
      const q=qtyInput(L.qty,{oninput:e=>{L.qty=numVal(e.target); gambarBatch(); perbaruiHint(); sync();}});
      // hintEl & gambarBatch dideklarasikan di bawah; keduanya terhoist lewat fungsi
      const p=moneyInput(L.unitPrice,{oninput:e=>{L.unitPrice=numVal(e.target);sync();}});
      const x=el("button",{class:"x",type:"button",title:"Hapus baris",onclick:()=>{ lines.splice(i,1); if(!lines.length) lines.push({skuId:skus[0].id,qty:1,unitPrice:skus[0].price||0,disc:0}); drawLines(); sync(); }},"×");
      const c=skuCost(S.skus[L.skuId], L);
      const sk=S.skus[L.skuId];
      const saran = sk ? priceFor(sk,chanI.value) : 0;
      const beda = sk && Math.abs((+L.unitPrice||0)-saran)>0.5;
      const batchBox=el("div",{style:"display:flex;flex-direction:column;gap:8px;padding:2px 0 6px"});
      /* Satu baris penjualan bisa ditarik dari beberapa batch sekaligus —
         1,5 kg jarang muat di satu batch roasting. */
      function gambarBatch(){
        batchBox.innerHTML="";
        const sk2=S.skus[L.skuId]; if(!sk2) return;
        L.batches = L.batches || {};
        for(const bn of lineBeans(L,sk2)) batchBox.append(kotakBean(bn));
      }
      function kotakBean(bn){
        const gbNama=(S.greenbeans[bn.greenbeanId]||{}).name||"?";
        const dipakai=(L.batches&&Array.isArray(L.batches[bn.greenbeanId]))
          ? L.batches[bn.greenbeanId].map(a=>a&&a.id) : [lineBatchId(L,bn.greenbeanId)];
        /* Hanya batch dan stok yang masih bersisa yang ditawarkan, roast level
           apa pun. Batch yang sudah terpilih di transaksi ini tetap tampil walau
           kini habis, supaya transaksi lama masih bisa dibuka dan diperbaiki. */
        const semuaOpsi=batchTersedia(bn.greenbeanId, t.id, dipakai);
        const opsi=semuaOpsi.filter(o=>!o.habis);
        const box=el("div",{style:"display:flex;flex-direction:column;gap:4px"});
        if(!semuaOpsi.length){
          const pernah=Object.values(S.txns).some(x=>x.type==="roast"&&x.greenbeanId===bn.greenbeanId);
          box.append(el("div",{style:"font-size:11px;color:var(--warn)"},
            pernah ? "Stok roast bean "+gbNama+" sudah habis — catat roasting baru dulu."
                   : "Belum ada batch roasting untuk "+gbNama+" — catat roasting dulu agar kode batch muncul di invoice."));
          return box;
        }
        const butuh=(+L.qty||0)*bn.gram;
        const awal=()=> (opsi[0]||semuaOpsi[0]).id;
        // bentuk lama (satu batch berupa teks / kunci bean::level) dinaikkan ke daftar alokasi
        let al=L.batches[bn.greenbeanId];
        if(!Array.isArray(al)){
          const lama=lineBatchId(L,bn.greenbeanId);
          Object.keys(L.batches).forEach(k=>{
            if(k!==bn.greenbeanId && k.indexOf(bn.greenbeanId+"::")===0) delete L.batches[k]; });
          al=[{id:(lama&&S.txns[lama])?lama:awal(), gram:butuh}];
        }
        al=al.filter(a=>a&&a.id&&(S.txns[a.id]||String(a.id).indexOf(NOBATCH)===0));
        if(!al.length) al=[{id:awal(), gram:butuh}];
        const sisaOpsi=id=>{ const o=semuaOpsi.find(x=>x.id===id); return o?o.sisa:0; };
        // Satu batch: gram mengikuti kebutuhan, tapi tidak melebihi sisa batch itu —
        // kekurangannya langsung terlihat supaya tinggal ditambah batch berikutnya.
        if(al.length===1) al[0].gram=Math.min(butuh, sisaOpsi(al[0].id));
        L.batches[bn.greenbeanId]=al;
        const terisi=()=>al.reduce((n,a)=>n+(+a.gram||0),0);
        const labelOpsi=o=> o.kode+"  ·  "+o.level+(o.date?"  ·  "+fmtDate(o.date):"")+
          "  ·  "+(o.habis?"habis":"sisa "+num2(o.sisa)+" g");

        al.forEach((a,j)=>{
          const sb=sel(semuaOpsi.map(o=>({v:o.id, t:labelOpsi(o)})), a.id,
            {onchange:e=>{
              a.id=e.target.value;
              if(al.length>1){
                const muat=butuh-terisi()+(+a.gram||0);       // ruang yang bisa diisi baris ini
                a.gram=Math.max(0, Math.min(sisaOpsi(a.id), muat));
              }
              gambarBatch(); sync();
            }});
          const gi=qtyInput(a.gram,{oninput:e=>{ a.gram=numVal(e.target); ringkas(); },
            style:"text-align:right", disabled: al.length===1 ? "" : null});
          const hapus=el("button",{class:"x",type:"button",title:"Hapus batch",
            onclick:()=>{ al.splice(j,1); gambarBatch(); sync(); }},"×");
          const lebihSisa=(+a.gram||0) > sisaOpsi(a.id)+1e-6;
          box.append(el("div",null,
            el("div",{class:"row",style:"gap:6px;align-items:center"},
              el("span",{style:"font-size:10px;letter-spacing:.06em;color:var(--ink-3);min-width:52px"},
                j===0?"BATCH":""),
              el("div",{style:"flex:1;min-width:0"},sb),
              el("div",{style:"width:82px;flex:none"},gi),
              el("span",{style:"font-size:11px;color:var(--ink-3)"},"g"),
              al.length>1?hapus:el("span",{style:"width:22px;flex:none"})),
            lebihSisa
              ? el("div",{style:"font-size:11px;color:var(--warn);padding:2px 0 0 58px"},
                  "Melebihi sisa batch ini (" + num2(sisaOpsi(a.id)) + " g) — stok akan minus.")
              : null));
        });

        const ringkasBaris=el("div",{style:"font-size:11px;padding:0 0 0 58px"});
        function ringkas(){
          const isi=terisi(), kurang=butuh-isi;
          const warna = Math.abs(kurang)<=0.5 ? "var(--ink-3)" : "var(--warn)";
          ringkasBaris.style.color=warna;
          ringkasBaris.textContent = gbNama+" · butuh "+num2(butuh)+" g · terisi "+num2(isi)+" g · "+
            (kurang>0.5 ? "kurang "+num2(kurang)+" g"
             : kurang<-0.5 ? "lebih "+num2(-kurang)+" g (kelebihan tidak dipakai)"
             : "pas");
        }
        ringkas();
        box.append(ringkasBaris);

        const belum=opsi.filter(o=>!al.some(a=>a.id===o.id));
        if(belum.length) box.append(el("button",{class:"btn sm",type:"button",
          style:"align-self:flex-start;margin-left:58px",
          onclick:()=>{
            const kurang=Math.max(0, butuh-terisi());
            const o=belum[0];
            al.push({id:o.id, gram:Math.max(0, Math.min(o.sisa, kurang))});
            gambarBatch(); sync();
          }},"+ Tambah batch"));
        return box;
      }
      /* Penyunting isi baris: dipakai untuk pesanan khusus — gramasi tidak
         standar atau bean diganti — tanpa membuat produk baru. */
      const beanBox=el("div",{style:"display:flex;flex-direction:column;gap:4px;padding:2px 0 0"});
      const hintEl=el("div",{style:"font-size:11px;color:var(--ink-3);padding:2px 0 2px"});
      function perbaruiHint(){
        const sk3=S.skus[L.skuId]; const c3=skuCost(sk3,L);
        const saran3=sk3?priceFor(sk3,chanI.value):0;
        const beda3=sk3 && Math.abs((+L.unitPrice||0)-saran3)>0.5;
        if(isRTD(sk3)){
          /* Botolan: tampilkan stok botol jadi, bukan batch roasting. Pemakaian
             transaksi ini sendiri dikembalikan dulu saat diedit. */
          const sendiri=((existing&&existing.lines)||[]).filter(x=>x.skuId===L.skuId).reduce((n,x)=>n+(+x.qty||0),0);
          const lain=lines.filter(x=>x!==L && x.skuId===L.skuId).reduce((n,x)=>n+(+x.qty||0),0);
          const stok=(((BOOKS.inv.fg||{})[L.skuId]||{qty:0}).qty)+sendiri-lain;
          const kurang=(+L.qty||0)>stok+1e-6;
          const lot=lotAktif(L.skuId)[0];
          hintEl.style.color = kurang ? "var(--warn)" : "var(--ink-3)";
          hintEl.textContent="Botolan · stok "+num2(stok)+" btl"+(lot&&lot.exp?" · exp terdekat "+fmtDate(lot.exp):"")
            +" · HPP "+rp(c3.total)+"/btl"+(c3.est?" (perkiraan resep)":"")
            +(kurang?" — stok kurang, catat produksinya dulu (stok akan minus)":"")
            +(beda3?"  ·  harga "+chanI.value+": "+rp(saran3):"");
          return;
        }
        hintEl.style.color="var(--ink-3)";
        const khusus=Array.isArray(L.beans)&&L.beans.length;
        hintEl.textContent=(khusus?"Isi khusus · ":"")+"HPP satuan "+rp(c3.total)
          +(c3.parts.length?" — "+c3.parts.map(pp=>pp.n).join(" + "):" — resep belum diisi")
          +(beda3?"  ·  harga "+chanI.value+": "+rp(saran3):"");
      }
      function gambarBean(){
        beanBox.innerHTML="";
        const sk2b=S.skus[L.skuId]; if(!sk2b) return;
        const khusus=Array.isArray(L.beans)&&L.beans.length;
        const tombol=el("button",{class:"btn sm gho",type:"button",
          style:"align-self:flex-start;padding:1px 6px;font-size:11px",
          onclick:()=>{
            if(khusus) delete L.beans;
            else L.beans=lineBeans(L,sk2b).map(b=>({...b}));
            gambarBean(); gambarBatch(); perbaruiHint(); sync();
          }}, khusus ? "pakai resep produk lagi" : "ubah isi untuk baris ini");
        if(!khusus){ beanBox.append(tombol); return; }
        const gbs=Object.values(S.greenbeans).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
        L.beans.forEach((b,j)=>{
          const gsel=sel(gbs.map(g=>({v:g.id,t:g.name})), b.greenbeanId,
            {onchange:e=>{ b.greenbeanId=e.target.value; gambarBean(); gambarBatch(); perbaruiHint(); sync(); }});
          const lsel=sel(ROAST_LEVELS.map(x=>({v:x,t:x})), normLevel(b.roastLevel),
            {onchange:e=>{ b.roastLevel=e.target.value; gambarBean(); gambarBatch(); perbaruiHint(); sync(); }});
          const gi=qtyInput(b.gram,{oninput:e=>{ b.gram=numVal(e.target); perbaruiHint(); sync(); },
            style:"text-align:right"});
          beanBox.append(el("div",{class:"row",style:"gap:6px;align-items:center;flex-wrap:nowrap"},
            el("span",{style:"font-size:10px;letter-spacing:.06em;color:var(--ink-3);min-width:52px"},
              j===0?"ISI":""),
            el("div",{style:"flex:1;min-width:0"},gsel),
            el("div",{style:"width:104px;flex:none"},lsel),
            el("div",{style:"width:72px;flex:none"},gi),
            el("span",{style:"font-size:11px;color:var(--ink-3);width:12px;flex:none"},"g"),
            L.beans.length>1
              ? el("button",{class:"x",type:"button",title:"Hapus bean",
                  onclick:()=>{ L.beans.splice(j,1); gambarBean(); gambarBatch(); perbaruiHint(); sync(); }},"×")
              : el("span",{style:"width:22px;flex:none"})));
        });
        beanBox.append(el("div",{class:"row",style:"gap:8px;margin-left:58px"},
          el("button",{class:"btn sm",type:"button",onclick:()=>{
            L.beans.push({greenbeanId:gbs[0].id, gram:0, roastLevel:DEFAULT_LEVEL});
            gambarBean(); gambarBatch(); perbaruiHint(); sync();
          }},"+ Tambah bean"), tombol));
      }
      const rtdBaris=isRTD(S.skus[L.skuId]);
      if(rtdBaris){ delete L.beans; delete L.batches; delete L.grind; }
      else { gambarBean(); gambarBatch(); }
      perbaruiHint();
      if(!rtdBaris) L.grind=normGrind(L.grind);
      const grindI=sel(GRIND_OPTS.map(g=>({v:g, t:g==="Beans"?"Beans — biji utuh, tidak digiling":"Giling "+g})),
        normGrind(L.grind), {onchange:e=>{ L.grind=e.target.value; }});
      const grindRow=el("div",{class:"row",style:"gap:6px;align-items:center;padding:2px 0 4px"},
        el("span",{style:"font-size:10px;letter-spacing:.06em;color:var(--ink-3);min-width:52px"},"GILINGAN"),
        el("div",{style:"flex:1;min-width:0"},grindI));
      linesBox.append(el("div",null, el("div",{class:"line-item"},s,q,p,x),
        hintEl, rtdBaris?null:beanBox, rtdBaris?null:grindRow, rtdBaris?null:batchBox));
    });
    linesBox.append(el("button",{class:"btn sm",type:"button",style:"align-self:flex-start",
      onclick:()=>{ lines.push({skuId:skus[0].id,qty:1,unitPrice:priceFor(skus[0],chanI.value),disc:0}); drawLines(); sync(); }},"+ Tambah produk"));
  }
  /* Packing luar: dipilih sendiri tiap pesanan, karena satu kiriman pakai
     satu kardus berapa pun isinya. Kosong = ambil di tempat / tanpa packing. */
  let packing = JSON.parse(JSON.stringify(t.packing||[]));
  const packBox=el("div",{style:"display:flex;flex-direction:column;gap:7px"});
  const hargaSup=id=>{ const b=BOOKS.inv.sup[id]||{qty:0,val:0,last:0};
    return b.qty>0 ? b.val/b.qty : (+b.last||0); };
  /* Saat transaksi ini dibuka lagi, pemakaiannya sendiri dikembalikan dulu —
     sama seperti pemilih batch — supaya sisanya tidak terlihat lebih sedikit
     daripada yang sebenarnya bisa dipakai. */
  const sisaSup=id=>{
    const kini=(BOOKS.inv.sup[id]||{qty:0}).qty;
    const sendiri=((existing&&existing.packing)||[])
      .filter(p=>p.supplyId===id).reduce((n,p)=>n+(+p.qty||0),0);
    return kini+sendiri;
  };
  const satuanSup=id=>(S.supplies[id]||{}).unit||"pcs";
  const totalPacking=()=>packing.reduce((n,p)=>n+(+p.qty||0)*hargaSup(p.supplyId),0);
  function gambarPacking(){
    packBox.innerHTML="";
    const pool=Object.values(S.supplies).sort((a,b)=>
      (a.category||"").localeCompare(b.category||"") || String(a.name).localeCompare(String(b.name)));
    if(!pool.length){
      packBox.append(el("div",{class:"hint"},"Belum ada kemasan atau bahan yang tercatat."));
      return;
    }
    packing.forEach((p,i)=>{
      const pilih=sel(pool.map(x=>({v:x.id,
        t:x.name+"  ·  sisa "+num2(sisaSup(x.id))+" "+(x.unit||"pcs")})), p.supplyId,
        {onchange:e=>{ p.supplyId=e.target.value; gambarPacking(); sync(); }});
      const ket=el("div",{style:"font-size:11px;padding:2px 0 0 2px"});
      function perbarui(){
        const sisa=sisaSup(p.supplyId), u=satuanSup(p.supplyId), q=+p.qty||0;
        const kurang=q>sisa+1e-6;
        ket.style.color = kurang ? "var(--warn)" : "var(--ink-3)";
        ket.textContent = kurang
          ? "Sisa cuma "+num2(sisa)+" "+u+" — boleh disimpan, tapi stok akan minus."
          : rp(hargaSup(p.supplyId))+"/"+u+"  ·  dipakai "+rp(q*hargaSup(p.supplyId));
      }
      const qi=qtyInput(p.qty,{oninput:e=>{ p.qty=numVal(e.target); perbarui(); sync(); },
        style:"text-align:right"});
      perbarui();
      packBox.append(el("div",null,
        el("div",{class:"row",style:"gap:6px;align-items:center;flex-wrap:nowrap"},
          el("div",{style:"flex:1;min-width:0"},pilih),
          el("div",{style:"width:72px;flex:none"},qi),
          el("span",{style:"font-size:11px;color:var(--ink-3);width:28px;flex:none"},satuanSup(p.supplyId)),
          el("button",{class:"x",type:"button",title:"Hapus packing",
            onclick:()=>{ packing.splice(i,1); gambarPacking(); sync(); }},"×")),
        ket));
    });
    packBox.append(el("button",{class:"btn sm",type:"button",style:"align-self:flex-start",
      onclick:()=>{
        const dipakai=new Set(packing.map(p=>p.supplyId));
        const o=pool.find(x=>!dipakai.has(x.id))||pool[0];
        packing.push({supplyId:o.id, qty:1}); gambarPacking(); sync();
      }}, packing.length ? "+ Tambah packing" : "+ Pakai packing luar"));
  }

  function sync(){
    let bruto=0,cogs=0;
    lines.forEach(L=>{ const sk=S.skus[L.skuId]; const c=skuCost(sk,L);
      bruto += (+L.qty||0)*(+L.unitPrice||0)-(+L.disc||0); cogs += (+L.qty||0)*c.total; });
    const disc=numVal(discI);
    const rev=bruto-disc;
    const ch=chanOf(chanI.value), feePct=+ch.fee||0;
    if(!feeTouched && feePct>0) feeI.value=fmtNum(Math.round(rev*feePct/100));
    const fee=numVal(feeI);
    feeHint.textContent = feePct>0
      ? "Otomatis "+num2(feePct)+"% dari omzet bersih sesuai pengaturan saluran "+ch.name+". Ganti dengan potongan sebenarnya dari marketplace."
      : "Potongan yang ditanggung Moerup sebagai penjual — tidak tercetak di invoice pembeli. Atur persentase bawaannya di Pengaturan → Saluran penjualan.";
    const sc=numVal(shipChgI), so=numVal(shipCostI);
    const mpS=numVal(mpShipI), appF=numVal(appFeeI), insF=numVal(insFeeI);
    const tagihan=rev+sc+mpS+appF+insF;      // yang dibayar pembeli, sama dengan total invoice
    const pack=totalPacking();
    const kotor=rev-cogs-pack, bersih=kotor-fee+sc-so;
    calc.innerHTML="";
    const L=(a,b,cls)=>el("div",{class:"l"+(cls?" "+cls:"")},el("span",null,a),el("span",null,b));
    const masuk=rev+sc-fee;           // yang diterima dari pembeli
    const kasBersih=masuk-so;         // setelah ongkir dibayarkan ke kurir
    /* calc.append milik DOM, bukan el() — nilai null akan tercetak jadi tulisan
       "null". Barisnya disaring dulu. */
    [ L("Omzet bruto", rp(bruto)),
      disc>0 && L("Diskon / promo", "− "+rp(disc)),
      L("Omzet bersih", rp(rev),"b"),
      L(lines.some(L2=>isRTD(S.skus[L2.skuId])) ? "HPP produk (biji/bubuk + botolan)" : "HPP produk (bean + kemasan + stiker)", "− "+rp(cogs)),
      pack>0 && L("Packing luar kiriman ini", "− "+rp(pack)),
      L("Laba kotor", rpS(kotor)+(rev>0?"  ·  "+pct(kotor/rev*100):""),"b"),
      fee>0 && L("Biaya admin marketplace", "− "+rp(fee)),
      sc>0 && L("Ongkir ditagih ke pelanggan", "+ "+rp(sc)),
      so>0 && L("Ongkir dibayar ke kurir", "− "+rp(so)),
      (mpS||appF||insF) && L("Dibayar pembeli ke marketplace", rp(mpS+appF+insF)),
      L("Total tagihan di invoice", rp(tagihan),"b"),
      (()=>{ const sa=platformNow();
        return sa ? L(payment==="credit" ? "Masuk "+accName(sa)+" (belum dicairkan)" : "Masuk "+accName(sa)+", dicairkan ke "+accName(acctI.value), rp(masuk),"b")
                  : L(payment==="credit"?"Masuk piutang":"Masuk ke "+accName(acctI.value), rp(masuk),"b"); })(),
      so>0 && L("Kas bersih setelah bayar kurir", rp(kasBersih),"b"),
      L("Laba bersih transaksi", rpS(bersih)+(rev>0?"  ·  "+pct(bersih/rev*100):""),"b")
    ].filter(Boolean).forEach(x=>calc.append(x));

    el("div",{class:"grid g2"}, field("Estimasi kirim",shipEtaI), field("Nomor resi",shipResiI)),
    el("div",null, el("span",{class:"eyebrow",style:"display:block;margin-bottom:6px"},"Produk terjual"), linesBox),
    el("div",null,
      el("span",{class:"eyebrow",style:"display:block;margin-bottom:6px"},"Packing luar kiriman (opsional)"),
      packBox,
      el("div",{class:"hint"},"Kardus, bubble wrap, lakban — dipakai sekali per kiriman, bukan per pcs, jadi tidak bisa ikut resep produk. Kosongkan kalau pembeli ambil di tempat.")),
    el("div",{class:"grid g2"},
      field("Diskon / promo (Rp)",discI,"Potongan untuk transaksi ini. Masuk ke Potongan Penjualan & Diskon, bukan mengurangi omzet diam-diam."),
      el("div",null,field("Biaya admin marketplace",feeI),feeHint)),
    el("label",{class:"f"},acctLbl,acctI,acctHint),
    el("div",{class:"grid g2"},
      field("Ongkir ditagih ke pelanggan",shipChgI,"Masuk sebagai Pendapatan Ongkir."),
      field("Ongkir dibayar ke kurir",shipCostI,"Masuk sebagai Beban Ongkir Penjualan.")),
    el("div",null,
      el("span",{class:"eyebrow",style:"display:block;margin-bottom:6px"},"Dibayar pembeli ke marketplace"),
      el("div",{class:"grid g3"},
        field("Ongkir",mpShipI),
        field("Biaya layanan aplikasi",appFeeI),
        field("Asuransi pengiriman",insFeeI)),
      el("div",{class:"hint"},"Dipungut marketplace langsung dari pembeli dan tidak pernah lewat rekening Moerup. Tercetak di invoice miliknya, tapi tidak masuk laba rugi maupun saldo dompetmu. Untuk penjualan langsung yang ongkirnya kamu tagih dan kamu bayar sendiri, pakai dua kolom ongkir di atas.")),
    field("Status pembayaran",payCtl),
    cairRow,
    field("Catatan (opsional)",noteI),
    calc
  ];
  const foot=[ existing?el("button",{class:"btn dgr",onclick:()=>confirmDelete("penjualan ini",async()=>{
      await Store.delTxn(t.id); recompute(); render(); toast("Penjualan dihapus."); })},"Hapus"):null,
    el("span",{style:"flex:1"}),
    el("button",{class:"btn",onclick:closeModal},"Batal"),
    el("button",{class:"btn pri",onclick:async()=>{
      const rec={id:t.id,type:"sale",date:dateI.value,seq:t.seq||Date.now(),
        customerId:custId, customer:(S.customers[custId]||{}).name||"",
        poRef:poI.value.trim(), shipVia:shipViaI.value.trim(), shipEta:shipEtaI.value.trim(), shipResi:shipResiI.value.trim(),
        invoiceNo:t.invoiceNo||"", channel:chanI.value,
        lines:lines.filter(L=>(+L.qty||0)>0),shippingCharged:numVal(shipChgI),shippingCost:numVal(shipCostI),
        discount:numVal(discI),adminFee:numVal(feeI),
        mpShip:numVal(mpShipI),appFee:numVal(appFeeI),insFee:numVal(insFeeI),
        account:acctI.value,payment,note:noteI.value.trim(),
        cairDate:(platformNow() && payment!=="credit") ? (cairI.value||dateI.value) : "",
        packing:packing.filter(p=>p.supplyId && (+p.qty||0)>0).map(p=>({supplyId:p.supplyId, qty:+p.qty||0}))};
      if(!rec.lines.length){ toast("Isi minimal satu produk dengan qty."); return; }
      closeModal(); existing?await Store.replaceTxn(rec):await Store.putTxn(rec);
      recompute(); render(); toast("Penjualan tersimpan.");
      if(rec.customer) openModal("Penjualan tersimpan",
        [el("p",{style:"color:var(--ink-2)"},"Buat invoice untuk "+rec.customer+"? File PDF-nya bisa langsung kamu kirim ke pelanggan.")],
        [el("button",{class:"btn",onclick:closeModal},"Nanti saja"),
         el("button",{class:"btn pri",onclick:async()=>{ closeModal(); await invoicePDF(S.txns[rec.id]||rec); }},"Buat invoice")]);
    }},"Simpan penjualan")];
  openModal(existing?"Ubah penjualan":"Penjualan baru", body, foot);
  [shipChgI,shipCostI,discI,feeI,mpShipI,appFeeI,insFeeI].forEach(i=>i.addEventListener("input",sync));
  drawLines(); gambarPacking(); perbaruiBayar(); sync();
}

  const t=el("table"); t.append(el("thead",null,el("tr",null,el("th",null,"Tanggal"),el("th",null,"Supplier"),

    el("th",{class:"r"},"Total"),el("th",null,"Bayar"),el("th",null,""))));
  const tb=el("tbody");

    const names=(p.lines||[]).map(l=>{
      const it = p.kind==="greenbean"? S.greenbeans[l.itemId] : p.kind==="supply"? S.supplies[l.itemId] : {name:l.itemId};
      if(l.mode==="pack" && (+l.packQty||0)>0) return (it?it.name:"?")+" ×"+num2(l.packQty)+" pcs ("+num2(l.qty)+" "+((it&&it.unit)||"")+")";
      return (it?it.name:"?")+" ×"+num2(l.qty)+(p.kind==="supply"&&it&&it.unit&&it.unit!=="pcs"?" "+it.unit:""); }).join(", ");
    tb.append(el("tr",{class:"hov"},
      el("td",{class:"num",style:"white-space:nowrap"},fmtDate(p.date)),el("td",null,p.party||"—"),
      el("td",null,el("span",{class:"pill m"},p.kind==="greenbean"?"Green bean":p.kind==="supply"
        ?((p.lines||[]).some(l=>isBahanMinuman(S.supplies[l.itemId]))?"Bahan minuman":"Kemasan"):"Peralatan")),

      el("td",null,el("span",{class:"pill "+(p.payment==="credit"?"w":"p")},p.payment==="credit"?"Tempo":"Lunas")),

function formPurchase(kind, existing, opsi){
  opsi=opsi||{};
  kind = existing? existing.kind : kind;
  const isAsset = kind==="asset";
  let pool = kind==="greenbean" ? Object.values(S.greenbeans) : Object.values(S.supplies);
  /* Pembelian bahan minuman: bahan ditaruh di urutan atas pilihan. */
  const bahanDulu = !!opsi.minuman || !!(existing && (existing.lines||[]).some(l=>isBahanMinuman(S.supplies[l.itemId])));
  if(kind==="supply"){
    const bb=pool.filter(isBahanMinuman), km=pool.filter(x=>!isBahanMinuman(x));
    pool = bahanDulu ? bb.concat(km) : km.concat(bb);
  }
  if(!isAsset && (!pool.length || (opsi.minuman && !pool.some(isBahanMinuman)))){ return openModal("Data master kosong",
    [el("p",{style:"color:var(--ink-2)"},"Tambahkan "+(kind==="greenbean"?"green bean":opsi.minuman?"bahan minuman (susu, gula aren, dll.)":"kemasan / bahan")+" di menu Produk & Aset dulu.")],
    [el("button",{class:"btn pri",onclick:()=>{closeModal(); masterTab=opsi.minuman?"bb":kind==="greenbean"?"gb":"sup"; location.hash="#/master"; render();}},"Buka Produk & Aset")]); }

  const awal=pool[0]||{};
  const t=existing||{id:uid(),type:"purchase",kind,date:todayISO(),party:"",
    lines:[kind==="supply" && (+awal.packSize||0)>1
      ? {itemId:awal.id,mode:"pack",packQty:1,packPrice:+awal.refPrice||0,qty:+awal.packSize,unitPrice:(+awal.refPrice||0)/(+awal.packSize)}
      : {itemId:awal.id||"",qty:kind==="greenbean"?1000:100,unitPrice:0}],
    freight:0,otherCost:0,payment:"cash",note:"",assetName:"",lifeMonths:48,residual:0};
  let lines=JSON.parse(JSON.stringify(t.lines||[]));
  /* Baris bahan bisa diisi per kemasan (12 kotak × Rp 19.500) atau per satuan
     dasar (12.000 ml × Rp 19,5). Mesin akuntansi selalu menerima satuan dasar. */
  const isiKemasan = id => kind==="supply" ? (+((S.supplies[id]||{}).packSize)||0) : 0;
  /* Isi kemasan yang tercatat di baris itu sendiri didahulukan, supaya nota
     lama tidak berubah nilainya kalau isi kemasan di data master diganti. */
  const isiBaris = L => (+L.packSize||0)>0 ? +L.packSize : isiKemasan(L.itemId);
  const modeBaris = L => (L.mode==="pack" && isiBaris(L)>0) ? "pack" : "base";
  function dasarBaris(L){
    if(modeBaris(L)==="pack"){ const isi=isiBaris(L);
      return {qty:(+L.packQty||0)*isi, unitPrice:isi>0?(+L.packPrice||0)/isi:0}; }
    return {qty:+L.qty||0, unitPrice:+L.unitPrice||0};
  }
  const nilaiBaris = L => { const d=dasarBaris(L); return d.qty*d.unitPrice; };
  let payment=t.payment||"cash";
  const dateI=inp({type:"date",value:t.date});
  const partyI=inp({value:t.party||"",placeholder:"Nama supplier"});
  const freightI=moneyInput(t.freight||0);
  const otherI=moneyInput(t.otherCost||0);
  const noteI=inp({value:t.note||"",placeholder:"nomor nota, catatan"});
  const payAcctI=moneySel(t.account);
  const bankI=bankFeeInput(existing?t:null);
  const linesBox=el("div",{style:"display:flex;flex-direction:column;gap:6px"});
  const calc=el("div",{class:"calc"});
  const assetNameI=inp({value:t.assetName||"",placeholder:"mis. Roaster 1 kg Gene Cafe"});
  const assetCostI=moneyInput((t.lines&&t.lines[0]?t.lines[0].unitPrice:0)||0);
  const lifeI=qtyInput(t.lifeMonths!=null && t.lifeMonths!=="" ? t.lifeMonths : 48);
  // kosong = 48 bulan; 0 sengaja diisi = barang habis pakai, langsung jadi beban
  const umurBulan=()=> String(lifeI.value).trim()==="" ? 48 : Math.max(0, Math.round(numVal(lifeI)));
  const residI=moneyInput(t.residual||0);

  function barisBaru(id){
    const it=S.supplies[id]||{};
    return (kind==="supply" && (+it.packSize||0)>0)
      ? {itemId:id,mode:"pack",packQty:1,packPrice:+it.refPrice||0}
      : {itemId:id,qty:0,unitPrice:0};
  }
  function drawLines(){
    linesBox.innerHTML="";
    const unit = kind==="greenbean" ? "gram" : "satuan";
    linesBox.append(el("div",{class:"line-item",style:"font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)"},
      el("span",null,"Barang"),el("span",null,kind==="greenbean"?"Qty (gram)":"Jumlah"),el("span",{style:"text-align:right"},kind==="greenbean"?"Harga/g":"Harga"),el("span",null,"")));
    lines.forEach((L,i)=>{
      const s = kind==="supply"
        ? selGroup(supGroups(pool, bahanDulu), L.itemId, {onchange:e=>{ const baru=barisBaru(e.target.value); Object.keys(L).forEach(k=>delete L[k]); Object.assign(L,baru); drawLines(); sync(); }})
        : sel(pool.map(x=>({v:x.id,t:x.name})),L.itemId,{onchange:e=>{L.itemId=e.target.value;sync();}});
      const pack = modeBaris(L)==="pack";
      const q=qtyInput(pack?L.packQty:L.qty,{oninput:e=>{ if(pack) L.packQty=numVal(e.target); else L.qty=numVal(e.target); ket(); sync(); }});
      const p=qtyInput(pack?L.packPrice:L.unitPrice,{oninput:e=>{ if(pack) L.packPrice=numVal(e.target); else L.unitPrice=numVal(e.target); ket(); sync(); }});
      const x=el("button",{class:"x",type:"button",onclick:()=>{lines.splice(i,1); if(!lines.length) lines.push(barisBaru(pool[0].id)); drawLines(); sync();}},"×");
      const ketBox=el("div",{style:"font-size:11px;color:var(--ink-3);padding:2px 0 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"});
      function ket(){
        ketBox.innerHTML="";
        if(kind!=="supply") return;
        const it=S.supplies[L.itemId]||{}; const u=it.unit||"pcs"; const isi=isiBaris(L);
        const d=dasarBaris(L);
        const teks = pack
          ? num2(+L.packQty||0)+" pcs × "+num2(isi)+" "+u+" = "+num2(d.qty)+" "+u+"  ·  "+rpU(d.unitPrice)+"/"+u
          : "Jumlah dalam "+u+", harga per "+u+(d.qty>0&&d.unitPrice>0?"  ·  "+rp(d.qty*d.unitPrice):"");
        ketBox.append(el("span",null,teks));
        if(isi>0) ketBox.append(el("button",{class:"btn sm gho",type:"button",style:"padding:0 6px;font-size:11px",
          onclick:()=>{ const dd=dasarBaris(L);
            if(pack){ L.mode="base"; L.qty=dd.qty; L.unitPrice=dd.unitPrice; }
            else { L.mode="pack"; L.packQty=isi>0?dd.qty/isi:0; L.packPrice=dd.unitPrice*isi; }
            drawLines(); sync(); }}, pack ? "isi per "+u : "isi per kemasan (pcs)"));
        else if(isBahanMinuman(it)) ketBox.append(el("span",{style:"color:var(--warn)"},"Isi per kemasan belum diatur — atur di Produk & Aset → Bahan minuman supaya bisa diisi per pcs."));
      }
      ket();
      linesBox.append(el("div",null,el("div",{class:"line-item"},s,q,p,x),ketBox));
    });
    if(kind==="greenbean") linesBox.append(el("div",{class:"hint"},"Tip: 1 kg = 1.000 gram. Harga per gram, jadi Rp 55.000/kg ditulis 55."));
    linesBox.append(el("button",{class:"btn sm",type:"button",style:"align-self:flex-start",
      onclick:()=>{ const dipakai=new Set(lines.map(l=>l.itemId)); const o=pool.find(x=>!dipakai.has(x.id))||pool[0];
        lines.push(kind==="supply"?barisBaru(o.id):{itemId:o.id,qty:0,unitPrice:0}); drawLines(); sync();}},"+ Tambah baris"));
  }
  function sync(){
    const base = isAsset ? numVal(assetCostI) : lines.reduce((s,L)=>s+nilaiBaris(L),0);
    const extra=numVal(freightI)+numVal(otherI);
    calc.innerHTML="";
    const L=(a,b,cls)=>el("div",{class:"l"+(cls?" "+cls:"")},el("span",null,a),el("span",null,b));
    calc.append(L("Nilai barang",rp(base)), L("Ongkir & biaya lain",rp(extra)));
    if(kind==="supply"){
      /* Kemasan dan bahan minuman masuk akun persediaan yang berbeda. */
      const perAkun={};
      lines.forEach(L2=>{ const v=nilaiBaris(L2); const sh=base>0?extra*(v/base):0; const a=supAcc(L2.itemId); perAkun[a]=(perAkun[a]||0)+v+sh; });
      Object.entries(perAkun).forEach(([a,v])=>calc.append(L("Masuk "+accName(a),rp(v),"b")));
    } else calc.append(L("Total masuk "+(isAsset?"Peralatan & Mesin":"Persediaan Green Bean"),rp(base+extra),"b"));
    calc.append(L(payment==="credit"?"Menambah Hutang Usaha":"Mengurangi Kas & Bank", rp(base+extra),"b"));
    if(!isAsset && base>0){
      if(kind==="greenbean"){
        const perUnit = lines.reduce((s,L2)=>s+(+L2.qty||0),0);
        if(perUnit>0) calc.append(L("Harga pokok rata-rata setelah ongkir", rp((base+extra)/perUnit)+" / gram"));
      } else {
        // per barang: harga per satuan dasar setelah ongkir dibagi rata sesuai nilai
        lines.forEach(L2=>{ const d=dasarBaris(L2); const it=S.supplies[L2.itemId]; if(!it||d.qty<=0) return;
          const v=d.qty*d.unitPrice; const sh=base>0?extra*(v/base):0;
          calc.append(L("HPP "+it.name+" setelah ongkir", rpU((v+sh)/d.qty)+" / "+(it.unit||"pcs"))); });
      }
    }
    if(isAsset && umurBulan()>0) calc.append(L("Penyusutan per bulan", rp(((base+extra)-numVal(residI))/umurBulan())));
    if(isAsset && umurBulan()===0) calc.append(L("Langsung dibebankan bulan ini", rp((base+extra)-numVal(residI))));
    const bf=payment==="credit"?0:numVal(bankI);
    if(bf>0) calc.append(L("Biaya admin bank","− "+rp(bf)), L("Total uang keluar", rp(base+extra+bf),"b"));
  }
  const payCtl=segCtl([{v:"cash",t:"Tunai / transfer"},{v:"credit",t:"Tempo (hutang)"}],payment,v=>{payment=v;sync();});

  const body = isAsset ? [
      el("div",{class:"grid g2"}, field("Tanggal",dateI), field("Supplier / toko",partyI)),
      field("Nama peralatan",assetNameI),
      el("div",{class:"grid g2"}, field("Harga perolehan",assetCostI), field("Ongkir & biaya pasang",freightI)),
      el("div",{class:"grid g2"}, field("Umur ekonomis (bulan)",lifeI,"48 bulan = 4 tahun. Isi 0 untuk barang habis pakai — langsung jadi beban bulan ini."), field("Nilai sisa",residI,"Perkiraan nilai jual di akhir umur.")),
      field("Status pembayaran",payCtl), field("Dibayar dari",payAcctI),
      field("Biaya admin bank / transfer",bankI,bankFeeHint), field("Catatan",noteI), calc
    ] : [
      el("div",{class:"grid g2"}, field("Tanggal",dateI), field("Supplier",partyI)),
      el("div",null, el("span",{class:"eyebrow",style:"display:block;margin-bottom:6px"},"Barang dibeli"), linesBox),
      el("div",{class:"grid g2"},
        field("Ongkir dari supplier",freightI,"Dibagi rata sesuai nilai tiap barang."),
        field("Biaya lain (bea, packing)",otherI)),
      field("Status pembayaran",payCtl), field("Dibayar dari",payAcctI),
      field("Biaya admin bank / transfer",bankI,bankFeeHint), field("Catatan",noteI), calc ];

  const foot=[ existing?el("button",{class:"btn dgr",onclick:()=>confirmDelete("pembelian ini",async()=>{
      await Store.delTxn(t.id); if(existing.assetId) await Store.deleteCatalogItem("assets",existing.assetId);
      recompute(); render(); toast("Pembelian dihapus."); })},"Hapus"):null,
    el("span",{style:"flex:1"}), el("button",{class:"btn",onclick:closeModal},"Batal"),
    el("button",{class:"btn pri",onclick:async()=>{
      let rec, newAsset=null;
      if(isAsset){
        const cost=numVal(assetCostI)+numVal(freightI);
        if(!assetNameI.value.trim()){ toast("Isi nama peralatannya dulu."); assetNameI.focus(); return; }
        if(!cost){ toast("Harga perolehan masih kosong atau nol."); assetCostI.focus(); return; }
        const aid=existing&&existing.assetId?existing.assetId:uid();
        rec={id:t.id,type:"purchase",kind:"asset",date:dateI.value,seq:t.seq||Date.now(),party:partyI.value.trim(),
          lines:[{itemId:aid,qty:1,unitPrice:numVal(assetCostI)}],freight:numVal(freightI),otherCost:0,
          payment,account:payAcctI.value,bankFee:payment==="credit"?0:numVal(bankI),note:noteI.value.trim(),assetName:assetNameI.value.trim(),assetId:aid,
          lifeMonths:umurBulan(),residual:numVal(residI)};
        newAsset={id:aid,name:assetNameI.value.trim(),date:dateI.value,cost,lifeMonths:umurBulan(),residual:numVal(residI)};
      } else {
        rec={id:t.id,type:"purchase",kind,date:dateI.value,seq:t.seq||Date.now(),party:partyI.value.trim(),
          lines:lines.map(L=>{ const d=dasarBaris(L);
              const o={itemId:L.itemId, qty:d.qty, unitPrice:d.unitPrice};

/* ------------------------------ GAJI KARYAWAN ----------------------------
   Gaji tetap dibukukan sebagai biaya 6-1000, ditambah rincian per karyawan
   untuk slip. Yang dibukukan = uang yang benar-benar dibayarkan (setelah
   potongan): kasbon yang dulu sudah dicatat sebagai biaya gaji cukup dipotong
   di sini, jadi tidak terbebankan dua kali. */
const GAJI_KOMP=[["base","Gaji pokok / upah"],["allowance","Tunjangan"],["overtime","Lembur"],["bonus","Bonus / insentif"]];
const gajiKotor  = e => GAJI_KOMP.reduce((n,[k])=>n+(+e[k]||0),0);
const gajiBersih = e => gajiKotor(e)-(+e.deduction||0);
const karyawanKosong = ()=>({name:"",role:"",base:0,allowance:0,overtime:0,bonus:0,deduction:0,deductionNote:"",note:""});
function riwayatKaryawan(){
  const out={};
  Object.values(S.txns).filter(t=>t.type==="expense"&&t.payroll&&Array.isArray(t.payroll.employees))
    .sort((a,b)=>(a.date+String(a.seq||0)).localeCompare(b.date+String(b.seq||0)))
    .forEach(t=>t.payroll.employees.forEach(e=>{ const n=String(e&&e.name||"").trim();
      if(n) out[n.toLowerCase()]={name:n, role:e.role||"", base:+e.base||0}; }));
  return out;
}
function formPayroll(existing, bawa){
  bawa=bawa||{};
  const t=existing||{id:uid(),type:"expense",accountId:"6-1000",date:bawa.date||todayISO(),
    payment:bawa.payment||"cash",account:bawa.account||"1-1000"};
  const pr=t.payroll||{};
  /* Catatan gaji lama (sebelum ada slip) dibuka sebagai satu baris karyawan,
     supaya bisa dipecah per orang tanpa mengetik ulang. */
  const emps=(Array.isArray(pr.employees)&&pr.employees.length ? pr.employees
      : [{...karyawanKosong(), name:existing?String(t.party||t.note||""):"", base:existing?(+t.amount||0):0}])
    .map(e=>({...karyawanKosong(),...e}));
  const mNow=monthOf(todayISO());
  const per0=pr.period||monthOf(t.date);
  const perOpts=monthsBetween(addMonth(mNow,-12),addMonth(mNow,1)).reverse();
  if(!perOpts.includes(per0)) perOpts.unshift(per0);
  const perI=sel(perOpts.map(m=>({v:m,t:fmtMonth(m)})),per0);
  const dateI=inp({type:"date",value:t.date});
  const acctI=moneySel(t.account);
  const bankI=bankFeeInput(existing?t:(bawa.bankFee!=null?{bankFee:bawa.bankFee}:null));
  let payment=t.payment||"cash";
  const kenal=riwayatKaryawan();
  const dl=el("datalist",{id:"dl-karyawan"}, Object.values(kenal).map(k=>el("option",{value:k.name})));
  const box=el("div",{style:"display:flex;flex-direction:column;gap:10px"});
  const calc=el("div",{class:"calc"});
  function hitung(){
    calc.innerHTML=""; let tot=0;
    const L=(a,b,cls)=>el("div",{class:"l"+(cls?" "+cls:"")},el("span",null,a),el("span",null,b));
    emps.forEach((e,i)=>{ const n=gajiBersih(e); tot+=n;
      calc.append(L((e.name||"Karyawan "+(i+1))+((+e.deduction||0)>0?" · setelah potongan "+rp(e.deduction):""), rpS(n))); });
    calc.append(L("Total dibayarkan → Beban Gaji & Upah", rpS(tot), "b"));
    return tot;
  }
  function gambar(){
    box.innerHTML="";

      const dedI=moneyInput(e.deduction||0); dedI.addEventListener("input",()=>{ e.deduction=numVal(dedI); hitung(); });
      const dedNI=inp({value:e.deductionNote,placeholder:"mis. kasbon 12 Sep"}); dedNI.addEventListener("input",()=>{ e.deductionNote=dedNI.value; });
      const noteI=inp({value:e.note,placeholder:"opsional — ikut tercetak di slip"}); noteI.addEventListener("input",()=>{ e.note=noteI.value; });
      roleI.addEventListener("input",()=>{ e.role=roleI.value; });
      nameI.addEventListener("input",()=>{ e.name=nameI.value; hitung(); });
      nameI.addEventListener("change",()=>{
        const k=kenal[nameI.value.trim().toLowerCase()]; if(!k) return;
        if(!e.role && k.role){ e.role=k.role; roleI.value=k.role; }
        if(!(+e.base) && k.base){ e.base=k.base; f.base.value=fmtNum(k.base); hitung(); }
      });
      box.append(el("div",{class:"card",style:"padding:12px;display:flex;flex-direction:column;gap:10px"},
        el("div",{class:"row",style:"justify-content:space-between"},
          el("span",{class:"eyebrow"},"Karyawan "+(i+1)),
          emps.length>1?el("button",{class:"btn sm gho",type:"button",onclick:()=>{ emps.splice(i,1); gambar(); }},"Hapus"):null),
        el("div",{class:"grid g2"},field("Nama",nameI),field("Jabatan",roleI)),
        el("div",{class:"grid g4"},GAJI_KOMP.map(([k,lbl])=>field(lbl,f[k]))),
        el("div",{class:"grid g2"},field("Potongan",dedI),field("Keterangan potongan",dedNI)),
        field("Catatan di slip",noteI)));
    });
    hitung();
  }
  const tambah=el("button",{class:"btn",type:"button",style:"align-self:flex-start",
    onclick:()=>{ emps.push(karyawanKosong()); gambar(); }},"+ Tambah karyawan");
  openModal(existing?"Ubah gaji karyawan":"Bayar gaji karyawan",
    [el("div",{class:"grid g2"},field("Periode gaji",perI),field("Tanggal dibayar",dateI)),
     dl, box, tambah,
     el("div",{class:"hint"},"Nama yang pernah dipakai muncul sebagai pilihan, lengkap dengan jabatan dan gaji pokok terakhirnya. Yang dibukukan adalah jumlah yang benar-benar dibayarkan (setelah potongan)."),
     field("Pembayaran",segCtl([{v:"cash",t:"Sudah dibayar"},{v:"credit",t:"Belum dibayar (hutang gaji)"}],payment,v=>payment=v)),
     field("Dibayar dari",acctI), field("Biaya admin bank / transfer",bankI,bankFeeHint),
     calc],
    [existing?el("button",{class:"btn dgr",onclick:()=>confirmDelete("catatan gaji ini",async()=>{
        await Store.delTxn(t.id); recompute(); render(); toast("Catatan gaji dihapus."); })},"Hapus"):null,
     el("span",{style:"flex:1"}), el("button",{class:"btn",onclick:closeModal},"Batal"),
     el("button",{class:"btn pri",onclick:async()=>{
       const isi=emps.map(e=>({...e,name:String(e.name||"").trim(),role:String(e.role||"").trim(),
           deductionNote:String(e.deductionNote||"").trim(),note:String(e.note||"").trim()}))
         .filter(e=>e.name||gajiKotor(e)>0||(+e.deduction||0)>0);
       if(!isi.length){ toast("Isi minimal satu karyawan."); return; }
       if(isi.some(e=>!e.name)){ toast("Nama karyawan belum diisi."); return; }
       if(isi.some(e=>gajiBersih(e)<0)){ toast("Potongan tidak boleh lebih besar dari gaji."); return; }
       const total=isi.reduce((n,e)=>n+gajiBersih(e),0);

       const per=perI.value, nama=isi.map(e=>e.name).join(", ");

         amount:total,note:"Gaji "+fmtMonth(per)+" — "+nama,party:nama,payment,account:acctI.value,
         bankFee:payment==="credit"?0:numVal(bankI),nonRecurring:false,
         payroll:{period:per, employees:isi.map(e=>({name:e.name,role:e.role,base:+e.base||0,allowance:+e.allowance||0,
           overtime:+e.overtime||0,bonus:+e.bonus||0,deduction:+e.deduction||0,deductionNote:e.deductionNote,note:e.note}))}};
       closeModal(); existing?await Store.replaceTxn(rec):await Store.putTxn(rec);
       recompute(); render(); toast("Gaji tersimpan.");
       tawarkanSlip(S.txns[rec.id]||rec);
     }},"Simpan gaji")]);
  gambar();

/* Kopi yang dicicip untuk QC tidak menghasilkan uang, tapi tetap memakan stok
   dan biaya. Dicatat di sini supaya jumlahnya kelihatan, bukan hilang diam-diam. */
const QC_PURPOSES = ["QC rutin","Cupping","Uji profil roasting","Sampel pelanggan","Latihan barista","Lainnya"];
function formQC(existing){
  const keys = Object.keys(BOOKS.inv.rb).filter(k=>S.greenbeans[rbSplit(k).gbId]);
  if(!keys.length && !existing){ return openModal("Belum ada roast bean",
    [el("p",{style:"color:var(--ink-2)"},"Catat batch roasting dulu — QC memakai stok roast bean yang sudah ada.")],
    [el("button",{class:"btn pri",onclick:()=>{closeModal();location.hash="#/roasting";}},"Buka Roasting")]); }
  /* Pilihannya batch, bukan sekadar kantong stok — supaya sisa tiap batch
     ikut berkurang dan kode batch bisa ditelusuri saat ada klaim mutu. */
  const tId=(existing||{}).id;
  const semuaBatch = Object.values(S.txns).filter(x=>x.type==="roast" && S.greenbeans[x.greenbeanId])
    .filter(x=> batchSisa(x.id, tId)>0.5 || x.id===(existing||{}).batchId)
    .sort((a,b)=>(b.date+String(b.seq||0)).localeCompare(a.date+String(a.seq||0)));
  const t = existing || {id:uid(),type:"qc",date:todayISO(),
    batchId:(semuaBatch[0]||{}).id||"", rbKey:keys[0], gram:15, purpose:"QC rutin", note:""};
  const dateI=inp({type:"date",value:t.date});
  const opts = semuaBatch.map(x=>({v:x.id,
    t:(S.greenbeans[x.greenbeanId]||{}).name+" · "+normLevel(x.profile)+" · "+batchCode(x)+" · sisa "+num2(batchSisa(x.id,tId))+" g"}));
  const curKeyLama = t.rbKey || rbKey(t.greenbeanId,t.roastLevel);
  if(!t.batchId && curKeyLama) opts.unshift({v:"K:"+curKeyLama, t:rbName(curKeyLama)+" (tanpa batch)"});
  const keyI=sel(opts, t.batchId || ("K:"+curKeyLama));
  /* Kantong stok yang sedang dituju, apa pun bentuk pilihannya. */
  const kantongDari = v => v && v.indexOf("K:")===0 ? v.slice(2)
    : (S.txns[v] ? rbKey(S.txns[v].greenbeanId, S.txns[v].profile) : "");
  const gramI=qtyInput(t.gram||0);
  const purpI=sel(QC_PURPOSES.map(v=>({v,t:v})), QC_PURPOSES.includes(t.purpose)?t.purpose:"QC rutin");
  const noteI=inp({value:t.note||"",placeholder:"mis. cek profil batch 12 Sep"});
  const calc=el("div",{class:"calc"});
  function sync(){
    const kk=kantongDari(keyI.value);
    const b=BOOKS.inv.rb[kk]||{qty:0,val:0,last:0};
    const per=b.qty>0? b.val/b.qty : (b.last||0);
    const g=numVal(gramI);
    const bt=S.txns[keyI.value];
    const sisaBatch = bt ? batchSisa(bt.id) : null;
    calc.innerHTML="";
    const L=(x,y,cls)=>el("div",{class:"l"+(cls?" "+cls:"")},el("span",null,x),el("span",null,y));
    if(bt) calc.append(L("Batch", batchCode(bt)+" · "+fmtDate(bt.date)));
    calc.append(
      L("Stok "+rbName(kk), num2(b.qty)+" g"),
      sisaBatch!=null ? L("Sisa batch ini", num2(sisaBatch)+" g") : null,
      L("HPP roast bean", rp(per)+" / gram"),
      L("Nilai kopi terpakai", rpS(per*g),"b"),
      L("Sisa stok setelah QC", num2(b.qty-g)+" g"));
    if(g>b.qty) calc.append(el("div",{class:"warnbox",style:"margin-top:6px"},"Melebihi stok yang ada — boleh disimpan, tapi stok akan minus."));
    else if(sisaBatch!=null && g>sisaBatch) calc.append(el("div",{class:"warnbox",style:"margin-top:6px"},"Melebihi sisa batch ini, walau stok levelnya masih cukup."));
  }
  [keyI,gramI].forEach(i=>i.addEventListener("input",sync));
  keyI.addEventListener("change",sync);
  openModal(existing?"Ubah catatan QC":"QC / Cupping",
    [el("p",{style:"color:var(--ink-2);font-size:12.5px"},"Kopi yang kamu cicip untuk quality control. Stok roast bean berkurang dan nilainya masuk Beban QC & Cupping — bukan HPP penjualan, karena memang tidak terjual."),
     el("div",{class:"grid g2"}, field("Tanggal",dateI), field("Keperluan",purpI)),
     field("Roast bean",keyI),
     field("Berapa gram terpakai",gramI,"Cupping standar biasanya 8–12 gram per mangkuk."),
     field("Catatan",noteI), calc],
    [existing?el("button",{class:"btn dgr",onclick:()=>confirmDelete("catatan QC ini",async()=>{
        await Store.delTxn(t.id); recompute(); render(); toast("Catatan QC dihapus."); })},"Hapus"):null,
     el("span",{style:"flex:1"}), el("button",{class:"btn",onclick:closeModal},"Batal"),
     el("button",{class:"btn pri",onclick:async()=>{
       const g=numVal(gramI); if(!g){ toast("Isi berapa gram yang terpakai."); return; }
       const v=keyI.value;
       const rec={id:t.id,type:"qc",date:dateI.value,seq:t.seq||Date.now(),
         batchId: v.indexOf("K:")===0 ? "" : v,
         rbKey: kantongDari(v),
         gram:g,purpose:purpI.value,note:noteI.value.trim()};
       closeModal(); existing?await Store.replaceTxn(rec):await Store.putTxn(rec);
       recompute(); render(); toast("Catatan QC tersimpan.");
     }},"Simpan")]);
  sync();
}

function formLoan(existing){

  const bankI=bankFeeInput(existing?t:null);
  const noteI=inp({value:t.note||"",placeholder:"opsional"});
  const calc=el("div",{class:"calc"});

        "Pokok yang dibayar melebihi sisa hutang — periksa lagi angkanya."));
  }
  [pokI,bngI].forEach(i=>i.addEventListener("input",sync));
  acctI.addEventListener("change",sync);
  openModal("Angsuran ke-"+ke+" — "+(loan.lender||"pinjaman"),
    [el("div",{class:"grid g2"}, field("Tanggal bayar",dateI), field("Dibayar dari",acctI)),

         principal:numVal(pokI), interest:numVal(bngI),
         account:acctI.value, bankFee:numVal(bankI), note:noteI.value.trim()};
       if(!rec.principal && !rec.interest){ toast("Isi pokok atau bunganya."); return; }

/* --------------------------- KONVERSI SATUAN ----------------------------
   Item yang sudah punya riwayat (mis. susu yang dulu dicatat per pcs) bisa
   dipindah ke ml/gram. Semua JUMLAH di riwayatnya dikalikan faktor, NILAI
   rupiahnya tetap — jadi jurnal, neraca, dan laba rugi tidak berubah sedikit pun,
   hanya harga per satuannya yang menyesuaikan. */
function txnPakaiSup(id){
  return Object.values(S.txns).filter(t=>
    (t.type==="purchase" && t.kind==="supply" && (t.lines||[]).some(l=>l.itemId===id)) ||
    (t.type==="sale" && (t.packing||[]).some(p=>p.supplyId===id)) ||
    (t.type==="produce" && (t.items||[]).some(x=>x.supplyId===id)) ||
    (t.type==="adjust" && t.itemKind==="sup" && t.itemId===id));
}
function konversiTxnSup(t, id, f){
  const n=JSON.parse(JSON.stringify(t));
  if(n.type==="purchase") (n.lines||[]).forEach(l=>{ if(l.itemId!==id) return;
    if(l.mode==="pack") l.packSize=(+l.packSize||1)*f;
    else { l.mode="pack"; l.packQty=+l.qty||0; l.packPrice=+l.unitPrice||0; l.packSize=f; }
    l.qty=(+l.qty||0)*f; l.unitPrice=(+l.unitPrice||0)/f; });
  if(n.type==="sale") (n.packing||[]).forEach(p=>{ if(p.supplyId===id) p.qty=(+p.qty||0)*f; });
  if(n.type==="produce") (n.items||[]).forEach(x=>{ if(x.supplyId===id) x.qty=(+x.qty||0)*f; });
  if(n.type==="adjust" && n.itemKind==="sup" && n.itemId===id) n.qty=(+n.qty||0)*f;
  return n;
}
