  if(!beans.length) beans=[{greenbeanId:gbs[0]?gbs[0].id:"",gram:200,roastLevel:DEFAULT_LEVEL}];
  const nameI=inp({value:s.name,placeholder:"Robusta Temanggung 200 g"});
  const priceI=moneyInput(s.price||0);
  const priceOnI=moneyInput(s.priceOnline||0);
  const beanBox=el("div",{style:"display:flex;flex-direction:column;gap:6px"});
  const compBox=el("div",{style:"display:flex;flex-direction:column;gap:6px"});
  const calc=el("div",{class:"calc"});
  function drawBeans(){
    beanBox.innerHTML="";
    if(!gbs.length){ beanBox.append(el("div",{class:"hint"},"Belum ada green bean.")); return; }
    beans.forEach((bn,i)=>{
      bn.roastLevel=normLevel(bn.roastLevel);
      const sl=sel([{v:"",t:"— pilih green bean —"}].concat(gbs.map(g=>({v:g.id,t:g.name}))),bn.greenbeanId,
        {onchange:e=>{bn.greenbeanId=e.target.value;drawBeans();sync();}});
      const q=qtyInput(bn.gram,{oninput:e=>{bn.gram=numVal(e.target);sync();}});
      const x=el("button",{class:"x",type:"button",title:"Hapus bean",
        onclick:()=>{beans.splice(i,1); if(!beans.length) beans.push({greenbeanId:"",gram:0,roastLevel:DEFAULT_LEVEL}); drawBeans(); sync();}},"×");
      const perLevel=bn.greenbeanId ? Object.entries(BOOKS.inv.rb)
        .filter(([k,b])=>rbSplit(k).gbId===bn.greenbeanId && b.qty>0.5)
        .map(([k,b])=>rbSplit(k).level+" "+gramTxt(b.qty)) : [];
      beanBox.append(el("div",null,
        el("div",{class:"line-item",style:"grid-template-columns:1fr 82px 28px"},sl,q,x),
        bn.greenbeanId?el("div",{style:"font-size:11px;padding:2px 0 4px;color:"+(perLevel.length?"var(--ink-3)":"var(--warn)")},
          perLevel.length ? "Stok roast bean: "+perLevel.join(" · ")
                          : "Belum ada stok roast bean — catat roasting dulu."):null));
    });
    const tot=beans.reduce((n,b)=>n+(+b.gram||0),0);
    beanBox.append(el("div",{class:"row",style:"justify-content:space-between"},
      el("button",{class:"btn sm",type:"button",onclick:()=>{beans.push({greenbeanId:gbs[0].id,gram:0,roastLevel:DEFAULT_LEVEL});drawBeans();sync();}},"+ Tambah bean (blend)"),
      el("span",{style:"font-size:11.5px;color:var(--ink-3)"},"Total "+num2(tot)+" g roast bean per pcs")));
  }
  function drawComps(){
    compBox.innerHTML="";
    if(!sups.length){ compBox.append(el("div",{class:"hint"},"Belum ada kemasan/bahan. Tambahkan dulu di tab Kemasan.")); return; }
    comps.forEach((cp,i)=>{
      const sl=sel(sups.map(x=>({v:x.id,t:x.name})),cp.supplyId,{onchange:e=>{cp.supplyId=e.target.value;sync();}});
      const q=qtyInput(cp.qty,{oninput:e=>{cp.qty=numVal(e.target);sync();}});
      const x=el("button",{class:"x",type:"button",onclick:()=>{comps.splice(i,1);drawComps();sync();}},"×");
      compBox.append(el("div",{class:"line-item",style:"grid-template-columns:1fr 78px 28px"},sl,q,x));
    });
    compBox.append(el("button",{class:"btn sm",type:"button",style:"align-self:flex-start",
      onclick:()=>{comps.push({supplyId:sups[0].id,qty:1});drawComps();sync();}},"+ Tambah bahan"));
  }
  function sync(){
    const tmp={beans,components:comps};
    const c=skuCost(tmp); const price=numVal(priceI); const profit=price-c.total;
    calc.innerHTML="";
    const L=(a,b,cls)=>el("div",{class:"l"+(cls?" "+cls:"")},el("span",null,a),el("span",null,b));
    c.parts.forEach(p=>calc.append(L(p.n,rp(p.v))));
    calc.append(L("Total HPP",rp(c.total),"b"),L("Harga jual",rp(price)),
      L("Laba kotor per pcs",rpS(profit)+(price>0?"  ·  "+pct(profit/price*100):""),"b"));
  }
  [priceI,priceOnI].forEach(i=>i.addEventListener("input",sync));
  openModal(isNew?"Produk baru":"Ubah produk",
    [field("Nama produk",nameI),
     el("div",{class:"grid g2"},
       field("Harga jual offline",priceI,"Untuk penjualan langsung, WhatsApp, reseller."),
       field("Harga jual online",priceOnI,"Dipakai otomatis di saluran bertanda “Online”. Kosongkan kalau mau ikut markup saluran.")),
     el("div",null,el("span",{class:"eyebrow",style:"display:block;margin-bottom:6px"},"Roast bean per pcs — bisa lebih dari satu untuk blend"),beanBox,
       el("div",{class:"hint"},"Roast level tidak dipasang di produk. Levelnya kamu tentukan saat penjualan, lewat batch yang dipilih. HPP di sini perkiraan dari rata-rata semua stok bean itu.")),
     el("div",null,el("span",{class:"eyebrow",style:"display:block;margin-bottom:6px"},"Kemasan, stiker & packing per pcs"),compBox),
     calc],
    [!isNew?el("button",{class:"btn dgr",onclick:()=>confirmDelete("produk ini",async()=>{
        await Store.deleteCatalogItem("skus",s.id); recompute(); render(); })},"Hapus"):null,
     el("span",{style:"flex:1"}),el("button",{class:"btn",onclick:closeModal},"Batal"),
     el("button",{class:"btn pri",onclick:async()=>{ if(!nameI.value.trim()){toast("Isi nama produk.");return;}
       const rec={id:s.id,name:nameI.value.trim(),price:numVal(priceI),priceOnline:numVal(priceOnI),
         beans:beans.filter(b=>b.greenbeanId&&(+b.gram||0)>0).map(b=>({greenbeanId:b.greenbeanId,gram:+b.gram||0,roastLevel:normLevel(b.roastLevel)})),
         components:comps.filter(c=>c.supplyId&&(+c.qty||0)>0),active:true};
       closeModal(); const ok=await Store.saveCatalogItem("skus",s.id,rec); recompute(); render(); if(ok) toast("Produk tersimpan."); }},"Simpan")]);
  drawBeans(); drawComps(); sync();
}
/* -------------------- RESEP & KALKULATOR HPP BOTOLAN ---------------------
   Resep per botol: kopi (gram roast bean), bahan minuman (ml / gram),
   kemasan (pcs), dan biaya lain per botol. HPP terhitung saat diketik,
   lengkap dengan saran harga jual untuk target margin. */
function formSkuRTD(s){
  const isNew=!s;
  const gbs=Object.values(S.greenbeans).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  const semuaSup=Object.values(S.supplies);
  /* "cair" mengandung "air" — jadi dicocokkan sebagai kata utuh. */
  const isAir = x => /\bair\b|water|galon|aqua|mineral/i.test(String(x.name||""));
  const airPool=semuaSup.filter(x=>isBahanMinuman(x) && x.unit==="ml" && isAir(x));
  s=s||{id:uid(),line:"rtd",name:"",kode:"",volumeMl:250,shelfDays:5,price:0,priceOnline:0,targetMargin:60,ohPerUnit:0,minStock:0,
    beans:[{greenbeanId:gbs[0]?gbs[0].id:"",gram:10,roastLevel:DEFAULT_LEVEL,yieldMl:30}],components:[],
    airMl:0, airSupplyId:(airPool[0]||{}).id||"", active:true};
  let beans=rtdBeans(s).map(b=>({...b}));
  if(!beans.length) beans=[{greenbeanId:gbs[0]?gbs[0].id:"",gram:10,roastLevel:DEFAULT_LEVEL,yieldMl:30}];
  const comps=JSON.parse(JSON.stringify(s.components||[]));
  let bahan=comps.filter(c=>isBahanMinuman(S.supplies[c.supplyId]));
  let kemas=comps.filter(c=>!isBahanMinuman(S.supplies[c.supplyId]));
  if(isNew){
    // Botol 250 ml yang sudah ada langsung disarankan.
    const botol=semuaSup.find(x=>!isBahanMinuman(x) && /botol/i.test(x.name) && !/stik|stic/i.test(x.name));
    if(botol) kemas.push({supplyId:botol.id,qty:1});
  }
  const nameI=inp({value:s.name,placeholder:"Kopi Susu Gula Aren 250 ml"});
  const kodeI=inp({value:s.kode||"",placeholder:"mis. KSA",maxlength:"10",style:"text-transform:uppercase"});
  const volI=qtyInput(s.volumeMl||250);
  const shelfI=qtyInput(s.shelfDays!=null?s.shelfDays:5);
  const priceI=moneyInput(s.price||0);
  const priceOnI=moneyInput(s.priceOnline||0);
  const targetI=qtyInput(s.targetMargin!=null?s.targetMargin:60);
  const ohI=moneyInput(s.ohPerUnit||0);
  const minI=qtyInput(s.minStock||0);
  const airI=qtyInput(s.airMl||0,{oninput:()=>sync()});
  const opsiAir=x=>({v:x.id,t:x.name+" · "+rpU(hargaSatuanSup(x.id))+"/ml"});
  const mlLain=semuaSup.filter(x=>isBahanMinuman(x)&&x.unit==="ml"&&!isAir(x)&&x.id===s.airSupplyId);
  const airSrcI=selGroup([{label:"Tanpa stok",options:[{v:"",t:"Tidak dihitung (gratis)"}]},
      {label:"Stok air",options:airPool.map(opsiAir)},
      {label:"Lainnya",options:mlLain.map(opsiAir)}], s.airSupplyId||"",
    {onchange:()=>sync()});
  const beanBox=el("div",{class:"rcp-sec"});
  const bahanBox=el("div",{class:"rcp-sec"});
  const kemasBox=el("div",{class:"rcp-sec"});
  const volBox=el("div");
  const calc=el("div",{class:"calc"});
  const sarankanBox=el("div");
  const biayaEls=[];          // {el, fn} — diperbarui tiap sync tanpa menggambar ulang baris

  const mini=(label,input,satuan)=>el("label",null,label,input,satuan?el("span",{class:"rcp-note"},satuan):null);
  const hapusBtn=fn=>el("button",{class:"x",type:"button",title:"Hapus",onclick:fn},"×");
  function biayaEl(fn){ const e=el("span",{class:"rcp-cost"}); biayaEls.push({e,fn}); return e; }

  function drawBeans(){
    beanBox.innerHTML="";
    if(!gbs.length){ beanBox.append(el("div",{class:"hint"},"Belum ada green bean.")); return; }
    beans.forEach((bn,i)=>{
      const sl=sel([{v:"",t:"— pilih kopi —"}].concat(gbs.map(g=>({v:g.id,t:g.name}))),bn.greenbeanId,
        {onchange:e=>{bn.greenbeanId=e.target.value; drawBeans(); sync();}});
      const gI=qtyInput(bn.gram,{oninput:e=>{bn.gram=numVal(e.target); sync();}});
      const yI=qtyInput(bn.yieldMl||"",{oninput:e=>{bn.yieldMl=numVal(e.target); sync();},placeholder:"0"});
      const note=el("div",{class:"rcp-note"});
      biayaEls.push({e:note, fn:()=>{ if(!bn.greenbeanId) return "";
        const e=biayaGramEstimasi(bn.greenbeanId);
        note.style.color=e.v>0?"var(--ink-3)":"var(--warn)";
        const seduh=(+bn.yieldMl||0)>0 ? " · air seduh "+num2(+bn.yieldMl)+" ml dihitung di bagian Air" : "";
        return (e.v>0 ? rpU(e.v)+"/g"+(e.est?" · perkiraan dari harga green bean ÷ yield "+num2(S.settings.defaultYield)+"%":" · rata-rata stok roast bean")
                      : "Belum ada harga — catat pembelian green bean atau roasting dulu.")+seduh; }});
      beanBox.append(el("div",{class:"rcp"},
        el("div",{class:"rcp-top"},el("div",{class:"grow"},sl),hapusBtn(()=>{beans.splice(i,1); drawBeans(); sync();})),
        el("div",{class:"rcp-in"},
          mini("Kopi",gI,"g"),
          el("span",{class:"rcp-note"},"→"),
          mini("Hasil espresso",yI,"ml"),
          biayaEl(()=>{ const e=biayaGramEstimasi(bn.greenbeanId); return bn.greenbeanId?rp(e.v*(+bn.gram||0)):""; })),
        note));
    });
    beanBox.append(el("button",{class:"btn sm",type:"button",style:"align-self:flex-start",
      onclick:()=>{beans.push({greenbeanId:gbs[0].id,gram:0,roastLevel:DEFAULT_LEVEL,yieldMl:0});drawBeans();sync();}},
      beans.length?"+ Tambah kopi (blend)":"+ Tambah kopi"));
  }
  function drawBahan(){
    bahanBox.innerHTML="";
    const pool=semuaSup.filter(isBahanMinuman);
    if(!pool.length){ bahanBox.append(el("div",{class:"warnbox"},
      "Belum ada bahan minuman. Simpan produk ini dulu, lalu buka tab ",el("b",null,"Bahan minuman"),
      " untuk menambah susu, krimer, gula aren, dan cokelat beserta harganya.")); return; }
    bahan.forEach((cp,i)=>{
      const sp=()=>S.supplies[cp.supplyId]||{};
      const sl=selGroup(supGroups(pool,true), cp.supplyId,{onchange:e=>{ cp.supplyId=e.target.value;
        if(sp().unit==="ml"){ delete cp.rasioAir; delete cp.yieldMl; } drawBahan(); sync(); }});
      const u=sp().unit||"ml";
      const larut=(+cp.rasioAir||0)>0;
      const qI=qtyInput(cp.qty,{oninput:e=>{ cp.qty=numVal(e.target); if(!cp._yieldManual) perbaruiHasil(); sync(); }});
      const cek=el("input",{type:"checkbox",...(larut?{checked:"checked"}:{})});
      const rI=qtyInput(larut?cp.rasioAir:1,{oninput:e=>{ cp.rasioAir=numVal(e.target); cp._yieldManual=false; perbaruiHasil(); sync(); }});
      const hI=qtyInput(larut?hasilCair(cp,sp()):"",{oninput:e=>{ cp.yieldMl=numVal(e.target); cp._yieldManual=true; sync(); }});
      function perbaruiHasil(){ if(!(+cp.rasioAir>0)) return; delete cp.yieldMl;
        hI.value=fmtNum(Math.round(hasilCair(cp,sp())*100)/100); }
      cek.addEventListener("change",()=>{ if(cek.checked){ cp.rasioAir=numVal(rI)||1; } else { delete cp.rasioAir; delete cp.yieldMl; }
        drawBahan(); sync(); });
      const larutBox = larut
        ? [mini("air 1 :",rI,""), el("span",{class:"rcp-note"},"→"), mini("hasil",hI,"ml")]
        : (u==="ml" ? [(()=>{ const n=el("span",{class:"rcp-note"});
            biayaEls.push({e:n, fn:()=>"= "+num2(+cp.qty||0)+" ml cairan"}); return n; })()] : []);
      bahanBox.append(el("div",{class:"rcp"},
        el("div",{class:"rcp-top"},el("div",{class:"grow"},sl),hapusBtn(()=>{bahan.splice(i,1); drawBahan(); sync();})),
        el("div",{class:"rcp-in"},
          mini("Takaran",qI,u),
          el("label",null,cek,"Dicairkan dengan air"),
          larutBox,
          biayaEl(()=>{ const per=hargaSatuanSup(cp.supplyId); return per>0?rp(per*(+cp.qty||0)):"belum ada harga"; })),
        larut ? (()=>{ const n=el("div",{class:"rcp-note"});
          biayaEls.push({e:n, fn:()=>"Stok yang dipotong: "+num2(+cp.qty||0)+" "+u+" "+(sp().name||"")+
            " + "+num2((+cp.qty||0)*(+cp.rasioAir||0))+" ml air (dihitung di baris air di bawah)."}); return n; })() : null));
    });
    bahanBox.append(el("button",{class:"btn sm",type:"button",style:"align-self:flex-start",
      onclick:()=>{ const dipakai=new Set(bahan.map(b=>b.supplyId)); const o=pool.find(x=>!dipakai.has(x.id))||pool[0];
        bahan.push({supplyId:o.id,qty:o.unit==="gram"?5:30}); drawBahan(); sync(); }},"+ Tambah bahan"));
  }
  function drawKemas(){
    kemasBox.innerHTML="";
    const pool=semuaSup.filter(x=>!isBahanMinuman(x));
    if(!pool.length){ kemasBox.append(el("div",{class:"hint"},"Belum ada kemasan. Tambahkan botol & stiker di tab Kemasan.")); return; }
    kemas.forEach((cp,i)=>{
      const sl=selGroup(supGroups(pool,false), cp.supplyId,{onchange:e=>{cp.supplyId=e.target.value; drawKemas(); sync();}});
      const qI=qtyInput(cp.qty,{oninput:e=>{cp.qty=numVal(e.target); sync();}});
      kemasBox.append(el("div",{class:"rcp"},
        el("div",{class:"rcp-top"},el("div",{class:"grow"},sl),
          el("div",{class:"rcp-in",style:"flex:none"},mini("",qI,unitSup(cp.supplyId))),
          hapusBtn(()=>{kemas.splice(i,1); drawKemas(); sync();})),
        el("div",{class:"rcp-in"},biayaEl(()=>{ const per=hargaSatuanSup(cp.supplyId);
          return per>0?rpU(per)+"/"+unitSup(cp.supplyId)+" · "+rp(per*(+cp.qty||0)):"belum ada harga"; }))));
    });
    kemasBox.append(el("button",{class:"btn sm",type:"button",style:"align-self:flex-start",
      onclick:()=>{ const dipakai=new Set(kemas.map(b=>b.supplyId)); const o=pool.find(x=>!dipakai.has(x.id) && /stik|stic|label|tutup/i.test(x.name))||pool.find(x=>!dipakai.has(x.id))||pool[0];
        kemas.push({supplyId:o.id,qty:1}); drawKemas(); sync(); }},"+ Tambah kemasan"));
  }
  /* Resep yang sedang diketik, dalam bentuk yang sama dengan yang disimpan. */
  function resepSementara(){
    return {line:"rtd", beans:beans.filter(b=>b.greenbeanId), components:bahan.concat(kemas),
      airMl:numVal(airI), airSupplyId:airSrcI.value, ohPerUnit:numVal(ohI), volumeMl:numVal(volI)};
  }
  const bulat500 = v => Math.ceil(v/500)*500;
  function sync(){
    const tmp=resepSementara();
    for(let i=biayaEls.length-1;i>=0;i--) if(!biayaEls[i].e.isConnected) biayaEls.splice(i,1);
    biayaEls.forEach(x=>{ x.e.textContent=x.fn()||""; });
    // isi botol
    const v=rtdVolume(tmp), vol=numVal(volI);
    volBox.innerHTML="";
    const sisa=vol-v.total;
    volBox.append(el("div",{class:"calc",style:"gap:8px"},
      el("div",{class:"l"},el("span",{style:"font-weight:600;color:var(--ink)"},"Isi botol"),
        el("span",{style:"font-weight:600"},num2(v.total)+" / "+num2(vol)+" ml")),
      el("div",{class:"vol"+(sisa<-0.5?" over":"")},el("i",{style:"width:"+Math.min(100,vol>0?v.total/vol*100:0)+"%"})),
      v.rows.map(r=>el("div",{class:"l",style:"font-size:12px"},el("span",null,r.n+(r.dari?" · "+r.dari:"")),el("span",null,num2(r.ml)+" ml"))),
      el("div",{class:"hint",style:"margin:0;color:"+(sisa<-0.5?"var(--neg)":"var(--ink-3)")},
        sisa<-0.5 ? "Melebihi isi botol "+num2(-sisa)+" ml — cek lagi takarannya."
        : sisa>0.5 ? "Sisa "+num2(sisa)+" ml — untuk es, ruang kosong, atau tambahkan ke air biasa."
        : "Pas dengan isi botol.")));
    // HPP
    const r=rtdRecipeCost(tmp); const price=numVal(priceI); const profit=price-r.total;
    calc.innerHTML="";
    const L=(a,b,cls)=>el("div",{class:"l"+(cls?" "+cls:"")},el("span",null,a),el("span",null,b));
    [["bean","Kopi"],["bb","Bahan minuman & air"],["km","Kemasan"],["oh","Biaya lain"]].forEach(([g,judul])=>{
      const p=r.parts.filter(x=>x.grp===g); if(!p.length) return;
      const sub=p.reduce((n,x)=>n+x.v,0);
      calc.append(el("div",{class:"l",style:"font-weight:600;margin-top:2px"},el("span",null,judul),el("span",null,rp(sub)+(r.total>0?"  ·  "+pct(sub/r.total*100):""))));
      p.forEach(x=>calc.append(el("div",{class:"l",style:"padding-left:10px;font-size:12px"},
        el("span",null,x.n+(x.est&&x.grp!=="oh"?" *":"")),el("span",null,rp(x.v))))); });
    [ L("HPP per botol",rp(r.total),"b"),
      L("Harga jual offline",rp(price)),
      L("Laba kotor per botol",rpS(profit)+(price>0?"  ·  margin "+pct(profit/price*100):""),"b"),
      price>0 && L("Food cost (HPP ÷ harga)",pct(r.total/price*100))
    ].filter(Boolean).forEach(x=>calc.append(x));
    if(r.parts.some(x=>x.est&&x.grp!=="oh")) calc.append(el("div",{class:"hint"},"* harga perkiraan: dari harga per kemasan / harga green bean, karena belum ada pembelian atau roasting yang tercatat."));
    sarankanBox.innerHTML="";
    const tm=numVal(targetI);
    if(r.total>0 && tm>0 && tm<100){
      const saran=bulat500(r.total/(1-tm/100));
      sarankanBox.append(el("div",{class:"calc",style:"margin-top:6px"},
        el("div",{class:"l",style:"font-weight:600"},el("span",null,"Saran harga untuk margin "+num2(tm)+"%"),el("span",null,rp(saran))),
        L("Laba per botol di harga itu", rp(saran-r.total)),
        el("div",{class:"row",style:"justify-content:flex-end;margin-top:4px"},
          el("button",{class:"btn sm",type:"button",onclick:()=>{ priceI.value=fmtNum(saran); sync(); }},"Pakai harga ini"))));
    }
  }
  [priceI,priceOnI,targetI,ohI,volI].forEach(i=>i.addEventListener("input",sync));
  const judul=(t,kanan)=>el("div",{class:"eyebrow"},el("span",null,t),kanan?el("span",{style:"text-transform:none;letter-spacing:0"},kanan):null);
  const airRingkas=el("div",{class:"rcp-note"});
  const airBox=el("div",{class:"rcp"},
    el("div",{class:"rcp-in"},
      mini("Air biasa",airI,"ml"),
      el("label",null,el("span",{class:"rcp-note"},"Sumber air"),airSrcI),
      biayaEl(()=>{ const u=rtdUsage(resepSementara()); const id=u.airId;
        const q=id?((u.items.find(x=>x.supplyId===id)||{}).qty||0):u.air;
        return q>0 ? (id ? rp(hargaSatuanSup(id)*q) : "gratis") : ""; })),
    airRingkas);
  /* Total air per botol dan rinciannya; peringatan kalau air belum masuk HPP. */
  biayaEls.push({e:airRingkas, fn:()=>{ const u=rtdUsage(resepSementara());
    const teks="Total air per botol "+num2(u.air)+" ml"+(rincianAir(u)?" ("+rincianAir(u)+")":"")+". ";
    airRingkas.style.color = (!u.airId && u.air>0) ? "var(--warn)" : "var(--ink-3)";
    return teks + (u.airId ? "Dipotong dari stok "+((S.supplies[u.airId]||{}).name||"air")+" dan masuk HPP."
      : u.air>0 ? (airPool.length ? "Belum masuk HPP — pilih sumber air di atas." : "Belum masuk HPP — tambahkan “Air mineral galon” (ml) di tab Bahan minuman, lalu pilih di sini.")
      : ""); }});

/* ------------------------- RASIO KEUANGAN -------------------------------- */
/* Disusun mengikuti lazimnya laporan keuangan perusahaan terbuka: angka
   Reported apa adanya, dan Normalised yang mengeluarkan beban tidak berulang
   supaya daya hasil usaha yang sebenarnya kelihatan. Normalisasi hanya
   menyentuh laba rugi — neraca tetap dilaporkan apa adanya, sesuai praktik. */
function bebanLuarBiasa(from,to){
  return Object.values(S.txns)
    .filter(t=>t.nonRecurring && t.type==="expense"
      && (!from||t.date>=from) && (!to||t.date<=to))
    .reduce((n,t)=>n+(+t.amount||0),0);
}
/* Untuk arus kas, yang boleh dikembalikan hanya beban tidak berulang yang
   uangnya memang sudah keluar. Yang masih tempo belum menyentuh kas. */
function bebanLuarBiasaKas(from,to){
  return Object.values(S.txns)
    .filter(t=>t.nonRecurring && t.type==="expense" && t.payment!=="credit"
      && (!from||t.date>=from) && (!to||t.date<=to))
    .reduce((n,t)=>n+(+t.amount||0),0);
}
function financialRatios(from,to,normalised){
  const bs=balanceSheet(to), pl=incomeStatement(from,to);
  const kode=(a,c)=>{const x=(a||[]).find(y=>y.c===c); return x?x.v:0;};
  const nonRec = normalised ? bebanLuarBiasa(from,to) : 0;

  const revenue = pl.revTotal;
  const cogs    = pl.cogsTotal;
  const gross   = pl.gross;
  const opex    = pl.expTotal - nonRec;
  const dep     = kode(pl.exp,"6-1500");
  const bunga   = kode(pl.exp,"6-1350");
  const pajak   = kode(pl.exp,"6-2000");
  const net     = revenue - cogs - opex;
  const ebit    = net + bunga + pajak;
  const ebitda  = ebit + dep;

  const inv   = bs.invTotal;
  const ca    = bs.cash+bs.ar+inv;
  const cl    = bs.liab;                      // hutang usaha + pinjaman + pajak
  const debt  = bs.loanDue;
  const netDebt = debt - bs.cash;
  const ic    = bs.equity + netDebt;

  const hari  = Math.max(1, Math.round((new Date(to)-new Date(from))/86400000)+1);
  const f     = 365/hari;
  const angs  = (BOOKS.loans||[]).reduce((n,l)=>n+(l.lunas?0:l.angsuranBulanan),0);
  const kasBulanan = (net+dep)/(hari/30.44);

  const rs=(BOOKS.roasts||[]).filter(r=>(!from||r.date>=from)&&(!to||r.date<=to));
  const inG=rs.reduce((n,r)=>n+r.inG,0), outG=rs.reduce((n,r)=>n+r.outG,0);

  /* ---- arus kas ---- */
  const cf=cashflow(from,to);
  const nonRecKas = normalised ? bebanLuarBiasaKas(from,to) : 0;
  const ocf   = cf.opNet + nonRecKas;        // arus kas operasi
  const capex = cf.g.inv.out;                // belanja aset tetap
  const divest= cf.g.inv.in;                 // pelepasan aset, kalau ada
  const fcf   = ocf - capex;                 // free cash flow
  const fin   = cf.finNet;
  const angsTahunan = angs*12;

  return {hari, f, nonRec, nonRecKas, bs, pl, cf,
    revenue, cogs, gross, opex, dep, bunga, pajak, net, ebit, ebitda,
    inv, ca, cl, debt, netDebt, ic, angs, angsTahunan, kasBulanan, inG, outG,
    ocf, capex, divest, fcf, fin,
    varRoast: kode(pl.cogs,"5-9000")};
}

  const dscr = r.angs>0 ? r.kasBulanan/r.angs : null;
  w.append(kartu("Leverage & Solvency Ratios",[

  const dio=r.cogs>0?r.inv/r.cogs*r.hari:null;

  w.append(kartu("Activity / Efficiency Ratios",[

    {nama:"Siklus Konversi Kas",en:"Cash Conversion Cycle (CCC)",rumus:"DIO + DSO − DPO",

    {nama:"Perputaran Total Aset",en:"Total Asset Turnover (TATO)",rumus:"Revenue ÷ Total Assets",

    {nama:"Perputaran Aset Tetap",en:"Fixed Asset Turnover",rumus:"Revenue ÷ PPE neto",

  const dsFcf = r.angsTahunan>0 ? r.fcf*r.f/r.angsTahunan : null;
  w.append(kartu("Cash Flow Ratios",[
    {nama:"Arus Kas Operasi",en:"Operating Cash Flow (OCF)",rumus:"Kas masuk − kas keluar dari kegiatan usaha",

    {nama:"Arus Kas Bebas",en:"Free Cash Flow (FCF)",rumus:"OCF − Capex",

    {nama:"Margin Arus Kas Bebas",en:"FCF Margin",rumus:"FCF ÷ Revenue",
     teks:pct(r.fcf/r.revenue),nilai:r.fcf/r.revenue,baik:amb(r.fcf/r.revenue,0.05,0),acuan:"≥ 5%"},
    {nama:"Konversi Kas",en:"Cash Conversion Ratio",rumus:"OCF ÷ EBITDA",
     teks:r.ebitda>0?pct(r.ocf/r.ebitda):"—",nilai:r.ebitda>0?r.ocf/r.ebitda:null,

    {nama:"Belanja Modal terhadap Pendapatan",en:"Capex to Revenue",rumus:"Capex ÷ Revenue",
     teks:pct(r.capex/r.revenue),nilai:1},
    {nama:"Tingkat Reinvestasi",en:"Capex to Depreciation",rumus:"Capex ÷ Penyusutan",

    {nama:"Arus Kas Bebas terhadap Angsuran",en:"FCF to Debt Service",rumus:"FCF setahun ÷ angsuran setahun",
     teks:dsFcf!=null?kali(dsFcf):"n/a",nilai:dsFcf,baik:dsFcf!=null?amb(dsFcf,1.25,1.0):null,
     acuan:r.angsTahunan>0?"≥ 1,25×":"belum ada angsuran"},
  ], "Free Cash Flow adalah uang yang benar-benar tersisa setelah usaha berjalan dan aset diperbarui — dari sinilah angsuran dibayar, "+
     "pemilik mengambil prive, dan cadangan dibangun. Konversi Kas menunjukkan berapa persen laba EBITDA yang sungguh berubah jadi uang; "+
     "selisih besar biasanya tertahan di persediaan atau piutang."));

  w.append(kartu("Operational KPI",[
    {nama:"Rendemen Roasting",en:"Production Yield",rumus:"Roast bean ÷ Green bean",
     teks:r.inG>0?pct(r.outG/r.inG):"—",nilai:r.inG>0?r.outG/r.inG:null,

     acuan:"asumsi "+num2(S.settings.defaultYield)+"%"},
    {nama:"Green bean diproses",en:"Green bean processed",rumus:"—",teks:gramTxt(r.inG),nilai:1},
    {nama:"Hasil roast bean",en:"Roasted output",rumus:"—",teks:gramTxt(r.outG),nilai:1},
    {nama:"Susut proses",en:"Processing loss",rumus:"Green bean − Roast bean",teks:gramTxt(r.inG-r.outG),nilai:1},
    {nama:"Selisih Biaya Roasting",en:"Roasting Cost Variance",rumus:"Gas aktual − tarif dibebankan",
     teks:rpS(r.varRoast),nilai:r.varRoast,baik:r.varRoast<=0?2:1,
     acuan:r.varRoast<=0?"tarif kemahalan (favourable)":"tarif kemurahan"},
    {nama:"HPP per kg roast bean",en:"COGS per kg roasted",rumus:"COGS ÷ kg roast bean",
     teks:r.outG>0?rp(r.cogs/(r.outG/1000)):"—",nilai:1},
    {nama:"Pendapatan per kg roast bean",en:"Revenue per kg roasted",rumus:"Revenue ÷ kg roast bean",
     teks:r.outG>0?rp(r.revenue/(r.outG/1000)):"—",nilai:1},
  ]));

  /* ---- catatan ---- */
  const cat=el("div",{class:"card"},el("div",{class:"card-h"},el("h3",null,"Basis of Preparation")),
    el("div",{class:"card-b",style:"display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:var(--ink-2)"}));
  const cb=cat.lastChild;
  const N=(j,t2)=>cb.append(el("div",null,el("b",null,j+" "),t2));
  N("Periode.","Seluruh angka laba rugi dihitung "+fmtDate(rasFrom)+" – "+fmtDate(rasTo)+" ("+r.hari+" hari); pos neraca per "+fmtDate(rasTo)+".");
  N("Annualised.","Ekstrapolasi 365 ÷ "+r.hari+" hari. Indikatif saja, bukan proyeksi — periode pendek membesarkan pengaruh transaksi tunggal.");
  N("Normalised.", r.nonRec>0.5
      ? "Mengeluarkan "+rp(r.nonRec)+" beban tidak berulang dari beban usaha. Neraca tetap dilaporkan apa adanya sesuai praktik lazim, sehingga ROE Normalised memakai ekuitas Reported."
      : "Belum ada beban yang ditandai tidak berulang pada periode ini.");
  if(rasNorm && r.nonRec>0.5)
    N("Rekonsiliasi.","EBITDA Reported "+rp(rep.ebitda)+"  →  Normalised "+rp(r.ebitda)+"  (selisih "+rp(r.nonRec)+").");
  N("Pelaporan segmen.","Penjualan sebelum September 2026 tercatat agregat tanpa HPP per produk, sehingga analisis per saluran dan per produk hanya sahih untuk periode setelahnya.");
  N("Perpajakan.","PPh Final "+num2(S.settings.pphRate)+"% dihitung dari peredaran bruto, bukan dari laba. Karena itu beban pajak tidak ikut berubah saat normalisasi.");
  N("Arus kas bebas.","FCF = Arus Kas Operasi − Belanja Modal. Pembelian peralatan digolongkan aktivitas investasi, "+
    "pokok pinjaman dan setoran modal sebagai pendanaan, sedangkan bunga pinjaman tetap di aktivitas operasi.");
  N("Rata-rata neraca.","DIO, DSO, dan DPO memakai saldo akhir periode, bukan rata-rata, karena riwayat datanya belum cukup panjang untuk rata-rata yang bermakna.");
  w.append(cat);
  return w;
}

let repTab="pl";

                 sales:"Rekap Penjualan",tax:"PPh Final UMKM"};
/* Cetak laporan yang sedang dibuka. Isinya dibaca dari susunan laporan itu
   sendiri, bukan dihitung ulang — jadi yang tercetak persis sama dengan layar
   dan kelima tab tidak perlu ditulis dua kali. */
async function cetakLaporanPDF(){

                                : "Periode "+fmtDate(repFrom)+" - "+fmtDate(repTo);

/* Halaman Jurnal punya cetakannya sendiri. Dulu tombolnya memanggil cetak
   Laporan Keuangan, sehingga yang terunduh selalu tab laporan terakhir
   (biasanya Laba Rugi), bukan jurnal yang sedang dibuka. */
async function cetakJurnalPDF(){
  const periode="Periode "+fmtDate(repFrom)+" - "+fmtDate(repTo);

  if(jTab==="jurnal") return cetakNodePDF("Jurnal Umum",periode,viewGeneralJournal,"Jurnal-Umum-"+repFrom+"-sd-"+repTo+".pdf");
  /* Buku Besar: akun yang sedang dibuka, atau semua akun yang punya saldo
     atau mutasi pada periode ini (untuk arsip tutup buku). */
  const awal=balances(null,prevDay(repFrom)), mutasi=balances(repFrom,repTo);
  const aktif=ACCOUNTS.filter(a=>Math.abs(dbBal(awal,a.c))>0.5 || (mutasi[a.c]&&(mutasi[a.c].dr+mutasi[a.c].cr)>0.5));
  const satuAkun=(kode)=>{ const simpan=ledgerAcc; ledgerAcc=kode;
    try{ const kartu=viewLedger(); const h=kartu.querySelector(".card-h");
      if(h) h.replaceChildren(el("h3",null,kode+" · "+accName(kode))); return kartu; }
    finally{ ledgerAcc=simpan; } };
  openModal("Unduh Buku Besar",
    [el("p",{style:"color:var(--ink-2)"},periode+". Pilih akun yang dicetak.")],
    [el("button",{class:"btn",onclick:closeModal},"Batal"),
     el("button",{class:"btn",onclick:async()=>{ closeModal();
       await cetakNodePDF("Buku Besar",periode+" · "+ledgerAcc+" "+accName(ledgerAcc),()=>satuAkun(ledgerAcc),
         "Buku-Besar-"+ledgerAcc+"-"+repFrom+"-sd-"+repTo+".pdf"); }},"Akun ini ("+ledgerAcc+")"),
     el("button",{class:"btn pri",onclick:async()=>{ closeModal();
       await cetakNodePDF("Buku Besar",periode+" · semua akun",()=>{ const wrap=el("div"); aktif.forEach(a=>wrap.append(satuAkun(a.c))); return wrap; },
         "Buku-Besar-semua-akun-"+repFrom+"-sd-"+repTo+".pdf"); }},"Semua akun ("+aktif.length+")")]);
}
async function cetakRasioPDF(){

    (rasNorm?"Normalised":"Reported")+"  ·  "+fmtDate(rasFrom)+" - "+fmtDate(rasTo),
    viewRatios, "Rasio-Keuangan-"+(rasNorm?"normalised":"reported")+"-"+rasFrom+"-sd-"+rasTo+".pdf");
}
async function cetakNodePDF(judul, periode, buatIsi, namaBerkas){
  if(!PDF_OK()){ toast("Pustaka PDF belum termuat. Coba muat ulang halaman."); return; }
  const isi=buatIsi();
  const doc=pdfBaru(), M=40, R=555, BAWAH=780;
  const F=w=>doc.setFont("helvetica",w||"normal");
  let y=0;

  function kop(){
    try{ doc.addImage(IMG_LOGO,"PNG",M,30,50,38); }catch(e){}
    F("bold"); doc.setFontSize(11.5); doc.setTextColor(0);
    doc.text(noDia(S.settings.bizName||"Moerup Coffee Roastery"), M+60, 48);
    F(); doc.setFontSize(8.5); doc.setTextColor(115);
    doc.text(noDia(judul+"  ·  "+periode), M+60, 61);
    doc.setTextColor(0); doc.setDrawColor(205); doc.setLineWidth(.6);
    doc.line(M,78,R,78);
    y=100;
  }
  function ruang(h){ if(y+h>BAWAH){ doc.addPage(); kop(); } }

  /* Elemen kendali layar tidak ikut dicetak, tapi pilihan yang sedang aktif
     (mis. akun di Buku Besar) tetap ditulis supaya kertasnya bisa dibaca. */
  const LEWATI=new Set(["BUTTON","INPUT","TEXTAREA","SVG","CANVAS","SCRIPT","STYLE","DATALIST"]);
  const BLOK=new Set(["DIV","P","TABLE","H1","H2","H3","H4","UL","OL","LI","SECTION","LABEL","SELECT","PRE"]);
  const teksDari=n=>{
    if(n.nodeType===3) return n.textContent;
    if(n.nodeType!==1 || LEWATI.has(n.tagName.toUpperCase())) return "";
    if(n.tagName.toUpperCase()==="SELECT"){ const o=n.options&&n.options[n.selectedIndex]; return o?o.textContent:""; }
    /* Label kecil (mis. "otomatis") dipisah dengan titik tengah supaya tidak menempel ke teks sebelumnya. */
    let out="";
    for(const k of n.childNodes){
      const t=teksDari(k); if(!t.trim()) { out+=t; continue; }
      if(k.nodeType===1 && k.classList.contains("pill") && out.trim()) out+=" \u00b7 "+t;
      else out+=(out && k.nodeType===1 && !/\s$/.test(out) ? " " : "")+t;
    }
    return out;
  };
  const rapi=t=>noDia(String(t||"").replace(/\s+/g," ").trim());
  const potong=(t,lebar)=>{ t=rapi(t); if(doc.getTextWidth(t)<=lebar) return t;
    while(t.length>1 && doc.getTextWidth(t+"...")>lebar) t=t.slice(0,-1); return t+"..."; };

  function tulisSR(e){
    const sp=e.children;
    const kiri=rapi(sp[0]?teksDari(sp[0]):"");
    const kanan=rapi(sp[1]?teksDari(sp[1]):"");
    const h=e.classList.contains("h"), t=e.classList.contains("t"), gt=e.classList.contains("gt");
    const ind=sp[0]&&sp[0].classList.contains("ind");
    if(h){
      ruang(34); y+=10;
      F("bold"); doc.setFontSize(7.4); doc.setTextColor(115);
      doc.text(potong(kiri.toUpperCase(),R-M-90), M, y);
      if(kanan) doc.text(kanan.toUpperCase(), R, y, {align:"right"});
      doc.setTextColor(0); y+=4; doc.setDrawColor(215); doc.line(M,y,R,y); y+=15;
      return;
    }
    const ukuran=gt?11:9.5;
    F(gt||t?"bold":"normal"); doc.setFontSize(ukuran);
    const x0=M+(ind?12:0);
    const lebarKiri=Math.max(80, R-x0-doc.getTextWidth(kanan)-16);
    const baris=doc.splitTextToSize(kiri, lebarKiri);
    const tinggi=baris.length*(ukuran*1.2);
    if(gt){
      ruang(tinggi+30); y+=6;
      doc.setDrawColor(40); doc.setLineWidth(1.1); doc.line(M,y,R,y); doc.setLineWidth(.6);
      y+=15; F("bold"); doc.setFontSize(11);
      baris.forEach((l,i)=>doc.text(l, M, y+i*13));
      doc.text(kanan, R, y, {align:"right"});
      y+=(baris.length-1)*13+6; doc.setDrawColor(40); doc.setLineWidth(1.1); doc.line(M,y,R,y); doc.setLineWidth(.6);
      y+=16; return;
    }
    if(t){ ruang(tinggi+14); y+=4; doc.setDrawColor(185); doc.line(M,y,R,y); y+=13; F("bold"); doc.setFontSize(9.5); }
    else { ruang(tinggi+4); F(); doc.setFontSize(9.5); }
    baris.forEach((l,i)=>doc.text(l, x0, y+i*11.5));
    doc.text(kanan, R, y, {align:"right"});
    y+=(baris.length-1)*11.5+15;
  }

  /* Lebar kolom dihitung dari isinya: kolom angka selebar angka terpanjang,
     kolom teks berbagi sisanya dan dibungkus ke baris berikutnya. Sebelumnya
     semua kolom dibagi rata, jadi tabel berkolom banyak saling menimpa. */
  function tulisTabel(tb){
    const selTeks=td=>{
      const bagian=[...td.childNodes].map(n=>rapi(teksDari(n))).filter(Boolean);
      return bagian.join(" · ");
    };
    const kepala=[...tb.querySelectorAll("thead th")].map(th=>({t:rapi(teksDari(th)).toUpperCase(), r:th.classList.contains("r")}));
    const ambil=(tr,tot)=>{
      const sel=[];
      for(const td of tr.children){
        const span=Math.max(1,+td.colSpan||1);
        sel.push({t:selTeks(td), span, ind:!!(td.style&&td.style.paddingLeft&&parseFloat(td.style.paddingLeft)>15)});
        for(let k=1;k<span;k++) sel.push(null);
      }
      return {sel, tot:tot||tr.classList.contains("tot")};
    };
    const baris=[...tb.querySelectorAll("tbody tr")].map(tr=>ambil(tr,false))
      .concat([...tb.querySelectorAll("tfoot tr")].map(tr=>ambil(tr,true)));
    if(!baris.length) return;
    let n=Math.max(kepala.length, ...baris.map(b=>b.sel.length));
    /* kolom yang di semua barisnya kosong (grafik batang, tombol) dibuang */
    const dipakai=[];
    for(let j=0;j<n;j++){
      if(baris.some(b=>{ const c=b.sel[j]; return c && c.t; })) dipakai.push(j);
    }
    const angka=/^[-(]?\s*(Rp\s*)?-?\(?\s*[\d.,]+(\s*(%|×|x|hari|kg|g|pcs))?\)?$/i;
    const kol=dipakai.map(j=>{
      const isi=baris.map(b=>b.sel[j]).filter(c=>c && c.span===1 && c.t);
      const num=isi.filter(c=>angka.test(c.t)||c.t==="-"||c.t==="—").length;
      /* Ikuti perataan kepala tabel di layar; tebak dari isi hanya kalau tabelnya tanpa kepala. */
      return {j, head:kepala[j]?kepala[j].t:"", kanan:kepala.length ? !!(kepala[j]&&kepala[j].r) : (isi.length>0 && num/isi.length>=0.8)};
    });
    const JARAK=10, LEBAR=R-M;
    let fs=kol.length>=8?7.4:kol.length>=6?8:8.8, w=[];
    for(let coba=0;coba<6;coba++){
      doc.setFontSize(fs);
      const alami=kol.map(k=>{
        F("bold"); doc.setFontSize(6.8);
        const hw=k.head?Math.min(doc.getTextWidth(k.head), 90):0;
        doc.setFontSize(fs);
        let m=0;
        for(const b of baris){ const c=b.sel[k.j]; if(!c||c.span!==1) continue; F(b.tot?"bold":"normal"); m=Math.max(m, doc.getTextWidth(c.t)); }
        return Math.max(hw, m);
      });
      const tetap=kol.reduce((s,k,i)=>s+(k.kanan?alami[i]:0),0);
      const teks=kol.reduce((s,k,i)=>s+(k.kanan?0:alami[i]),0);
      const sisa=LEBAR-JARAK*(kol.length-1)-tetap;
      const nTeks=kol.filter(k=>!k.kanan).length;
      if(nTeks && sisa<nTeks*55 && fs>6.4){ fs-=0.5; continue; }
      if(!nTeks && sisa<0 && fs>6.4){ fs-=0.5; continue; }
      /* Kolom teks yang pendek diberi lebar penuhnya dulu; sisanya dibagi rata
         ke kolom yang panjang, jadi yang terlipat hanya teks yang memang panjang. */
      const wt={}; let sisaT=sisa, berapa=nTeks;
      kol.map((k,i)=>i).filter(i=>!kol[i].kanan).sort((a,b)=>alami[a]-alami[b]).forEach(i=>{
        const adil=sisaT/berapa; wt[i]=Math.min(alami[i],adil); sisaT-=wt[i]; berapa--; });
      w=kol.map((k,i)=>{
        if(k.kanan) return alami[i] + (nTeks?0:Math.max(0,sisa)/kol.length);
        return teks<=sisa ? alami[i] + (sisa-teks)*(alami[i]/(teks||1)) : wt[i];
      });
      break;
    }
    const xs=[]; let xx=M; w.forEach((v,i)=>{ xs.push(xx); xx+=v+JARAK; });
    const lh=fs*1.3;
    function gambarKepala(){
      if(!kol.some(k=>k.head)) return;
      F("bold"); doc.setFontSize(6.8); doc.setTextColor(115);
      const bh=kol.map((k,i)=>doc.getTextWidth(k.head||"")<=w[i]+1 ? [k.head||""] : doc.splitTextToSize(k.head||"", w[i]));
      const tinggi=Math.max(...bh.map(b=>b.length))*8.5;
      y+=6;
      bh.forEach((ls,i)=>ls.forEach((l,r)=>{
        const yy=y+r*8.5;
        if(kol[i].kanan) doc.text(l, xs[i]+w[i], yy, {align:"right"}); else doc.text(l, xs[i], yy);
      }));
      doc.setTextColor(0); y+=tinggi-4; doc.setDrawColor(215); doc.setLineWidth(.6); doc.line(M,y,R,y); y+=12;
    }
    function ruangTabel(h){ if(y+h>BAWAH){ doc.addPage(); kop(); gambarKepala(); } }
    const kelompok = baris.some(b=>{ const c=b.sel[kol[0].j]; return !c || !c.t; }) && baris.some(b=>{ const c=b.sel[kol[0].j]; return c && c.t; });
    ruang(60); gambarKepala();
    baris.forEach((b,bi)=>{
      doc.setFontSize(fs); F(b.tot?"bold":"normal");
      const isi=[];
      kol.forEach((k,i)=>{
        const c=b.sel[k.j]; if(!c) return;
        let lebar=w[i];
        if(c.span>1){ for(let s=1;s<c.span;s++){ const idx=kol.findIndex(q=>q.j===k.j+s); if(idx>=0) lebar+=w[idx]+JARAK; } }
        const geser=c.ind?12:0;
        const kanan=k.kanan && c.span===1;
        const ls=(kanan || doc.getTextWidth(c.t)<=lebar-geser+1) ? [c.t] : doc.splitTextToSize(c.t, Math.max(20,lebar-geser));
        isi.push({i, ls, kanan, geser, lebar});
      });
      const tinggi=Math.max(1,...isi.map(c=>c.ls.length))*lh;
      ruangTabel(tinggi+6);
      const awalKelompok = kelompok && bi>0 && b.sel[kol[0].j] && b.sel[kol[0].j].t;
      if(b.tot){ y-=2; doc.setDrawColor(185); doc.line(M,y,R,y); y+=11; }
      else if(awalKelompok){ y-=3; doc.setDrawColor(232); doc.line(M,y,R,y); y+=5; }
      doc.setFontSize(fs); F(b.tot?"bold":"normal");
      isi.forEach(c=>c.ls.forEach((l,r)=>{
        const yy=y+r*lh;
        if(c.kanan) doc.text(l, xs[c.i]+w[c.i], yy, {align:"right"});
        else doc.text(l, xs[c.i]+c.geser, yy);
      }));
      y+=tinggi+3;
    });
    y+=10;
  }

  function tulisJudul(teks,besar){
    teks=rapi(teks); if(!teks) return;
    ruang(besar?80:70); y+=8; F("bold"); doc.setFontSize(besar?12.5:10.5);
    doc.splitTextToSize(teks, R-M).forEach(l=>{ doc.text(l, M, y); y+=besar?17:15; });
  }
  function tulisParagraf(teks, gaya){
    teks=rapi(teks); if(!teks) return;
    const peringatan=gaya==="warn";
    F(peringatan?"bold":"normal"); doc.setFontSize(8.8);
    doc.splitTextToSize(teks, R-M).forEach(l=>{ ruang(14);
      F(peringatan?"bold":"normal"); doc.setFontSize(8.8); doc.setTextColor(peringatan?120:95);
      doc.text(l, M, y); y+=12; });
    doc.setTextColor(0); y+=4;
  }
  function tulisKpi(k){
    const lbl=rapi(teksDari(k.querySelector(".eyebrow")||{nodeType:3,textContent:""}));
    const val=rapi(teksDari(k.querySelector(".v")||{nodeType:3,textContent:""}));
    const sub=rapi(teksDari(k.querySelector(".s")||{nodeType:3,textContent:""}));
    ruang(28); F(); doc.setFontSize(9.5);
    doc.text(potong(lbl,R-M-doc.getTextWidth(val)-16), M, y);
    F("bold"); doc.text(val, R, y, {align:"right"});
    y+=11;
    if(sub){ F(); doc.setFontSize(7.8); doc.setTextColor(120); doc.text(potong(sub,R-M), M, y); doc.setTextColor(0); y+=12; }
    else y+=3;
  }

  /* Elemen yang isinya hanya teks (termasuk teks lepas di dalam div, catatan,
     peringatan) ikut dicetak. Dulu hanya <p> yang dibaca, jadi catatan kaki,
     Basis of Preparation, dan tanda "Neraca seimbang" hilang dari PDF. */
  function jalan(n){
    let kpiGrid=false;
    for(const c of n.childNodes){
      if(c.nodeType===3){ tulisParagraf(c.textContent); continue; }
      if(c.nodeType!==1) continue;
      const tag=c.tagName.toUpperCase();
      if(LEWATI.has(tag) || c.classList.contains("noprint") || c.classList.contains("sub")) continue;
      if(c.classList.contains("kpi")){ if(!kpiGrid){ y+=6; kpiGrid=true; } tulisKpi(c); continue; }
      if(c.classList.contains("sr")){ tulisSR(c); continue; }
      if(tag==="TABLE"){ tulisTabel(c); continue; }
      if(tag==="H1"||tag==="H2"){ tulisJudul(teksDari(c),true); continue; }
      if(tag==="H3"||tag==="H4"){ tulisJudul(teksDari(c),false); continue; }
      if(tag==="SELECT"){ tulisJudul(teksDari(c),false); continue; }
      if(tag==="LI"){ tulisParagraf("• "+teksDari(c)); continue; }
      const adaBlok=[...c.children].some(k=>BLOK.has(k.tagName.toUpperCase())||k.classList.contains("kpi")||k.classList.contains("sr"));
      if(!adaBlok){ tulisParagraf(teksDari(c), c.classList.contains("warnbox")?"warn":null); continue; }
      jalan(c);
    }
  }

  kop();
  jalan(isi);

  const hal=doc.internal.getNumberOfPages();
  for(let i=1;i<=hal;i++){
    doc.setPage(i); F(); doc.setFontSize(7.5); doc.setTextColor(140);
    doc.text(noDia("Kitab Roastery  ·  dicetak "+fmtDate(todayISO())), M, 812);
    doc.text("Halaman "+i+" / "+hal, R, 812, {align:"right"});
  }
  await simpanPDF(doc, namaBerkas);
}

async function download(name,text,type){
  // Di dalam artifact, unduhan yang dimulai halaman sendiri diblokir sandbox —
  // pakai kapabilitas downloads bila tersedia, selain itu jatuh ke blob biasa.
  try{
    if(window.claude && claude.use){
      const d = await claude.use("downloads");
      if(d){ await d.save({filename:name, data:text}); return true; }
    }
  }catch(e){ toast("Unduhan dibatalkan."); return false; }
  const blob=new Blob([text],{type:type||"application/json"});
  const url=URL.createObjectURL(blob); const a=el("a",{href:url,download:name}); document.body.append(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
  return true;
}
/* Menguji jalur simpan yang sebenarnya dipakai form, lalu melaporkan hasilnya
   apa adanya — supaya kalau ada yang gagal, penyebabnya kelihatan, bukan diam. */
/* Palu besar: dorong SELURUH isi layar ke server dalam satu tulisan penuh.
   Berguna kalau penyimpanan per item gagal karena sebab yang tidak jelas. */
async function pushAllToServer(){
  if(!Store.db){ toast("Belum tersambung ke server."); return; }
  toast("Mengirim ulang semua data…");
  let gagal=0;
  try{ await Store.db.doc("master/catalog").set(Store._catalogNow());
       const cek=await Store.db.doc("master/catalog").get();
       const c=cek.data()||{};
       if(Object.keys(c.skus||{}).length!==Object.keys(S.skus).length) gagal++;
       logDb("dorong katalog", gagal===0, Object.keys(S.skus).length+" produk");
  }catch(e){ gagal++; logDb("dorong katalog", false, describeErr(e)); }

  const bulan={};
  Object.values(S.txns).forEach(t=>{ (bulan[monthOf(t.date)] ||= {})[t.id]=t; });
  for(const m of Object.keys(bulan)){
    try{ await Store.db.doc("ledger/"+m).set({txns:bulan[m]}); logDb("dorong ledger "+m, true, Object.keys(bulan[m]).length+" transaksi"); }
    catch(e){ gagal++; logDb("dorong ledger "+m, false, describeErr(e)); }
  }
  try{ await Store.db.doc("master/settings").set(S.settings); }catch(e){ gagal++; logDb("dorong pengaturan", false, describeErr(e)); }

  if(gagal===0){ unsaved.clear(); recompute(); render(); toast("Semua data berhasil dikirim ke server."); }
  else { render(); writeFail(new Error(gagal+" bagian gagal dikirim. Buka Pengaturan → Uji koneksi & simpan untuk rinciannya."), "pengiriman ulang"); }
}
async function runDiagnostics(){
  const rows=[];
  const line=(nama,ok,ket)=>rows.push({nama,ok,ket});
  line("Mode penyimpanan", Store.mode==="cloud", Store.mode==="cloud" ? "cloud (tersimpan di server)" : "LOKAL — browser ini saja. "+(Store.dbReason||""));
  if(Store.db){
    try{ const d=await Store.db.doc("master/catalog").get();
      line("Baca data master", true, d.exists ? "berhasil, dokumen ditemukan" : "dokumen belum ada");
    }catch(e){ line("Baca data master", false, describeErr(e)); }

    // Meniru jalur simpan sungguhan: coba update() dulu, lalu set() sebagai cadangan
    // kalau dokumennya memang belum ada. Baru dianggap gagal kalau dua-duanya ditolak.
    async function ujiTulis(nama, path, payload, bersihkan){
      const ref=Store.db.doc(path);
      try{ await ref.update(payload); line(nama, true, "berhasil (gabung)"); }
      catch(e){
        try{ await ref.set(payload); line(nama, true, "berhasil (dokumen baru dibuat)"); }
        catch(e2){ line(nama, false, describeErr(e2)); return; }
      }
      try{ const cur=await ref.get(); const full=cur.data()||{}; delete full.diag; await ref.set(bersihkan(full)); }catch(e){}
    }
    await ujiTulis("Tulis data master", "master/catalog", {diag:{ts:Date.now()}}, f=>f);
    await ujiTulis("Tulis transaksi", "ledger/"+monthOf(todayISO()), {diag:{ts:Date.now()}}, f=>f);
  } else {
    line("Sambungan server", false, "tidak tersambung — data hanya tersimpan di browser ini");
  }
  line("Jumlah data sekarang", true,
    Object.keys(S.greenbeans).length+" green bean · "+Object.keys(S.supplies).length+" kemasan · "+
    Object.keys(S.skus).length+" produk · "+Object.keys(S.assets).length+" aset · "+Object.keys(S.txns).length+" transaksi");
  if(unsaved.size) line("Belum tersimpan ke server", false, unsaved.size+" item: "+[...unsaved.values()].join(", "));
  if(crashSeen) line("Kesalahan aplikasi terakhir", false, crashSeen.when+" — "+crashSeen.dari+": "+crashSeen.detail);
  if(lastWriteError) line("Kegagalan simpan terakhir", false, lastWriteError.when+" — "+lastWriteError.what+": "+lastWriteError.detail);
  dbLog.slice(-8).reverse().forEach(l=>line("· "+l.op, l.ok, l.t+(l.detail?" — "+l.detail:"")));

  const box=el("div",{style:"display:flex;flex-direction:column;gap:8px"});
  rows.forEach(r=>box.append(el("div",{class:"row",style:"justify-content:space-between;gap:12px;align-items:flex-start"},
    el("div",null,el("div",{style:"font-weight:500"},r.nama),
      el("div",{style:"font-size:11.5px;color:var(--ink-3);max-width:46ch"},r.ket)),
    el("span",{class:"pill "+(r.ok?"p":"n")},r.ok?"OK":"GAGAL"))));
  const teks=rows.map(r=>(r.ok?"OK   ":"GAGAL")+" | "+r.nama+" | "+r.ket).join("\n");
  openModal("Diagnosa penyimpanan", [box],
    [el("button",{class:"btn",onclick:async()=>{
        try{ await navigator.clipboard.writeText(teks); toast("Hasil disalin — tinggal tempel ke chat."); }
        catch(e){ toast("Tidak bisa menyalin otomatis."); }
      }},"Salin hasil"),
     el("button",{class:"btn pri",onclick:closeModal},"Tutup")]);
}

const PDF_OK = ()=> !!(window.jspdf && window.jspdf.jsPDF);
/* Font bawaan PDF hanya mengenal huruf Latin dasar (WinAnsi). Karakter lain —
   tanda kurang "−", panah, "≥", centang — membuat jsPDF pindah ke mode Unicode
   dan seluruh baris tercetak renggang huruf per huruf. Jadi diterjemahkan dulu. */
const PDF_GANTI={"\u2212":"-","\u2013":"-","\u2014":"-","\u2011":"-","\u201c":'"',"\u201d":'"',"\u2018":"'","\u2019":"'",
  "\u2192":"->","\u2190":"<-","\u2265":">=","\u2264":"<=","\u2248":"~","\u2260":"!=","\u2713":"","\u2714":"","\u26a0":"!",
  "\u00a0":" ","\u2009":" ","\u202f":" "};
const noDia = t => String(t==null?"":t)
  .replace(/[\u2212\u2013\u2014\u2011\u201c\u201d\u2018\u2019\u2192\u2190\u2265\u2264\u2248\u2260\u2713\u2714\u26a0\u00a0\u2009\u202f]/g, c=>PDF_GANTI[c])
  .replace(/[^\n\x20-\x7E\xA1-\xFF\u2022\u2026\u20ac]/g, c=>c.normalize("NFKD").replace(/[^\x20-\x7E\xA1-\xFF]/g,""));
function pdfBaru(){
  const {jsPDF}=window.jspdf;
  const d=new jsPDF({unit:"pt",format:"a4"});
  d.setFont("helvetica","normal");
  return d;
}
async function simpanPDF(doc, nama){
  try{
    const blob=doc.output("blob");
    if(window.claude && claude.use){
      const dl=await claude.use("downloads");
      if(dl){ await dl.save({filename:nama, data:blob}); toast("PDF disiapkan."); return true; }
    }
    const url=URL.createObjectURL(blob); const a=el("a",{href:url,download:nama});
    document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
    toast("PDF disiapkan."); return true;
  }catch(e){
    if(e && e.code==="declined"){ toast("Unduhan dibatalkan."); return false; }
    writeFail(e,"pembuatan PDF"); return false;
  }
}
function kopPDF(doc, judul, sub){
  const st=S.settings, M=48; let y=54;
  doc.setFontSize(15); doc.setFont("helvetica","bold");
  doc.text(noDia(st.bizName||"Kitab Roastery"), M, y);
  doc.setFontSize(8.5); doc.setFont("helvetica","normal"); doc.setTextColor(110);
  if(st.bizAddress){ y+=13; doc.text(noDia(st.bizAddress), M, y); }
  if(st.bizPhone){ y+=11; doc.text(noDia(st.bizPhone), M, y); }
  doc.setTextColor(0); doc.setFontSize(13); doc.setFont("helvetica","bold");
  doc.text(noDia(judul), 547, 54, {align:"right"});
  if(sub){ doc.setFontSize(9); doc.setFont("helvetica","normal"); doc.setTextColor(110);
    noDia(sub).split("\n").forEach((l,i)=>doc.text(l, 547, 70+i*12, {align:"right"})); doc.setTextColor(0); }
  y=Math.max(y, 70+(sub?noDia(sub).split("\n").length*12:0))+14;
  doc.setDrawColor(200); doc.line(M, y, 547, y);
  return y+18;
}
function kakiPDF(doc){
  const n=doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i);
    doc.setFontSize(7.5); doc.setTextColor(150);
    doc.text(noDia("Dibuat dari Kitab Roastery - "+fmtDate(todayISO())), 48, 812);
    doc.text("Hal. "+i+"/"+n, 547, 812, {align:"right"}); doc.setTextColor(0); }
}
/* Nomor invoice diturunkan dari urutan penjualan dalam bulannya, jadi stabil
   dan tidak perlu disimpan terpisah. */
/* Nomor hanya diambil saat invoice benar-benar dibuat, lalu menempel di
   penjualan itu. Penjualan tanpa invoice tidak memakan nomor. */
function nomorInvoiceBaru(tanggal){
  const m=monthOf(tanggal), th=m.slice(0,4), bl=+m.slice(5,7);
  const dipakai=Object.values(S.txns)
    .filter(x=>x.type==="sale"&&x.invoiceNo&&monthOf(x.date)===m)
    .map(x=>parseInt(String(x.invoiceNo).split("/").pop(),10)||0);
  const n=(dipakai.length?Math.max(...dipakai):0)+1;
  return (S.settings.invoicePrefix||"MRP/INV")+"/"+th+"/"+ROMAWI[bl]+"/"+String(n).padStart(3,"0");

/* Terbilang dalam bahasa Indonesia untuk baris penutup invoice. */
function terbilang(n){
  n=Math.round(Math.abs(+n||0));
  const sat=["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
  const f=x=>{
    if(x<12) return sat[x];
    if(x<20) return f(x-10)+" belas";
    if(x<100) return f(Math.floor(x/10))+" puluh"+(x%10?" "+f(x%10):"");
    if(x<200) return "seratus"+(x%100?" "+f(x%100):"");
    if(x<1000) return f(Math.floor(x/100))+" ratus"+(x%100?" "+f(x%100):"");
    if(x<2000) return "seribu"+(x%1000?" "+f(x%1000):"");
    if(x<1e6) return f(Math.floor(x/1000))+" ribu"+(x%1000?" "+f(x%1000):"");
    if(x<1e9) return f(Math.floor(x/1e6))+" juta"+(x%1e6?" "+f(x%1e6):"");
    if(x<1e12) return f(Math.floor(x/1e9))+" miliar"+(x%1e9?" "+f(x%1e9):"");
    return f(Math.floor(x/1e12))+" triliun"+(x%1e12?" "+f(x%1e12):"");
  };
  if(!n) return "Nol rupiah";
  const t=f(n).replace(/\s+/g," ").trim();
  return t.split(" ").map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ")+" Rupiah";
}
const BULAN_PANJANG=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function fmtDateLong(d){ const a=String(d).split("-"); if(a.length<3) return String(d);
  return String(+a[2])+" "+BULAN_PANJANG[+a[1]-1]+" "+a[0]; }
const tglPendek = d => { const a=String(d).split("-"); return a[2]+"-"+a[1]+"-"+a[0]; };
const tambahHari = (d,n)=>{ const x=new Date(d+"T00:00:00"); x.setDate(x.getDate()+n); return x.toLocaleDateString("sv-SE"); };

/* Batch yang dipakai satu baris penjualan, per bean dalam resepnya. */
function batchBaris(line, sku){
  const out=[];
  for(const bn of lineBeans(line,sku)){
    const bean=S.greenbeans[bn.greenbeanId]; if(!bean) continue;
    for(const k of lineKonsumsi(line,bn,+line.qty||0))
      out.push({bean, level:k.level, gram:k.gram, kode:k.kode, roastDate:k.roastDate});
  }
  return out;
}

/* Batch roasting yang tersedia untuk satu bean + level, terbaru di atas. */
/* Seluruh batch dari satu green bean, level apa pun, terbaru di atas.
   Level tidak lagi disaring: kamu boleh mengirim dari batch level lain,
   dan stok yang dipotong ikut level batch itu. */
function batchTersedia(greenbeanId, kecualiTxnId, tetapTampil){
  const wajib=new Set([].concat(tetapTampil||[]).filter(Boolean));
  const semua = Object.values(S.txns)
    .filter(x=>x.type==="roast" && x.greenbeanId===greenbeanId)
    .sort((a,b)=> (b.date+String(b.seq||0)).localeCompare(a.date+String(a.seq||0)))
    .map(x=>({id:x.id, kode:batchCode(x), date:x.date, level:normLevel(x.profile),
              hasil:+x.outputG||0, sisa:batchSisa(x.id, kecualiTxnId)}));
  /* Opname menyesuaikan saldo kantong stok tapi tidak menyebut batch mana yang
     susut. Tanpa koreksi ini, jumlah sisa seluruh batch bisa melebihi isi
     gudang yang sebenarnya — batch menawarkan stok yang sudah kamu hapus lewat
     opname, lalu stoknya minus begitu dijual. Kelebihannya dipangkas
     proporsional karena tidak ada cara tahu batch mana yang berkurang. */
  const perLevel={};
  semua.forEach(b=>{ (perLevel[b.level] ||= []).push(b); });
  /* Setiap kantong stok bean ini ikut diperiksa, termasuk level yang batchnya
     sudah habis atau tidak pernah di-roasting sama sekali (stoknya datang dari
     opname). Dulu level seperti itu dilewati: stoknya ada di gudang, tapi tidak
     bisa dipilih saat menjual — misalnya Robusta Kelir Medium hasil opname. */
  for(const k of Object.keys(BOOKS.inv.rb)){
    const sp=rbSplit(k);
    if(sp.gbId===greenbeanId) perLevel[sp.level] ||= [];
  }
  for(const level of Object.keys(perLevel)){
    const anggota=perLevel[level];
    const jml=anggota.reduce((n,b)=>n+Math.max(0,b.sisa),0);
    let saldo=(BOOKS.inv.rb[rbKey(greenbeanId,level)]||{qty:0}).qty;
    const t=kecualiTxnId?S.txns[kecualiTxnId]:null;
    if(t && t.type==="sale"){            // pemakaian transaksi yang sedang diedit dikembalikan dulu
      for(const l of (t.lines||[])){
        const sku=S.skus[l.skuId]; if(!sku) continue;
        for(const bn of lineBeans(l,sku)){
          if(bn.greenbeanId!==greenbeanId) continue;
          for(const k of lineKonsumsi(l,bn,+l.qty||0)) if(k.level===level) saldo+=k.gram;
        }
      }
    }
    if(jml>0.5 && jml > saldo+0.5){
      const f=Math.max(0,saldo)/jml;
      anggota.forEach(b=>{ b.sisa=Math.max(0,b.sisa)*f; });
    }
    else if(saldo > jml+0.5){
      /* Sebaliknya: kantong berisi lebih banyak daripada yang bisa ditelusuri
         ke batch — biasanya karena opname menaikkan stok. Barangnya nyata dan
         boleh dijual, jadi ditawarkan sebagai baris tanpa kode batch. */
      semua.push({id:NOBATCH+level, kode:"Tanpa batch", date:"", level:level,
                  hasil:0, sisa:saldo-jml, tanpaBatch:true});
    }
  }
  /* Stok tanpa batch yang sudah dipakai transaksi ini tetap muncul walau
     kantongnya sekarang kosong, supaya pilihan lamanya tidak tertukar saat
     transaksinya dibuka ulang. */
  for(const id of wajib){
    if(String(id).indexOf(NOBATCH)===0 && !semua.some(b=>b.id===id))
      semua.push({id:id, kode:"Tanpa batch", date:"", level:normLevel(String(id).slice(NOBATCH.length)),
                  hasil:0, sisa:0, tanpaBatch:true});
  }
  semua.forEach(b=>{ b.habis = b.sisa<=0.5; });
  /* Batch yang sudah nol tidak ditawarkan lagi supaya daftarnya tidak
     menumpuk. Yang sedang terpilih tetap ditampilkan agar transaksi lama
     masih bisa dibuka dan diperbaiki. */
  return semua.filter(b=> !b.habis || wajib.has(b.id));
}

  const per=(t.payroll&&t.payroll.period)||monthOf(t.date);

/* ----------------------- IMPOR: SAMAKAN DENGAN BERKAS -----------------------
   Impor cadangan membuat data di sini SAMA PERSIS dengan isi berkas: transaksi
   baru ditambah, yang berubah diperbarui, dan yang tidak ada di berkas DIHAPUS
   (kecuali yang sengaja dipertahankan). Dulu impor hanya menimpa per ID, jadi
   transaksi yang dihapus di tempat asal tetap tertinggal di sini dan dua sistem
   pelan-pelan tidak sama lagi. Sebelum menulis, ringkasan perubahannya
   ditampilkan dulu dan cadangan data saat ini bisa diunduh. */
function rencanaImpor(d){
  const file=d.txns||{}, kini=S.txns||{};
  const sama=(x,y)=>JSON.stringify(x)===JSON.stringify(y);
  const baru=[], ubah=[], hapus=[];
  for(const [id,t] of Object.entries(file)){ if(!kini[id]) baru.push(id); else if(!sama(kini[id],t)) ubah.push(id); }
  for(const id of Object.keys(kini)) if(!file[id]) hapus.push(id);
  const kat={};
  for(const j of ["greenbeans","supplies","skus","assets","customers"]){
    const f=d[j]||{}, k=S[j]||{};
    kat[j]={tambah:Object.keys(f).filter(i=>!k[i]).length, hapus:Object.keys(k).filter(i=>!f[i]).map(i=>k[i].name||i)};
  }
  return {baru, ubah, hapus, kat};
}
function importJSON(){
  const f=el("input",{type:"file",accept:".json,application/json",style:"display:none"});
  f.addEventListener("change",()=>{ const file=f.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{ let d;
      try{ d=thaw(JSON.parse(r.result)); }catch(e){ toast("Berkas tidak bisa dibaca."); return; }
      if(!d || typeof d!=="object" || !d.txns || typeof d.txns!=="object" || Array.isArray(d.txns)){
        toast("Ini bukan berkas cadangan Kitab Roastery (bagian transaksi tidak ditemukan)."); return; }
      tinjauImpor(d, file.name);
    };
    r.readAsText(file); });
  document.body.append(f); f.click(); setTimeout(()=>f.remove(),60000);
}
function tinjauImpor(d, namaBerkas){
  const rc=rencanaImpor(d);
  const pertahankan=new Set();
  const nilai=t=>{ try{ return rp(txnAmount(t)); }catch(e){ return ""; } };
  const daftar=el("div",{style:"max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px"});
  if(rc.hapus.length){
    const t=el("table"); t.append(el("thead",null,el("tr",null,el("th",null,"Hapus"),el("th",null,"Tanggal"),el("th",null,"Transaksi"),el("th",{class:"r"},"Nilai"),el("th",null,"Oleh"))));
    const tb=el("tbody");
    rc.hapus.map(id=>S.txns[id]).sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(x=>{
      const cb=el("input",{type:"checkbox",checked:"checked"});
      cb.addEventListener("change",()=>{ if(cb.checked) pertahankan.delete(x.id); else pertahankan.add(x.id); ringkas(); });
      tb.append(el("tr",null,el("td",null,cb),el("td",{class:"num",style:"white-space:nowrap"},fmtDate(x.date)),
        el("td",{style:"font-size:12px"},el("b",null,TXN_LABEL[x.type]||x.type)," · ",txnDesc(x)),
        el("td",{class:"r num"},nilai(x)),el("td",{style:"font-size:11.5px;color:var(--ink-3)"},x.by||"—")));
    });
    t.append(tb); daftar.append(t);
  }
  const katHapus=Object.entries(rc.kat).filter(([,v])=>v.hapus.length);
  const NAMA={greenbeans:"green bean",supplies:"kemasan & bahan",skus:"produk",assets:"aset",customers:"pelanggan"};
  const ringkasBox=el("div",{class:"calc"});
  function ringkas(){
    const L=(a,b,cls)=>el("div",{class:"l"+(cls?" "+cls:"")},el("span",null,a),el("span",null,b));
    ringkasBox.replaceChildren(
      L("Transaksi di berkas", num(Object.keys(d.txns).length)),
      L("Transaksi di sini sekarang", num(Object.keys(S.txns).length)),
      L("Ditambahkan", num(rc.baru.length)), L("Diperbarui", num(rc.ubah.length)),
      L("Dihapus (tidak ada di berkas)", num(rc.hapus.length-pertahankan.size),"b"),
      pertahankan.size ? L("Dipertahankan", num(pertahankan.size)) : el("span"));
  }
  ringkas();
  const cadangI=el("input",{type:"checkbox",checked:"checked"});
  const bodi=[
    el("p",{style:"color:var(--ink-2);font-size:12.5px"},
      "Data di sini akan dibuat ",el("b",null,"sama persis")," dengan isi ",el("b",null,namaBerkas||"berkas"),
      ": transaksi baru ditambahkan, yang berubah diperbarui, dan transaksi yang tidak ada di berkas dihapus. Data master (produk, bahan, aset, pelanggan) dan pengaturan juga disamakan."),
    ringkasBox,
    rc.hapus.length ? el("div",null,
      el("span",{class:"eyebrow",style:"display:block;margin-bottom:6px"},"Transaksi yang akan dihapus — hilangkan centang untuk mempertahankan"),
      daftar,
      el("div",{class:"hint"},"Biasanya isinya: transaksi yang sudah dihapus di tempat asal, atau transaksi yang tercatat dua kali. Pertahankan hanya yang memang belum tercatat di berkas.")) : null,
    katHapus.length ? el("div",{class:"warnbox"},el("b",null,"Data master yang ikut dihapus: "),
      katHapus.map(([j,v])=>v.hapus.length+" "+NAMA[j]+" ("+v.hapus.slice(0,4).join(", ")+(v.hapus.length>4?", …":"")+")").join(" · ")) : null,
    el("label",{style:"display:flex;gap:8px;align-items:center;font-size:12.5px"},cadangI,"Unduh cadangan data saat ini dulu (disarankan)")
  ];
  openModal("Impor cadangan — samakan dengan berkas", bodi,
    [el("button",{class:"btn",onclick:closeModal},"Batal"),
     el("button",{class:"btn pri",onclick:async()=>{
       if(cadangI.checked){ const ok=await download("cadangan-sebelum-impor-"+todayISO()+".json", JSON.stringify(S,null,2)); if(!ok) return; }
       tundaSync=true; closeModal();
       let gagal=0, dihapus=[];
       try{
       const simpan={}; for(const id of pertahankan) simpan[id]=S.txns[id];
       dihapus=rc.hapus.filter(id=>!pertahankan.has(id));
       let n=0; const total=dihapus.length+rc.baru.length+rc.ubah.length;
       const kemajuan=()=>{ n++; if(n%10===0||n===total) toast("Menyamakan data… "+n+"/"+total); };
       // 1) hapus dulu, selagi S masih memuat catatan lama (bulannya perlu diketahui)
       for(const id of dihapus){ if(!(await Store.delTxn(id))) gagal++; kemajuan(); }
       // 2) ganti data master & pengaturan seluruhnya
       const lama={greenbeans:S.greenbeans,supplies:S.supplies,skus:S.skus,assets:S.assets,customers:S.customers};
       const isi={...(d.txns||{}),...simpan};
       S={settings:{...DEFAULT_SETTINGS,...(d.settings||{})},greenbeans:{...(d.greenbeans||{})},supplies:{...(d.supplies||{})},
          skus:{...(d.skus||{})},assets:{...(d.assets||{})},customers:{...(d.customers||{})},txns:{...isi}};
       // data master yang dipakai transaksi yang dipertahankan (mis. aset dari pembelian peralatan) ikut dipertahankan
       const rujukan=new Set(); const kumpul=v=>{ if(typeof v==="string") rujukan.add(v); else if(v&&typeof v==="object") Object.values(v).forEach(kumpul); };
       Object.values(simpan).forEach(kumpul);
       for(const j of Object.keys(lama)) for(const id of rujukan) if((lama[j]||{})[id] && !S[j][id]) S[j][id]=lama[j][id];
       if(!(await Store.saveCatalog())) gagal++;
       if(!(await Store.saveSettings())) gagal++;
       // 3) tulis transaksi yang baru atau berubah saja
       for(const id of rc.baru.concat(rc.ubah)){ if(!(await Store.putTxn(isi[id]))) gagal++; kemajuan(); }
       } finally { tundaSync=false; flushSync(); }
       recompute(); render();
       if(gagal) toast(gagal+" langkah belum tersimpan — tekan “Coba simpan ulang” di atas.");
       else toast("Data sudah sama dengan berkas: +"+rc.baru.length+" · ~"+rc.ubah.length+" · −"+dihapus.length+" transaksi.");
     }},"Samakan sekarang")]);
}
