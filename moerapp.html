<title>Moerapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --ground:#EDF0EA; --surface:#FBFCF9; --raised:#FFFFFF; --sunk:#E4E8DF;
  --ink:#151A16; --ink-2:#5A655C; --ink-3:#8B958C;
  --line:#DCE1D8; --line-2:#C6CEC1;
  --accent:#A8461D; --accent-ink:#FFFFFF; --accent-soft:#F5E6DE; --accent-line:#E3C4B4;
  --pos:#2B6A4A; --pos-soft:#DFEDE4;
  --neg:#A3282A; --neg-soft:#F6E1E1;
  --warn:#88580A; --warn-soft:#F4EAD3;
  --shadow:0 1px 2px rgba(21,26,22,.06), 0 8px 24px -12px rgba(21,26,22,.18);
  --r:10px;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"IBM Plex Serif",ui-serif,Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111410; --surface:#181C16; --raised:#1F241C; --sunk:#0C0F0B;
    --ink:#E9EDE6; --ink-2:#9CA69B; --ink-3:#6C766B;
    --line:#2B3128; --line-2:#3B4237;
    --accent:#EE8A5C; --accent-ink:#1A1006; --accent-soft:#372114; --accent-line:#54321F;
    --pos:#77C296; --pos-soft:#17301F;
    --neg:#EE8181; --neg-soft:#361B1C;
    --warn:#DBA84A; --warn-soft:#332811;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#111410; --surface:#181C16; --raised:#1F241C; --sunk:#0C0F0B;
  --ink:#E9EDE6; --ink-2:#9CA69B; --ink-3:#6C766B;
  --line:#2B3128; --line-2:#3B4237;
  --accent:#EE8A5C; --accent-ink:#1A1006; --accent-soft:#372114; --accent-line:#54321F;
  --pos:#77C296; --pos-soft:#17301F;
  --neg:#EE8181; --neg-soft:#361B1C;
  --warn:#DBA84A; --warn-soft:#332811;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
/* Biasanya disediakan kerangka halaman Artifact; ditulis di sini juga supaya
   versi web (index.html) tampil sama persis. */
[hidden]:not([hidden=until-found i]){display:none!important}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"zero" 1}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:1fr;min-height:100vh;max-width:100%;overflow-x:hidden}
#app>*{min-width:0}
html,body{max-width:100%;overflow-x:hidden}
main{min-width:0}
.side{display:none}
.side-head{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;font-family:var(--mono);font-weight:600;font-size:15px}
.side-head b{font-size:14.5px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.2}
.side-head small{color:var(--ink-3);font-size:11px;font-family:var(--mono)}
.nav{display:flex;flex-direction:column;gap:1px;padding:6px 10px}
.nav-sec{padding:14px 8px 5px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .12s,color .12s}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a svg{width:16px;height:16px;flex:none;opacity:.85}

.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 12px}
.topbar .mark{width:26px;height:26px;font-size:13px}
.topbar b{font-size:14px;letter-spacing:-.02em}
.tabstrip{display:flex;gap:4px;overflow-x:auto;min-width:0;max-width:100%;-webkit-overflow-scrolling:touch;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));background:var(--surface);border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:45px;z-index:29;scrollbar-width:none}
.tabstrip::-webkit-scrollbar{display:none}
.tabstrip a{flex:none;padding:9px 11px;font-size:13px;font-weight:500;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tabstrip a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:16px 14px 96px;max-width:1180px;width:100%;margin:0 auto}
@media(min-width:900px){
  #app{grid-template-columns:216px 1fr}
  .side{display:block;border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;overflow-y:auto}
  .topbar,.tabstrip{display:none}
  main{padding:26px 30px 80px}
}

/* ---------- primitives ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head h1{font-size:22px;letter-spacing:-.03em}
.page-head p{color:var(--ink-2);font-size:13px;margin-top:3px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:13.5px}
.card-b{padding:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.gho{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.gho:hover{background:var(--sunk);color:var(--ink)}
.btn.dgr{color:var(--neg);border-color:var(--line-2)}
.btn.dgr:hover{background:var(--neg-soft);border-color:var(--neg)}
.btn:disabled{opacity:.45;cursor:not-allowed}

label.f{display:block}
label.f>span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:5px}
.inp{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--raised);font-size:14px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
input.num,td .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.45}

table{width:100%;border-collapse:collapse;font-size:13px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right}
tr.tot td{font-weight:600;border-top:1px solid var(--line-2);border-bottom:0;background:var(--sunk)}
tbody tr.hov:hover{background:var(--sunk)}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:600;font-family:var(--mono);letter-spacing:.02em;white-space:nowrap}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.p{background:var(--pos-soft);color:var(--pos)}
.pill.n{background:var(--neg-soft);color:var(--neg)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.m{background:var(--sunk);color:var(--ink-2)}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1.15;overflow-wrap:anywhere}
.kpi .s{font-size:11.5px;color:var(--ink-3)}
.kpi.hi{border-color:var(--accent-line);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 78%)}

tbody tr.klik{cursor:pointer}
tbody tr.awas td{background:var(--neg-soft)}
tbody tr.awas:hover td{background:var(--neg-soft);filter:brightness(.98)}
tbody tr.tipis td{background:var(--warn-soft)}
tbody tr.tipis:hover td{background:var(--warn-soft);filter:brightness(.98)}
.cari{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:9px;
  background:var(--raised);padding:0 10px;min-width:0;flex:1 1 210px;max-width:320px}
@media(max-width:699px){.cari{max-width:none;flex-basis:100%}}
.cari:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cari svg{width:14px;height:14px;flex:none;color:var(--ink-3)}
.cari input{border:0;background:transparent;outline:none;padding:8px 0;font-size:14px;width:100%;min-width:0}
.cari button{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;padding:2px 0}
.cari button:hover{color:var(--ink)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.hitung{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.empty{text-align:center;padding:34px 18px;color:var(--ink-3)}
.empty h4{font-size:14px;color:var(--ink-2);margin-bottom:5px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,10,.5);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:700px){.scrim{align-items:center;padding:24px}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:660px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .18s ease-out}
@media(min-width:700px){.modal{border-radius:14px;max-height:88vh}}
@keyframes up{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.modal-h h3{font-size:15px}
.modal-b{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:13px}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex:none;background:var(--surface);border-radius:0 0 14px 14px}
.x{width:28px;height:28px;border-radius:7px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:19px;line-height:1;display:grid;place-items:center}
.x:hover{background:var(--sunk);color:var(--ink)}

.fab{position:fixed;right:16px;bottom:20px;z-index:40;width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:var(--shadow);font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center}
@media(min-width:900px){.fab{display:none}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;background:var(--ink);color:var(--ground);padding:10px 15px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:var(--shadow);max-width:88vw}

/* ---------- misc ---------- */
.calc{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.calc .l{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.calc .l span:first-child{color:var(--ink-2)}
.calc .l span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.calc .l.b{border-top:1px dashed var(--line-2);padding-top:6px;margin-top:1px;font-weight:600}
.line-item{display:grid;grid-template-columns:1fr 62px 96px 28px;gap:6px;align-items:center}
.line-item .inp{padding:6px 8px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--raised)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.bar-row{display:grid;grid-template-columns:76px 1fr auto;gap:9px;align-items:center;font-size:12.5px}
.bar{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stmt{font-family:var(--serif)}
.stmt h2{font-family:var(--serif);font-size:18px;font-weight:600}
.stmt .sub{font-family:var(--sans);font-size:11.5px;color:var(--ink-3)}
.sr{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:13.5px}
.sr.h{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:5px;margin-top:14px;font-weight:500}
.sr.t{border-top:1px solid var(--line-2);margin-top:5px;padding-top:7px;font-weight:600}
.sr.gt{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin-top:8px;padding:8px 0;font-weight:700;font-size:15px}
.sr span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sr .ind{padding-left:14px}
.warnbox{background:var(--warn-soft);border:1px solid var(--warn);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--ink)}
.warnbox b{color:var(--warn)}
#modeBanner{padding:9px 14px;font-size:12.5px;font-weight:600;text-align:center;border-bottom:1px solid var(--line)}
#modeBanner.local{background:var(--warn-soft);color:var(--warn)}
#modeBanner.off{background:var(--neg-soft);color:var(--neg)}
#modeLbl.local,#modeLbl2.local{color:var(--warn);font-weight:700}
#modeLbl.cloud,#modeLbl2.cloud{color:var(--pos)}
/* Safari iOS memperbesar halaman sendiri kalau kolom isian berhuruf di bawah
   16px. Akibatnya tampilan melebar dan tombol terpotong. Di layar kecil semua
   kolom dinaikkan ke 16px supaya iOS tidak ikut campur. */
/* baris racikan resep botolan */
.rcp{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--raised);display:flex;flex-direction:column;gap:8px}
.rcp-top{display:flex;gap:6px;align-items:center}
.rcp-top>.grow{flex:1;min-width:0}
.rcp-in{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px;color:var(--ink-2)}
.rcp-in label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.rcp-in .inp{width:76px;padding:5px 7px;font-size:13px;text-align:right}
.rcp-in input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);margin:0}
.rcp-cost{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink);white-space:nowrap}
.rcp-note{font-size:11px;color:var(--ink-3)}
.rcp-sec{display:flex;flex-direction:column;gap:7px}
.rcp-sec>.eyebrow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.vol{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.vol i{display:block;height:100%;background:var(--accent);border-radius:99px}
.vol.over i{background:var(--neg)}
@media (max-width:767px){
  .inp,input,select,textarea{font-size:16px}
  .line-item .inp{padding:9px 8px}
  .rcp-in .inp{font-size:16px;width:70px}
}
#app{padding-bottom:env(safe-area-inset-bottom)}
.topbar{padding-top:max(0px,env(safe-area-inset-top));min-width:0}
.topbar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lockScreen{position:fixed;inset:0;z-index:200;background:var(--ground);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:24px max(24px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom))}
#lockScreen .mark{width:52px;height:52px;border-radius:14px;font-size:22px}
#lockScreen h2{margin:0;font-size:17px;letter-spacing:-.01em}
#lockScreen .sub{font-size:12.5px;color:var(--ink-3);margin:0;text-align:center;max-width:30ch}
.pinDots{display:flex;gap:12px;margin:4px 0 2px}
.pinDots i{width:12px;height:12px;border-radius:99px;border:1.6px solid var(--line-2);display:block;transition:transform .12s}
.pinDots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.12)}
.pinPad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pinPad button{height:60px;border-radius:16px;border:1px solid var(--line);background:var(--surface);
  font-size:21px;font-weight:500;font-family:var(--mono);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pinPad button:active{background:var(--sunk);transform:scale(.96)}
.pinPad button.act{background:transparent;border-color:transparent;font-size:13px;font-family:var(--sans);color:var(--ink-2)}
.pinErr{color:var(--neg);font-size:12.5px;min-height:16px;font-weight:500}
.shake{animation:shk .32s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media print{.side,.topbar,.tabstrip,.fab,.noprint,#modeBanner{display:none!important}main{padding:0}body{background:#fff}}
</style>

<div id="app">
  <aside class="side">
    <div class="side-head">
      <div class="mark">R</div>
      <div><b id="bizName1">Kitab Roastery</b><small id="modeLbl">memuat…</small></div>
    </div>
    <nav class="nav" id="navDesk"></nav>
  </aside>
  <div>
    <div class="topbar">
      <div class="mark">R</div>
      <b id="bizName2">Kitab Roastery</b>
      <span style="flex:1"></span>
      <span class="eyebrow" id="modeLbl2"></span>
    </div>
    <div id="modeBanner" hidden></div>
    <div class="tabstrip" id="navMob"></div>
    <main id="view"></main>
  </div>
</div>
<button class="fab" id="fab" aria-label="Transaksi baru">+</button>
<div id="modalHost"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<div id="toastHost"></div>

<script>
"use strict";
/* Satu sumber untuk dua tempat jalan:
   · Artifact Claude — database lewat claude.use("db").
   · Versi web (GitHub Pages + Firebase) — index.html dibangun dari berkas ini
     oleh tools/build-web.js, yang menyalakan window.__KITAB_WEB dan memuat
     js/kitab-firebase.js. Modul itu menyerahkan database lewat __kitabSiap(). */
const WEB = !!window.__KITAB_WEB;
/* =========================================================================
   KITAB ROASTERY — sistem akuntansi untuk usaha roasting kopi
   Alur: transaksi bisnis  ->  jurnal otomatis  ->  laporan keuangan
   ========================================================================= */

/* Setiap handler tombol dibungkus penangkap error. Sebelumnya, kalau ada
   satu baris yang gagal di tengah proses simpan, tombol tampak "mati":
   modal tidak menutup, tidak ada pesan apa pun. Sekarang penyebabnya

let crashSeen = null;
function reportCrash(e, dari){
  const detail = (e && (e.stack || e.message)) ? (e.message||String(e)) : String(e);
  const stack  = (e && e.stack) ? String(e.stack).split("\n").slice(0,4).join("\n") : "";
  crashSeen = {when:new Date().toLocaleString("id-ID"), dari:dari||"tombol", detail, stack};
  console.error("Kesalahan aplikasi", dari, e);
  try{ logDb("kesalahan aplikasi"+(dari?" — "+dari:""), false, detail); }catch(err){}
  try{
    openModal("Ada yang gagal dijalankan",
      [el("p",{style:"color:var(--ink-2)"},"Perintah tadi berhenti di tengah jalan, jadi datanya belum tersimpan. Isian di layar tidak hilang — tutup pesan ini, lalu coba simpan lagi."),
       el("div",{class:"warnbox"},el("b",null,"Pesan teknis: "),detail),
       stack?el("pre",{style:"font-size:11px;white-space:pre-wrap;color:var(--ink-3);margin:0;font-family:var(--mono)"},stack):null],
      [el("button",{class:"btn",onclick:async()=>{ try{ await navigator.clipboard.writeText(detail+"\n"+stack); toast("Pesan disalin."); }catch(x){ toast("Tidak bisa menyalin."); } }},"Salin pesan"),
       el("button",{class:"btn pri",onclick:closeModal},"Tutup")]);
  }catch(err){ try{ toast("Gagal: "+detail); }catch(x){} }
}
function guard(fn, dari){
  return function(ev){
    try{
      const r = fn.call(this, ev);
      if(r && typeof r.catch==="function") r.catch(e=>reportCrash(e, dari));
      return r;
    }catch(e){ reportCrash(e, dari); }
  };
}

    else if(p.startsWith("on"))e.addEventListener(p.slice(2),guard(a[p], t==="button"?(typeof k[0]==="string"?k[0]:"tombol"):t));
    else if(a[p]!=null)e.setAttribute(p,a[p]); }
  for(const c of k.flat()){ if(c==null||c===false)continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;};

function kodeBean(gbId){

/* Alokasi batch untuk satu bean pada satu baris penjualan.
   Bentuk baku: [{id, gram}, ...] — satu baris boleh ditarik dari beberapa
   batch sekaligus, karena satu batch roasting sering tidak cukup.
   Dua bentuk lama tetap dibaca: nilai berupa teks (satu batch saja) dan
   kunci lama "bean::level". */
const NOBATCH="NOBATCH::";
function lineAllocs(line, greenbeanId, butuh){
  const b=(line&&line.batches)||{};
  let v=b[greenbeanId];
  if(v===undefined){
    for(const k of Object.keys(b)){
      if(k.indexOf(greenbeanId+"::")===0){ v=b[k]; break; }
    }
  }
  if(typeof v==="string") return v ? [{id:v, gram:butuh}] : [];
  if(Array.isArray(v)) return v.filter(a=>a&&a.id).map(a=>({id:a.id, gram:+a.gram||0}));
  return [];
}
function lineBatchId(line, greenbeanId){
  const a=lineAllocs(line,greenbeanId,0);
  return a.length ? a[0].id : "";
}
/* Pembagian gram satu bean pada satu baris ke tiap kantong stok.
   Alokasi dipakai berurutan dan dipotong pada kebutuhan, sisanya jatuh ke
   level resep — jadi berat yang dibebankan selalu persis sebesar resep,
   berapa pun yang diisi di form. */
function lineKonsumsi(line, bn, qty){
  const butuh=(+qty||0)*bn.gram;
  const out=[]; let sisa=butuh;
  for(const a of lineAllocs(line,bn.greenbeanId,butuh)){
    if(sisa<=1e-6) break;
    /* Stok hasil opname tidak berasal dari batch roasting mana pun, tapi
       barangnya ada di gudang dan boleh dijual. Ditandai NOBATCH::<level>. */
    if(String(a.id).indexOf(NOBATCH)===0){
      const lv=normLevel(String(a.id).slice(NOBATCH.length));
      const g0=Math.min(Math.max(0,+a.gram||0), sisa); if(g0<=0) continue;
      out.push({id:a.id, level:lv, gram:g0, kode:"", roastDate:""});
      sisa-=g0; continue;
    }
    const rt=S.txns[a.id]; if(!rt||rt.type!=="roast") continue;
    const g=Math.min(Math.max(0,+a.gram||0), sisa); if(g<=0) continue;
    out.push({id:a.id, level:normLevel(rt.profile), gram:g, kode:batchCode(rt), roastDate:rt.date});
    sisa-=g;
  }
  if(sisa>1e-6) out.push({id:"", level:normLevel(bn.roastLevel), gram:sisa, kode:"", roastDate:""});
  return out;
}
/* Sisa gram sebuah batch = hasil roasting dikurangi yang sudah keluar
   lewat penjualan dan QC yang menunjuk batch itu. kecualiTxnId dipakai saat
   mengedit sebuah transaksi, supaya pemakaiannya sendiri tidak ikut dipotong. */
function batchSisa(roastId, kecualiTxnId){
  const t=S.txns[roastId]; if(!t||t.type!=="roast") return 0;
  let keluar=0;
  for(const x of Object.values(S.txns)){
    if(kecualiTxnId && x.id===kecualiTxnId) continue;
    if(x.type==="sale"){
      for(const l of (x.lines||[])){
        const sku=S.skus[l.skuId]; if(!sku) continue;
        for(const bn of lineBeans(l,sku))
          for(const k of lineKonsumsi(l,bn,+l.qty||0))
            if(k.id===roastId) keluar += k.gram;
      }
    } else if(x.type==="qc" && x.batchId===roastId){ keluar += +x.gram||0; }
    else if(x.type==="produce"){
      for(const b of (x.beans||[])) if(b && b.src===roastId) keluar += +b.gram||0;
    }
  }
  return (+t.outputG||0) - keluar;
}
function batchCode(t){
  if(!t || t.type!=="roast") return "";
  const d=String(t.date).split("-");
  const tgl=d[2]+d[1]+d[0].slice(2);
  const sehari=Object.values(S.txns)
    .filter(x=>x.type==="roast"&&x.date===t.date&&x.greenbeanId===t.greenbeanId)
    .sort((a,b)=>(a.seq||0)-(b.seq||0));
  const n=Math.max(1, sehari.findIndex(x=>x.id===t.id)+1);
  return "MRP-"+kodeBean(t.greenbeanId)+tgl+"-"+n;
}

  const isi=+s.packSize||0, h=+s.refPrice||0;

/* Angka gaya Indonesia: titik = pemisah ribuan, koma = desimal.
   <input type="number"> menolak "12.000.000" dan mengembalikan string kosong,
   jadi seluruh isian angka memakai type="text" dengan parser ini. */
function parseID(v){
  if(typeof v==="number") return isFinite(v)?v:0;
  const raw=String(v==null?"":v).trim();
  if(!raw) return 0;
  const neg=raw.startsWith("-");
  let t=raw.replace(/[^0-9.,]/g,"");
  if(!t) return 0;
  const dot=t.includes("."), com=t.includes(",");
  if(dot&&com){
    t = t.lastIndexOf(",")>t.lastIndexOf(".")
      ? t.replace(/\./g,"").replace(/,/g,".")
      : t.replace(/,/g,"");
  } else if(com){
    const parts=t.split(",");
    t = parts.length>2 ? parts.join("") : parts[0]+"."+parts[1];
  } else if(dot){
    const parts=t.split(".");
    const last=parts[parts.length-1];
    t = (parts.length>2 || (last.length===3 && parts[0].length>0)) ? parts.join("") : parts[0]+"."+last;
  }
  const n=parseFloat(t);
  return isFinite(n) ? (neg?-n:n) : 0;
}
function fmtID(n,dec){
  if(n==null||!isFinite(n)) return "";
  const s=Math.abs(n).toFixed(dec||0), i=s.split(".")[0], d=s.split(".")[1];
  return (n<0?"-":"")+i.replace(/\B(?=(\d{3})+(?!\d))/g,".")+(d?","+d:"");
}
function fmtNum(n){
  if(n==null||n==="") return "";
  n=+n; if(!isFinite(n)) return "";
  return Number.isInteger(n) ? fmtID(n,0) : fmtID(n,2).replace(/,?0+$/,"");
}

const fmtDate = d => { if(!d) return "-"; const [y,m,dd]=d.split("-");
  return dd+" "+["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"][+m-1]+" "+y; };
const fmtMonth = m => { const [y,mm]=m.split("-");
  return ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][+mm-1]+" "+y; };
const monthEnd = m => { const [y,mm]=m.split("-").map(Number); return new Date(y,mm,0).toLocaleDateString("sv-SE"); };
const addMonth = (m,k)=>{ const [y,mm]=m.split("-").map(Number); const d=new Date(y,mm-1+k,1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const monthsBetween = (a,b)=>{ const out=[]; let c=a; let guard=0; while(c<=b && guard++<400){ out.push(c); c=addMonth(c,1);} return out; };
const gramTxt = g => Math.abs(g)>=1000 ? num2(g/1000)+" kg" : num2(g)+" g";
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

/* Saluran bertanda "cair" (Tokopedia, TikTok Shop): uang penjualan SELALU mendarat

   ke Kas. Belum Lunas = masih di saldo (bukan piutang). Mengembalikan kode akun

function saldoAccOf(channelName){

/* Harga jual yang disarankan untuk sebuah saluran: harga dasar produk + markup saluran. */
function priceFor(sku, channelName){
  if(!sku) return 0;
  const ch=chanOf(channelName), base=+sku.price||0;
  // Saluran online memakai harga online produk kalau sudah diisi; kalau belum, jatuh ke markup saluran.
  if(ch.online && (+sku.priceOnline||0)>0) return +sku.priceOnline;

/* ---------------------- DIPASANG DI LAYAR UTAMA HP -----------------------
   Artifact hanya menyajikan satu berkas HTML, jadi ikon dan manifest dibuat
   saat halaman jalan lalu disisipkan ke <head>. Cukup untuk membuat aplikasi
   ini bisa ditambahkan ke layar utama Android maupun iOS, tampil penuh layar
   tanpa bilah alamat. */
function ikonAplikasi(px){
  const c=document.createElement("canvas"); c.width=c.height=px;
  const x=c.getContext("2d"), r=px*0.22;
  x.fillStyle="#A8461D";
  x.beginPath();
  x.moveTo(r,0); x.lineTo(px-r,0); x.quadraticCurveTo(px,0,px,r);
  x.lineTo(px,px-r); x.quadraticCurveTo(px,px,px-r,px);
  x.lineTo(r,px); x.quadraticCurveTo(0,px,0,px-r);
  x.lineTo(0,r); x.quadraticCurveTo(0,0,r,0); x.closePath(); x.fill();
  x.fillStyle="#FFFFFF"; x.textAlign="center"; x.textBaseline="middle";
  x.font="600 "+Math.round(px*0.52)+"px ui-sans-serif,-apple-system,'Segoe UI',sans-serif";
  x.fillText("R", px/2, px*0.54);
  return c.toDataURL("image/png");
}

  let i180="", i512="";

            const f=document.createElement("link"); f.rel="icon"; f.type="image/png"; f.href=i180; H.append(f); }

/* ------------------------------ KUNCI LAYAR ------------------------------
   PIN disimpan sebagai hash SHA-256 bergaram di perangkat ini saja. Ini kunci
   layar terhadap orang yang memegang HP-mu — BUKAN enkripsi data. Pengamanan
   data yang sebenarnya tetap dari akses artifact-nya sendiri, yang hanya bisa
   dibuka lewat akun Claude yang kamu izinkan. */
const PINKEY="kitab_roastery_pin";
let pinCfg=null, lockTimer=null, lockedNow=false;
try{ pinCfg=JSON.parse(localStorage.getItem(PINKEY)||"null"); }catch(e){ pinCfg=null; }
const acakGaram = ()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function hashPin(pin, garam){
  const buf=new TextEncoder().encode(garam+"|"+pin+"|kitab");
  const h=await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function simpanPinCfg(c){ pinCfg=c; try{ c? localStorage.setItem(PINKEY,JSON.stringify(c)) : localStorage.removeItem(PINKEY); }catch(e){} }
const autoLockMs = ()=> Math.max(0,(pinCfg&&+pinCfg.autoLockMin||0))*60000;

function tundaKunci(){
  clearTimeout(lockTimer);
  if(pinCfg && autoLockMs()>0 && !lockedNow) lockTimer=setTimeout(()=>kunciLayar(), autoLockMs());
}
function kunciLayar(){
  if(!pinCfg || lockedNow) return;
  lockedNow=true; clearTimeout(lockTimer);
  let isi="", salah=0;
  const dots=el("div",{class:"pinDots"});
  const pesan=el("div",{class:"pinErr"});
  const gambarDots=()=>{ dots.innerHTML="";
    for(let i=0;i<(pinCfg.len||6);i++) dots.append(el("i",{class:i<isi.length?"on":""})); };
  async function coba(){
    const h=await hashPin(isi, pinCfg.salt);
    if(h===pinCfg.hash){
      lockedNow=false; box.remove(); tundaKunci();
    } else {
      salah++; isi=""; gambarDots();
      pesan.textContent = salah>=3 ? "PIN salah. Lupa PIN? Lihat catatan di bawah." : "PIN salah, coba lagi.";
      box.classList.add("shake"); setTimeout(()=>box.classList.remove("shake"),340);
      if(salah>=3) bantuan.hidden=false;
    }
  }
  const tekan=(d)=>{ if(isi.length>=(pinCfg.len||6)) return; isi+=d; gambarDots(); pesan.textContent="";
    if(isi.length===(pinCfg.len||6)) setTimeout(coba,120); };
  const pad=el("div",{class:"pinPad"});
  ["1","2","3","4","5","6","7","8","9"].forEach(d=>pad.append(el("button",{type:"button",onclick:()=>tekan(d)},d)));
  pad.append(el("button",{class:"act",type:"button",onclick:()=>{ isi=""; gambarDots(); pesan.textContent=""; }},"Hapus"));
  pad.append(el("button",{type:"button",onclick:()=>tekan("0")},"0"));
  pad.append(el("button",{class:"act",type:"button",onclick:()=>{ isi=isi.slice(0,-1); gambarDots(); }},"←"));
  const bantuan=el("p",{class:"sub",hidden:true},
    "PIN tersimpan di perangkat ini saja, jadi tidak bisa dipulihkan. Kalau lupa: buka lewat perangkat lain, atau hapus data situs ini di pengaturan browser — datamu tetap aman di server dan akan muncul lagi.");
  const box=el("div",{id:"lockScreen"},
    el("div",{class:"mark"},"R"),
    el("h2",null,(S.settings&&S.settings.bizName)||"Kitab Roastery"),
    el("p",{class:"sub"},"Masukkan PIN untuk membuka"),
    dots, pesan, pad, bantuan);
  document.body.append(box); gambarDots();
}

/* Sinkronisasi dari perangkat lain ditunda selama form terbuka,
   supaya isian yang sedang diketik tidak hilang. */
let pendingSync = null;
/* tundaSync: dipasang selama proses massal (impor) supaya snapshot server yang
   datang di tengah jalan — isinya setengah lama, setengah baru — tidak ditempel
   ke layar. Snapshot terakhir diterapkan setelah semua tulisan selesai. */
let tundaSync=false;
function applySync(fn){ if(modalOpen||tundaSync) pendingSync=fn; else fn(); }
/* Dibungkus try/catch: kalau penerapan sinkronisasi gagal, jangan sampai
   melempar keluar dan membatalkan proses simpan yang sedang berjalan. */
function flushSync(){ const f=pendingSync; pendingSync=null;
  if(f){ try{ f(); }catch(e){ console.error("sync gagal diterapkan",e); } } }

/* Jejak tulisan lokal terakhir. Snapshot dari server kadang datang dalam
   keadaan belum final (fromCache) atau menyusul terlambat, dan isinya bisa
   lebih tua daripada yang barusan kita simpan. Tanpa penjagaan ini, snapshot
   basi itu menghapus lagi item yang baru saja ditambahkan dari layar. */
const RECENT_MS = 30000;
const recentWrites = new Map();          // key -> {ts, apply}
function markWrite(key, apply){ recentWrites.set(key, {ts:Date.now(), apply}); }
function replayRecent(){
  const now=Date.now();
  for(const [k,v] of recentWrites){
    /* Yang belum terkirim dipasang ulang tanpa batas waktu sampai benar-benar
       tersimpan. Kalau ikut kedaluwarsa, snapshot berikutnya dari server akan
       menghapusnya dari layar padahal pekerjaannya belum masuk ke mana pun. */
    if(!unsaved.has(k) && now-v.ts>RECENT_MS){ recentWrites.delete(k); continue; }
    try{ v.apply(); }catch(e){ recentWrites.delete(k); }
  }
}
/* Snapshot dari server dikirim dalam keadaan BEKU — tidak bisa ditambah isi.
   Kalau dipasang apa adanya ke S, penyimpanan berikutnya gagal dengan
   "object is not extensible". Jadi setiap data dari server disalin dulu. */
function thaw(v){
  if(v==null) return v;
  try{ return JSON.parse(JSON.stringify(v)); }catch(e){ return v; }
}
/* Jaring pengaman: pastikan wadahnya bisa ditulisi sebelum diisi. */
function ensureWritable(kind){
  if(!S[kind] || !Object.isExtensible(S[kind])) S[kind]=thaw(S[kind])||{};
  return S[kind];
}
function describeErr(e){
  if(!e) return "penyebab tidak diketahui";
  const code=e.code||e.name||""; const msg=e.message||String(e);
  return code ? code+" — "+msg : msg;
}

  /* Menulis lalu MEMBACA ULANG untuk memastikan datanya benar-benar mendarat.
     Kalau cara pertama tidak nyangkut, dicoba cara kedua (tulis seluruh katalog).
     Kalau dua-duanya gagal, item ditandai "belum tersimpan" dan dilaporkan. */
  async saveCatalogItem(kind, id, data){
    ensureWritable(kind)[id]=data;
    markWrite(kind+":"+id, ()=>{ ensureWritable(kind)[id]=data; });
    if(!this.db){ this._local(); return true; }
    const ref=this.db.doc("master/catalog");
    const cara=[
      ["gabung satu item", ()=>ref.update({[kind]:{[id]:data}})],
      ["tulis ulang seluruh katalog", ()=>ref.set(this._catalogNow())]
    ];
    let last=null;
    for(const [nama,jalankan] of cara){
      try{
        await jalankan();
        const cek=await ref.get();
        if(((cek.data()||{})[kind]||{})[id]){
          logDb("simpan "+kind+" ("+nama+")", true, data.name||id);
          unsaved.delete(kind+":"+id);
          return true;
        }
        last=new Error("Ditulis lewat “"+nama+"” tanpa error, tapi hilang saat dibaca ulang.");
        logDb("simpan "+kind+" ("+nama+")", false, "tidak nyangkut");
      }catch(e){ last=e; logDb("simpan "+kind+" ("+nama+")", false, describeErr(e)); }
    }
    unsaved.set(kind+":"+id, (data.name||id));
    this._local();                 // jaring pengaman: jangan sampai hilang saat halaman dimuat ulang
    writeFail(last, "data master");
    return false;
  },
  /* update() tidak bisa menghapus satu key dari objek bersarang, dan set() selalu
     mengganti SELURUH dokumen — jadi baca ulang seluruh master/catalog dari server
     dulu, hapus satu id dari kategorinya, baru tulis ulang semuanya. Membaca ulang
     tepat sebelum menulis membuat penghapusan tidak ikut membuang item lain yang
     baru saja ditambahkan orang lain sepersekian detik sebelumnya. */
  async deleteCatalogItem(kind, id){
    delete ensureWritable(kind)[id];
    markWrite(kind+":"+id, ()=>{ delete ensureWritable(kind)[id]; });
    if(!this.db){ this._local(); return true; }
    const ref=this.db.doc("master/catalog");
    try{
      const cur=await ref.get(); const full=cur.exists? (cur.data()||{}) : this._catalogNow();
      const bucket={...(full[kind]||{})}; delete bucket[id];
      await ref.set({...this._catalogNow(), ...full, [kind]:bucket});
      return true;
    }catch(e){ writeFail(e, "penghapusan"); return false; }
  },
  async putTxn(t){
    if(!t.by && OPERATOR) t.by=OPERATOR;
    ensureWritable("txns")[t.id]=t;
    markWrite("txn:"+t.id, ()=>{ ensureWritable("txns")[t.id]=t; });
    if(!this.db){ this._local(); return true; }
    const ref=this.db.doc("ledger/"+monthOf(t.date));
    const m=monthOf(t.date);
    const cara=[
      // update() menggabung, jadi transaksi orang lain di bulan yang sama tidak tertimpa.
      ["gabung satu transaksi", ()=>ref.update({txns:{[t.id]:t}})],
      // Dokumen bulan itu belum ada: tulis semua transaksi bulan tersebut.
      ["tulis ulang satu bulan", ()=>{ const b={};
        Object.values(S.txns).forEach(x=>{ if(monthOf(x.date)===m) b[x.id]=x; });
        return ref.set({txns:b}); }]
    ];
    let last=null;
    for(const [nama,jalankan] of cara){
      try{
        await jalankan();
        const cek=await ref.get();
        if(((cek.data()||{}).txns||{})[t.id]){
          logDb("simpan transaksi ("+nama+")", true, t.type+" "+t.date);
          unsaved.delete("txn:"+t.id);
          return true;
        }
        last=new Error("Ditulis lewat “"+nama+"” tanpa error, tapi hilang saat dibaca ulang.");
        logDb("simpan transaksi ("+nama+")", false, "tidak nyangkut");
      }catch(e){ last=e; logDb("simpan transaksi ("+nama+")", false, describeErr(e)); }
    }
    unsaved.set("txn:"+t.id, (TXN_LABEL[t.type]||t.type)+" "+fmtDate(t.date));
    this._local();                 // jaring pengaman: jangan sampai hilang saat halaman dimuat ulang
    writeFail(last, "transaksi");
    return false;
  },
  async delTxn(id){
    const t=S.txns[id]; if(!t) return true; delete ensureWritable("txns")[id];
    markWrite("txn:"+id, ()=>{ delete ensureWritable("txns")[id]; });
    if(!this.db){ this._local(); return true; }
    const m=monthOf(t.date); const ref=this.db.doc("ledger/"+m);
    try{
      // Baca ulang dulu supaya transaksi yang baru saja ditulis orang lain tidak ikut terhapus.
      const cur=await ref.get(); const bucket={...((cur.data()||{}).txns||{})};
      delete bucket[id];
      await ref.set({txns:bucket});
      return true;
    }catch(e){ this._local(); writeFail(e, "penghapusan transaksi"); return false; }
  },
  async wipe(){
    if(this.db){
      const months=[...new Set(Object.values(S.txns).map(t=>monthOf(t.date)))];
      for(const m of months){ try{ await this.db.doc("ledger/"+m).delete(); }catch(e){} }
      try{ await this.db.doc("master/catalog").delete(); }catch(e){}
      try{ await this.db.doc("master/settings").delete(); }catch(e){}
    }
    try{ localStorage.removeItem(LSKEY); }catch(e){}
  },
  async replaceTxn(t){
    const prev=S.txns[t.id];
    if(prev && prev.by) t.by=prev.by; else if(!t.by && OPERATOR) t.by=OPERATOR;
    if(OPERATOR && t.by!==OPERATOR) t.editedBy=OPERATOR;
    // Kalau tanggalnya pindah bulan, catatan lama harus dilepas dari dokumen bulan lama.
    if(prev && monthOf(prev.date)!==monthOf(t.date)) await this.delTxn(t.id);
    return await this.putTxn(t);
  }
};

/* =========================================================================
   MESIN AKUNTANSI
   Semua saldo — kas, stok, HPP, laba — dihitung ulang dari daftar transaksi.
   Tidak ada saldo yang disimpan, jadi koreksi transaksi lama selalu konsisten.
   ========================================================================= */
function buildBooks(){
  rebuildAccounts();
  const st = S.settings;
  const txns = Object.values(S.txns).sort((a,b)=> a.date===b.date ? (a.seq||0)-(b.seq||0) : (a.date<b.date?-1:1));
  const inv = {gb:{}, rb:{}, sup:{}, fg:{}}; // {qty, val, last} — fg = botol jadi per produk
  const journal = [];                         // {date,seq,ref,type,desc,cf,lines:[{acc,dr,cr}]}
  const cards  = {};                          // "gb:id" -> [{date,desc,inQty,inVal,outQty,outVal,qty,val}]
  const sales  = [];                          // detail penjualan untuk rekap
  const roasts = [];
  const openPayable = {}, openReceivable = {};
  const alerts = [];
  const qcLog  = [];   // catatan kopi yang terpakai untuk QC / cupping
  const productions = [];   // batch produksi botolan
  const wasteLog = [];      // botol yang dibuang / dipakai sampel
  /* Lot botol jadi per produk, untuk melacak sisa tiap batch dan tanggal
     kedaluwarsanya. Penjualan mengambil dari lot yang paling cepat kedaluwarsa
     (FEFO). Nilai HPP-nya tetap rata-rata bergerak, sama dengan stok lain. */
  const fgLots = {};        // skuId -> [{id,code,date,exp,qty,sisa}]
  const fgAlloc = {};       // saleId -> [[{id,code,exp,date,qty}] per baris]
  /* Botol yang terjual/terbuang sebelum produksinya dicatat (stok minus).
     Begitu batch berikutnya masuk, kekurangan ini dipotong lebih dulu dari
     lot itu supaya jumlah sisa lot tetap sama dengan saldo stok. */
  const fgKurang = {};      // skuId -> botol
  function ambilLot(skuId, qty, lotId){
    const hasil=ambilLot0(skuId, qty, lotId);
    const dapat=hasil.reduce((n,x)=>n+x.qty,0);
    if(qty-dapat>1e-9) fgKurang[skuId]=(fgKurang[skuId]||0)+(qty-dapat);
    return hasil;
  }
  function ambilLot0(skuId, qty, lotId){
    const lots=(fgLots[skuId]||[]); const out=[]; let sisa=qty;
    if(lotId){ const l=lots.find(x=>x.id===lotId);
      if(l && l.sisa>0){ const q=Math.min(l.sisa,sisa); l.sisa-=q; sisa-=q; out.push({id:l.id,code:l.code,exp:l.exp,date:l.date,qty:q}); } }
    const urut=lots.filter(l=>l.sisa>1e-9).sort((a,b)=>(a.exp||"9999").localeCompare(b.exp||"9999")||a.date.localeCompare(b.date));
    for(const l of urut){ if(sisa<=1e-9) break;
      const q=Math.min(l.sisa,sisa); l.sisa-=q; sisa-=q; out.push({id:l.id,code:l.code,exp:l.exp,date:l.date,qty:q}); }
    return out;
  }
  let seq = 0;

  const bucket = (k,id)=>{ const m=inv[k]; if(!m[id]) m[id]={qty:0,val:0,last:0}; return m[id]; };
  const avgOf  = (k,id)=>{ const b=bucket(k,id); return b.qty>0 ? b.val/b.qty : (b.last||0); };
  /* Barang yang terjual padahal stoknya belum tercatat (stok minus) dibebani
     biaya terakhir yang diketahui. Begitu stok masuk dan menutup kekurangan itu,
     harga sebenarnya sudah ketahuan. Selisihnya (harga yang dibebankan dulu lawan
     harga sebenarnya) dicatat SEKALI, pada hari stok masuk, sebagai Selisih Harga
     Stok Minus. Tanpa ini saldo negatif ikut menyeret rata-rata, dan penjualan
     berikutnya dibebani terlalu murah atau terlalu mahal. */
  const selisihTertunda=[];
  function moveIn(k,id,qty,val,date,desc){
    const b=bucket(k,id); let adj=0;
    if(b.qty<-1e-9 && qty>0){
      const tutup=Math.min(qty,-b.qty);
      const dibebankan=b.val/b.qty;            // biaya per satuan yang dulu dibebankan
      const sebenarnya=val/qty;                // biaya per satuan stok yang masuk
      adj=tutup*(dibebankan-sebenarnya);
      if(Math.abs(adj)<0.5) adj=0;
    }
    b.qty+=qty; b.val+=val+adj; if(b.qty>0) b.last=b.val/b.qty;
    if(adj) selisihTertunda.push({k,id,adj});
    (cards[k+":"+id] ||= []).push({date,desc:desc+(adj?" (+ selisih harga stok minus "+rpS(adj)+")":""),inQty:qty,inVal:val+adj,outQty:0,outVal:0,qty:b.qty,val:b.val});
  }
  function moveOut(k,id,qty,date,desc){
    const b=bucket(k,id); const c=avgOf(k,id); const val=qty*c;
    b.qty-=qty; if(b.qty<=1e-9){ b.last=c; b.val=b.qty*c; } else b.val-=val;
    (cards[k+":"+id] ||= []).push({date,desc,inQty:0,inVal:0,outQty:qty,outVal:val,qty:b.qty,val:b.val});
    return val;
  }
  const post = (t,desc,cf,lines)=>{ journal.push({date:t.date, seq:++seq, ref:t.id, type:t.type, desc, cf, lines:lines.filter(l=>Math.abs(l.dr||0)+Math.abs(l.cr||0)>1e-9)}); };

  for(const t of txns){
    /* ---- PEMBELIAN ---- */
    if(t.type==="purchase"){
      const lines = t.lines||[];
      const base  = lines.reduce((s,l)=> s + (+l.qty||0)*(+l.unitPrice||0), 0);
      const extra = (+t.freight||0) + (+t.otherCost||0);
      const total = base + extra;
      const accInv = t.kind==="greenbean" ? "1-1310" : t.kind==="supply" ? "1-1330" : "1-2100";
      /* Satu nota bisa berisi kemasan dan bahan minuman sekaligus — nilainya
         dipisah ke akun persediaan masing-masing. */
      const perAkun = {};
      if(t.kind!=="asset"){
        const k = t.kind==="greenbean" ? "gb" : "sup";
        lines.forEach(l=>{
          const v = (+l.qty||0)*(+l.unitPrice||0);
          const share = base>0 ? extra*(v/base) : (lines.length? extra/lines.length : 0);
          moveIn(k, l.itemId, +l.qty||0, v+share, t.date, "Pembelian"+(t.party?" · "+t.party:""));
          const a = k==="sup" ? supAcc(l.itemId) : accInv;
          perAkun[a]=(perAkun[a]||0)+v+share;
        });
      } else perAkun[accInv]=total;
      const sisaBulat = total-Object.values(perAkun).reduce((s,v)=>s+v,0);
      if(Math.abs(sisaBulat)>1e-6) perAkun[accInv]=(perAkun[accInv]||0)+sisaBulat;
      const adaBahan = !!perAkun["1-1340"];
      post(t, "Pembelian "+(t.kind==="greenbean"?"green bean":t.kind==="supply"?(adaBahan?(perAkun["1-1330"]?"kemasan & bahan minuman":"bahan minuman"):"kemasan & bahan"):"peralatan")+(t.party?" — "+t.party:""),
        t.kind==="asset"?"inv":"op",
        Object.entries(perAkun).map(([a,v])=>({acc:a,dr:v})).concat([{acc:t.payment==="credit"?"2-1000":payAccOf(t),cr:total}]));
      const bf=bankFeeOf(t);
      if(bf>0) post(t,"Biaya admin bank — pembelian"+(t.party?" "+t.party:""),"op",
        [{acc:"6-1800",dr:bf},{acc:payAccOf(t),cr:bf}]);
      if(t.payment==="credit") openPayable[t.id]={date:t.date,party:t.party||"Supplier",total,paid:0,ref:t.id};
    }

    /* ---- ROASTING ---- */
    else if(t.type==="roast"){
      const inG = +t.inputG||0, outG = +t.outputG||0;
      const gbCost = moveOut("gb", t.greenbeanId, inG, t.date, "Roasting batch");
      const oh = (inG/1000) * (+st.roastOverheadPerKg||0);
      moveIn("rb", rbKey(t.greenbeanId, t.profile), outG, gbCost+oh, t.date, "Hasil roasting "+normLevel(t.profile));
      const gb = S.greenbeans[t.greenbeanId];
      roasts.push({id:t.id,date:t.date,name:gb?gb.name:"(dihapus)",inG,outG,
        yield: inG>0? outG/inG*100 : 0, shrink: inG-outG, gbCost, oh, total:gbCost+oh,
        costPerG: outG>0 ? (gbCost+oh)/outG : 0, note:t.note});
      post(t, "Roasting "+(gb?gb.name:"—")+" · "+gramTxt(inG)+" → "+gramTxt(outG), "op",
        [{acc:"1-1320",dr:gbCost+oh},{acc:"1-1310",cr:gbCost},{acc:"5-9000",cr:oh}]);
      if(bucket("gb",t.greenbeanId).qty < -1e-6) alerts.push({date:t.date,msg:"Stok green bean "+(gb?gb.name:"?")+" minus setelah roasting "+fmtDate(t.date)});
    }

    /* ---- PENJUALAN ---- */
    else if(t.type==="sale"){
      let gross=0, lineDisc=0, cogsRb=0, cogsSup=0, cogsFg=0; const detail=[];
      const kreditSup={};                      // kemasan (1-1330) dan bahan minuman (1-1340) dipisah
      const alokasi=[];                        // lot botol jadi per baris (untuk invoice)
      (t.lines||[]).forEach((l,iBaris)=>{
        const sku = S.skus[l.skuId]; const qty = +l.qty||0;
        const g = qty*(+l.unitPrice||0); const d = +l.disc||0;
        gross += g; lineDisc += d;
        let rbCost=0, supCost=0, fgCost=0;
        if(sku && isRTD(sku)){
          /* Botolan: bahannya sudah dipotong saat produksi, jadi yang keluar
             di sini adalah stok botol jadi dengan HPP hasil produksinya. */
          fgCost = moveOut("fg", l.skuId, qty, t.date, "Penjualan"+(t.customer?" · "+t.customer:""));
          alokasi[iBaris]=ambilLot(l.skuId, qty);
          if(bucket("fg",l.skuId).qty < -1e-6)
            alerts.push({date:t.date,msg:"Stok botol jadi "+sku.name+" minus pada penjualan "+fmtDate(t.date)+" — catat produksinya dulu"});
        } else if(sku){
          for(const bn of lineBeans(l,sku))
            for(const k of lineKonsumsi(l,bn,qty))
              rbCost += moveOut("rb", rbKey(bn.greenbeanId, k.level), k.gram, t.date, "Penjualan "+sku.name);
          for(const c of (sku.components||[])){
            if(!c.supplyId) continue;
            const v = moveOut("sup", c.supplyId, qty*(+c.qty||0), t.date, "Penjualan "+sku.name);
            supCost += v; const a=supAcc(c.supplyId); kreditSup[a]=(kreditSup[a]||0)+v;
          }
        }
        cogsRb+=rbCost; cogsSup+=supCost; cogsFg+=fgCost;
        detail.push({skuId:l.skuId, name:sku?sku.name:"(produk dihapus)", line:isRTD(sku)?"rtd":"bean", qty, price:+l.unitPrice||0,
          gross:g, disc:d, net:g-d, rbCost, supCost, fgCost, cogs:rbCost+supCost+fgCost, profit:0,
          gram: sku&&!isRTD(sku)?qty*skuGramTotal(sku,l):0, botol: isRTD(sku)?qty:0});
      });
      if(alokasi.length) fgAlloc[t.id]=alokasi;
      let packCost=0; const packDetail=[];
      for(const p of (t.packing||[])){
        const q=+p.qty||0; if(!p.supplyId || q<=0) continue;
        const v=moveOut("sup", p.supplyId, q, t.date, "Packing kiriman"+(t.customer?" · "+t.customer:""));
        packCost+=v; const a=supAcc(p.supplyId); kreditSup[a]=(kreditSup[a]||0)+v;
        packDetail.push({supplyId:p.supplyId, name:(S.supplies[p.supplyId]||{}).name||"(dihapus)", qty:q, cost:v});
      }
      cogsSup+=packCost;
      // Diskon transaksi dan biaya packing dibagi rata sesuai nilai tiap baris, supaya rekap per produk tetap jujur.
      const orderDisc = +t.discount||0;
      const netSum = detail.reduce((a,d)=>a+d.net,0);
      detail.forEach(d=>{ const w = netSum>0 ? d.net/netSum : (detail.length?1/detail.length:0);
        d.disc+=orderDisc*w; d.net-=orderDisc*w;
        const ps=packCost*w; d.supCost+=ps; d.cogs+=ps;
        d.profit=d.net-d.cogs; });
      const disc = lineDisc + orderDisc;
      const revenue = gross - disc;                       // omzet bersih setelah diskon
      const shipChg = +t.shippingCharged||0, shipCost = +t.shippingCost||0;
      const fee = +t.adminFee||0;                          // biaya admin marketplace
      const received = revenue + shipChg - fee;            // uang yang benar-benar diterima
      const saldoAcc = saldoAccOf(t.channel);
      const payAcc = saldoAcc || payAccOf(t);
      post(t, "Penjualan"+(t.customer?" — "+t.customer:"")+(t.channel?" ("+t.channel+")":""), "op",
        [{acc:saldoAcc ? saldoAcc : (t.payment==="credit"?"1-1200":payAcc), dr:received},{acc:"6-1700",dr:fee},{acc:"4-9000",dr:disc},
         {acc:"4-1000",cr:gross},{acc:"4-1100",cr:shipChg}]);
      post(t, "HPP penjualan"+(t.customer?" — "+t.customer:""), "op",
        [{acc:"5-1000",dr:cogsRb},{acc:"5-1100",dr:cogsFg},{acc:"5-2000",dr:cogsSup},
         {acc:"1-1320",cr:cogsRb},{acc:"1-1350",cr:cogsFg}]
          .concat(Object.entries(kreditSup).map(([a,v])=>({acc:a,cr:v}))));
      if(shipCost>0) post(t,"Ongkir dibayar ke kurir","op",[{acc:"6-1300",dr:shipCost},{acc:payAcc,cr:shipCost}]);
      /* Ditandai Lunas pada saluran saldo = dananya sudah dicairkan: sisa saldo
         transaksi ini (setelah ongkir) pindah ke Kas pada tanggal pencairan. */
      const sisaSaldo = received - shipCost;
      if(saldoAcc && t.payment!=="credit" && Math.abs(sisaSaldo)>0.5){
        const tgl = (t.cairDate && t.cairDate>=t.date) ? t.cairDate : t.date;
        const tujuan = kasTujuanOf(t);
        post({id:t.id,type:"sale",date:tgl}, "Pencairan saldo "+accName(saldoAcc)+(t.customer?" — "+t.customer:""), "op",
          sisaSaldo>0 ? [{acc:tujuan,dr:sisaSaldo},{acc:saldoAcc,cr:sisaSaldo}]
                      : [{acc:saldoAcc,dr:-sisaSaldo},{acc:tujuan,cr:-sisaSaldo}]);
      }
      sales.push({id:t.id,date:t.date,saldo:!!saldoAcc,customer:t.customer||"Umum",channel:t.channel||"Lainnya",payment:t.payment,
        gross, disc, revenue, fee, shipChg, shipCost, received,
        cogs:cogsRb+cogsSup+cogsFg, cogsRb, cogsSup, cogsFg, packCost, packDetail,
        profit:revenue-cogsRb-cogsSup-cogsFg,                            // laba kotor
        net:revenue-cogsRb-cogsSup-cogsFg-fee-shipCost+shipChg,          // setelah biaya admin & ongkir
        gramTotal: detail.reduce((s,d)=>s+(d.gram||0),0),                // total gram roast bean terjual
        botolTotal: detail.reduce((s,d)=>s+(d.botol||0),0),              // total botol terjual
        detail, note:t.note});
      if(t.payment==="credit" && !saldoAcc) openReceivable[t.id]={date:t.date,party:t.customer||"Pelanggan",total:received,paid:0,ref:t.id};
      for(const l of (t.lines||[])){ const sku=S.skus[l.skuId]; if(!sku) continue;
        for(const bn of lineBeans(l,sku))
          for(const k of lineKonsumsi(l,bn,+l.qty||0))
            if(bucket("rb",rbKey(bn.greenbeanId,k.level)).qty < -1e-6)
              alerts.push({date:t.date,msg:"Stok roast bean "+rbName(rbKey(bn.greenbeanId,k.level))+" minus pada penjualan "+fmtDate(t.date)}); }
      for(const p of (t.packing||[])){
        if(!p.supplyId) continue;
        if(bucket("sup",p.supplyId).qty < -1e-6)
          alerts.push({date:t.date,msg:"Stok "+((S.supplies[p.supplyId]||{}).name||"kemasan")+" minus pada penjualan "+fmtDate(t.date)});
      }
      /* Kemasan dan stiker dari resep produk juga bisa minus tanpa ketahuan.
         Botolan dilewati: bahannya dipotong saat produksi, bukan saat jual. */
      for(const l of (t.lines||[])){ const sku=S.skus[l.skuId]; if(!sku || isRTD(sku)) continue;
        for(const c of (sku.components||[])){
          if(!c.supplyId) continue;
          if(bucket("sup",c.supplyId).qty < -1e-6)
            alerts.push({date:t.date,msg:"Stok "+((S.supplies[c.supplyId]||{}).name||"bahan")+" minus pada penjualan "+fmtDate(t.date)});
        } }
    }

    /* ---- BIAYA OPERASIONAL ---- */
    else if(t.type==="expense"){
      post(t, (t.note||accName(t.accountId)), "op",
        [{acc:t.accountId,dr:+t.amount||0},{acc:t.payment==="credit"?"2-1000":payAccOf(t),cr:+t.amount||0}]);
      const bfE=bankFeeOf(t);
      if(bfE>0) post(t,"Biaya admin bank — "+accName(t.accountId),"op",
        [{acc:"6-1800",dr:bfE},{acc:payAccOf(t),cr:bfE}]);
      if(t.payment==="credit") openPayable[t.id]={date:t.date,party:t.party||"Vendor",total:+t.amount||0,paid:0,ref:t.id};
    }

    /* ---- MODAL & PRIVE ---- */
    else if(t.type==="capital"){
      const a=+t.amount||0;
      if(t.direction==="in") post(t,"Setoran modal"+(t.note?" — "+t.note:""),"fin",[{acc:payAccOf(t),dr:a},{acc:"3-1000",cr:a}]);
      else{ post(t,"Prive / pengambilan pribadi"+(t.note?" — "+t.note:""),"fin",[{acc:"3-2000",dr:a},{acc:payAccOf(t),cr:a}]);
        const bfP=bankFeeOf(t);
        if(bfP>0) post(t,"Biaya admin bank — prive","op",[{acc:"6-1800",dr:bfP},{acc:payAccOf(t),cr:bfP}]); }
    }

    /* ---- PENYESUAIAN SALDO KAS ---- */
    else if(t.type==="cashadj"){
      /* Selisih antara uang yang benar-benar ada dan saldo menurut buku.
         Diperlakukan sama seperti opname stok: lawan akunnya Selisih Opname,
         supaya sebabnya tetap kelihatan di laba rugi dan tidak tercampur
         dengan beban lain-lain yang sungguhan. */
      const a=+t.amount||0, acc=normAcc(t.account||"1-1000");
      if(a>0) post(t,"Penyesuaian kas (lebih)"+(t.note?" — "+t.note:""),"op",
        [{acc:acc,dr:a},{acc:"6-1950",cr:a}]);
      else if(a<0) post(t,"Penyesuaian kas (kurang)"+(t.note?" — "+t.note:""),"op",
        [{acc:"6-1950",dr:-a},{acc:acc,cr:-a}]);
    }

    /* ---- PINJAMAN ---- */
    else if(t.type==="loan"){
      const a=+t.amount||0;
      post(t,"Terima pinjaman"+(t.lender?" — "+t.lender:""),"fin",
        [{acc:payAccOf(t),dr:a},{acc:"2-1100",cr:a}]);
      const bfL=bankFeeOf(t);
      if(bfL>0) post(t,"Biaya admin bank — terima pinjaman","op",[{acc:"6-1800",dr:bfL},{acc:payAccOf(t),cr:bfL}]);
    }
    else if(t.type==="loanpay"){
      /* Angsuran dipecah: pokok mengurangi hutang, bunga jadi beban.
         Kalau digabung, hutangnya kelihatan lunas lebih cepat dari kenyataan. */
      const pokok=+t.principal||0, bunga=+t.interest||0;
      /* Pokok dan bunga dipisah jurnalnya: pelunasan pokok itu arus kas
         pendanaan, sedangkan bunga adalah biaya menjalankan usaha. Kalau
         digabung ke pendanaan, arus kas operasi terlihat lebih sehat
         daripada yang sebenarnya. */
      if(pokok>0) post(t,"Angsuran pokok pinjaman"+(t.lender?" — "+t.lender:""),"fin",
        [{acc:"2-1100",dr:pokok},{acc:payAccOf(t),cr:pokok}]);
      if(bunga>0) post(t,"Bunga pinjaman"+(t.lender?" — "+t.lender:""),"op",
        [{acc:"6-1350",dr:bunga},{acc:payAccOf(t),cr:bunga}]);
      const bfA=bankFeeOf(t);
      if(bfA>0) post(t,"Biaya admin bank — angsuran","op",[{acc:"6-1800",dr:bfA},{acc:payAccOf(t),cr:bfA}]);
    }

    /* ---- PEMBAYARAN HUTANG / PENERIMAAN PIUTANG ---- */
    else if(t.type==="payable"){
      const a=+t.amount||0; post(t,"Bayar hutang"+(t.note?" — "+t.note:""),"op",[{acc:"2-1000",dr:a},{acc:payAccOf(t),cr:a}]);
      const bfH=bankFeeOf(t);
      if(bfH>0) post(t,"Biaya admin bank — bayar hutang","op",[{acc:"6-1800",dr:bfH},{acc:payAccOf(t),cr:bfH}]);
      if(openPayable[t.targetId]) openPayable[t.targetId].paid += a;
    }
    else if(t.type==="receivable"){
      const a=+t.amount||0;
      const tg=S.txns[t.targetId]; const sAcc=(tg && tg.type==="sale") ? saldoAccOf(tg.channel) : "";
      if(sAcc){
        /* Penjualan ini ada di saldo platform, bukan piutang: penerimaannya adalah pencairan. */
        post(t,"Pencairan saldo "+accName(sAcc)+(t.note?" — "+t.note:""),"op",[{acc:payAccOf(t),dr:a},{acc:sAcc,cr:a}]);
      } else {
        post(t,"Terima piutang"+(t.note?" — "+t.note:""),"op",[{acc:payAccOf(t),dr:a},{acc:"1-1200",cr:a}]);
        if(openReceivable[t.targetId]) openReceivable[t.targetId].paid += a;
        else openReceivable["x-"+t.id]={date:t.date,party:(t.note||"Pelanggan")+" — tagihan asalnya sudah dihapus",total:0,paid:a,ref:t.id,yatim:true};
      }
    }
    else if(t.type==="taxpay"){
      const a=+t.amount||0; post(t,"Setor PPh Final"+(t.note?" — "+t.note:""),"op",[{acc:"2-1200",dr:a},{acc:payAccOf(t),cr:a}]);
      const bfT=bankFeeOf(t);
      if(bfT>0) post(t,"Biaya admin bank — setor pajak","op",[{acc:"6-1800",dr:bfT},{acc:payAccOf(t),cr:bfT}]);
    }

    /* ---- QC / CUPPING: roast bean terpakai untuk cicip, tidak dijual ---- */
    else if(t.type==="qc"){
      const bt = t.batchId ? S.txns[t.batchId] : null;
      const key = (bt && bt.type==="roast")
        ? rbKey(bt.greenbeanId, bt.profile)
        : (t.rbKey || rbKey(t.greenbeanId, t.roastLevel));
      const g = +t.gram||0;
      if(g>0){
        const v = moveOut("rb", key, g, t.date, "QC / cupping"+(t.note?" · "+t.note:""));
        post(t,"QC & cupping — "+rbName(key)+" "+num2(g)+" g","op",
          [{acc:"6-1250",dr:v},{acc:"1-1320",cr:v}]);
        qcLog.push({id:t.id,date:t.date,key,name:rbName(key),batch:bt?batchCode(bt):"",gram:g,cost:v,
          purpose:t.purpose||"QC rutin",note:t.note||"",by:t.by});
        if(bucket("rb",key).qty < -1e-6)
          alerts.push({date:t.date,msg:"Stok roast bean "+rbName(key)+" minus setelah QC "+fmtDate(t.date)});
      }
    }

    /* ---- PRODUKSI BOTOLAN: roast bean + bahan minuman + kemasan → botol jadi ---- */
    else if(t.type==="produce"){
      const sku=S.skus[t.skuId]; const nm=sku?sku.name:"(produk dihapus)";
      const q=+t.qty||0; const kode=prodCode(t);
      let rbC=0; const kredit={};
      for(const b of (t.beans||[])){
        const g=+b.gram||0; if(!b||!b.greenbeanId||g<=0) continue;
        const key=prodBeanKey(b);
        rbC+=moveOut("rb", key, g, t.date, "Produksi botolan "+nm+" · "+kode);
        if(bucket("rb",key).qty < -1e-6)
          alerts.push({date:t.date,msg:"Stok roast bean "+rbName(key)+" minus setelah produksi botolan "+fmtDate(t.date)});
      }
      const pakai=[];
      for(const it of (t.items||[])){
        const qq=+it.qty||0; if(!it||!it.supplyId||qq<=0) continue;
        const v=moveOut("sup", it.supplyId, qq, t.date, "Produksi botolan "+nm+" · "+kode);
        const a=supAcc(it.supplyId); kredit[a]=(kredit[a]||0)+v;
        pakai.push({supplyId:it.supplyId, name:(S.supplies[it.supplyId]||{}).name||"(dihapus)", qty:qq, unit:unitSup(it.supplyId), cost:v, acc:a});
        if(bucket("sup",it.supplyId).qty < -1e-6)
          alerts.push({date:t.date,msg:"Stok "+((S.supplies[it.supplyId]||{}).name||"bahan")+" minus setelah produksi botolan "+fmtDate(t.date)});
      }
      const oh=q>0 ? q*(+t.ohPerUnit||0) : 0;
      const bahan=Object.values(kredit).reduce((s,v)=>s+v,0);
      const total=rbC+bahan+oh;
      const kreditLines=[{acc:"1-1320",cr:rbC}].concat(Object.entries(kredit).map(([a,v])=>({acc:a,cr:v})),[{acc:"5-9100",cr:oh}]);
      if(q>0){
        moveIn("fg", t.skuId, q, total, t.date, "Produksi batch "+kode);
        const tutup=Math.min(q, fgKurang[t.skuId]||0);
        if(tutup>0) fgKurang[t.skuId]-=tutup;
        (fgLots[t.skuId] ||= []).push({id:t.id, code:kode, date:t.date, exp:t.expDate||"", qty:q, sisa:q-tutup});
        post(t, "Produksi botolan "+nm+" · "+num2(q)+" btl ("+kode+")", "op", [{acc:"1-1350",dr:total}].concat(kreditLines));
      } else {
        /* Batch gagal total: tidak ada botol yang jadi, seluruh bahannya waste. */
        post(t, "Produksi botolan gagal — "+nm+" ("+kode+")", "op", [{acc:"5-9600",dr:total}].concat(kreditLines));
      }
      productions.push({id:t.id, date:t.date, skuId:t.skuId, name:nm, code:kode, qty:q, exp:t.expDate||"",
        rbCost:rbC, bbCost:kredit["1-1340"]||0, kmCost:kredit["1-1330"]||0, oh, total,
        perBotol:q>0?total/q:0, pakai, note:t.note||"", by:t.by});
    }

    /* ---- WASTE / SAMPEL BOTOLAN ---- */
    else if(t.type==="waste"){
      const sku=S.skus[t.skuId]; const nm=sku?sku.name:"(produk dihapus)";
      const q=+t.qty||0;
      if(q>0){
        const alasan=t.reason||"Kedaluwarsa";
        const v=moveOut("fg", t.skuId, q, t.date, alasan+(t.note?" · "+t.note:""));
        const lot=ambilLot(t.skuId, q, t.lotId||"");
        /* Sampel dan promo gratis itu biaya pemasaran, bukan kegagalan produksi. */
        const acc = alasan==="Sampel / promo" ? "6-1400" : alasan==="Konsumsi internal" ? "6-1900" : "5-9600";
        post(t, (alasan==="Sampel / promo"?"Sampel / promo botolan":"Waste botolan")+" — "+nm+" "+num2(q)+" btl ("+alasan.toLowerCase()+")", "op",
          [{acc, dr:v},{acc:"1-1350",cr:v}]);
        wasteLog.push({id:t.id, date:t.date, skuId:t.skuId, name:nm, qty:q, cost:v, reason:alasan, acc,
          lots:lot.map(x=>x.code), note:t.note||"", by:t.by});
        if(bucket("fg",t.skuId).qty < -1e-6)
          alerts.push({date:t.date,msg:"Stok botol jadi "+nm+" minus setelah catatan waste "+fmtDate(t.date)});
      }
    }

    /* ---- PINDAH DANA antar kantong (tarik saldo marketplace ke bank) ---- */
    else if(t.type==="transfer"){
      const a=+t.amount||0;
      const dari=normAcc(t.fromAcc||"1-1000"), ke=normAcc(t.toAcc||"1-1000");
      post(t,"Pindah dana "+accName(dari)+" → "+accName(ke)+(t.note?" · "+t.note:""),"op",
        [{acc:ke,dr:a},{acc:dari,cr:a}]);
      const bfF=bankFeeOf(t);
      if(bfF>0) post(t,"Biaya admin bank — pindah dana","op",
        [{acc:"6-1800",dr:bfF},{acc:dari,cr:bfF}]);
    }

    /* ---- PENYESUAIAN STOK (opname) ---- */
    else if(t.type==="adjust"){
      const k=t.itemKind, id=t.itemId, target=+t.qty||0;
      const b=bucket(k,id); const diff=target-b.qty; const c=avgOf(k,id);
      const accInv = invAcc(k,id);
      const nm = itemNama(k,id);
      if(diff>0){ moveIn(k,id,diff,diff*c,t.date,"Penyesuaian stok"+(t.note?" · "+t.note:""));
        if(k==="fg" && fgKurang[id]) fgKurang[id]=Math.max(0,fgKurang[id]-diff);
        post(t,"Penyesuaian stok (lebih) — "+nm,"op",[{acc:accInv,dr:diff*c},{acc:"6-1950",cr:diff*c}]); }
      else if(diff<0){ const v=moveOut(k,id,-diff,t.date,"Penyesuaian stok"+(t.note?" · "+t.note:""));
        if(k==="fg") ambilLot(id,-diff);
        post(t,"Penyesuaian stok (susut) — "+nm,"op",[{acc:"6-1950",dr:v},{acc:accInv,cr:v}]); }
    }

    /* Selisih harga stok minus yang muncul dari transaksi ini dibukukan segera setelahnya. */
    while(selisihTertunda.length){
      const x=selisihTertunda.shift();
      const accI = invAcc(x.k,x.id);
      const nmI = itemNama(x.k,x.id);
      post(t,"Selisih harga stok minus — "+nmI,"op",
        x.adj>0 ? [{acc:accI,dr:x.adj},{acc:"5-9500",cr:x.adj}]
                : [{acc:"5-9500",dr:-x.adj},{acc:accI,cr:-x.adj}]);
    }
  }

  /* ---- Jurnal otomatis akhir bulan: penyusutan aset & PPh Final ---- */
  const dates = txns.map(t=>t.date).filter(Boolean).concat(Object.values(S.assets).map(a=>a.date).filter(Boolean));
  const firstM = dates.length ? monthOf(dates.reduce((a,b)=>a<b?a:b)) : monthOf(todayISO());
  const lastM  = [monthOf(todayISO()), dates.length ? monthOf(dates.reduce((a,b)=>a>b?a:b)) : "0000-00"].sort().pop();
  const months = monthsBetween(firstM, lastM);
  const depSchedule = {};

  if(st.depEnabled){
    for(const a of Object.values(S.assets)){
      const life=+a.lifeMonths||0, cost=+a.cost||0, res=+a.residual||0;
      if(!a.date||cost<=0) continue;
      /* Umur 0 = barang habis pakai: seluruh harganya dibebankan di bulan
         pembelian, bukan mengendap di neraca tanpa pernah disusutkan. */
      const per = life>0 ? (cost-res)/life : (cost-res); let acc=0;
      for(const m of months){
        if(m < monthOf(a.date)) continue;
        if(acc >= cost-res-1e-6) break;
        const amt=Math.min(per, cost-res-acc); acc+=amt;
        (depSchedule[m] ||= []).push({assetId:a.id, asset:a.name, amt});
      }
    }
    for(const m of Object.keys(depSchedule)){
      const total=depSchedule[m].reduce((s,x)=>s+x.amt,0);
      journal.push({date:monthEnd(m), seq:900000, ref:"dep-"+m, type:"auto", auto:true, cf:"op",
        desc:"Penyusutan peralatan — "+fmtMonth(m), lines:[{acc:"6-1500",dr:total},{acc:"1-2200",cr:total}]});
    }
  }
  if(st.pphEnabled){
    for(const m of months){
      const omzet = journal.filter(j=>monthOf(j.date)===m && !j.auto).flatMap(j=>j.lines)
        .filter(l=>l.acc==="4-1000"||l.acc==="4-9000")
        .reduce((s,l)=>s+(l.cr||0)-(l.dr||0),0);   // omzet bersih setelah diskon
      const tax = omzet*(+st.pphRate||0)/100;
      if(tax>0.5) journal.push({date:monthEnd(m), seq:900001, ref:"pph-"+m, type:"auto", auto:true, cf:"op",
        desc:"PPh Final "+num2(st.pphRate)+"% dari omzet "+fmtMonth(m), lines:[{acc:"6-2000",dr:tax},{acc:"2-1200",cr:tax}]});
    }
  }
  /* Biaya administrasi rekening bulanan: dibukukan sendiri di hari terakhir tiap
     bulan, seperti penyusutan dan PPh. Bulan yang biayanya sudah kamu catat
     sendiri (catatan berisi "admin bank" atau "admin bulanan") dilewati supaya
     tidak terhitung dua kali. */
  const biayaBank = +st.bankMonthlyFee||0;
  if(biayaBank>0){
    const dari = st.bankMonthlyFeeFrom || months[0];
    const sudahCatat = new Set(Object.values(S.txns)
      .filter(x=>x.type==="expense" && /admin\s*(bulanan\s*)?bank|admin\s+bulanan/i.test((x.note||"")+" "+(x.party||"")))
      .map(x=>monthOf(x.date)));
    for(const m of months){
      if(m<dari || sudahCatat.has(m)) continue;
      journal.push({date:monthEnd(m), seq:900002, ref:"bankfee-"+m, type:"auto", auto:true, cf:"op",
        desc:"Biaya admin bank bulanan — "+fmtMonth(m), lines:[{acc:"6-1800",dr:biayaBank},{acc:"1-1000",cr:biayaBank}]});
    }
  }
  journal.sort((a,b)=> a.date===b.date ? (a.seq||0)-(b.seq||0) : (a.date<b.date?-1:1));

  /* ---- Ringkasan hutang & piutang ---- */
  const payables    = Object.values(openPayable).map(p=>({...p, sisa:p.total-p.paid})).filter(p=>p.sisa>0.5);
  const angsuranDari = {};
  for(const x of Object.values(S.txns)) if(x.type==="loanpay" && x.loanId) (angsuranDari[x.loanId] ||= []).push(x);
  const loans = Object.values(S.txns).filter(x=>x.type==="loan")
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)))
    .map(l=>{
      const bayar=(angsuranDari[l.id]||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
      const pokok=+l.amount||0;
      const pokokBayar=bayar.reduce((n,x)=>n+(+x.principal||0),0);
      const bungaBayar=bayar.reduce((n,x)=>n+(+x.interest||0),0);
      const bulan=Math.max(1,+l.months||1);
      const pokokBulanan=pokok/bulan;
      const bungaBulanan=pokok*(+l.ratePerMonth||0)/100;
      return {...l, bayar, pokok, pokokBayar, bungaBayar,
        sisa:Math.max(0,pokok-pokokBayar), lunas:pokok-pokokBayar<0.5,
        bulan, pokokBulanan, bungaBulanan, angsuranBulanan:pokokBulanan+bungaBulanan,
        sudah:bayar.length};
    });
  /* Sisa negatif = dibayar lebih dari tagihannya. Tetap ditampilkan: kalau
     disembunyikan, kelebihannya diam-diam memotong piutang pelanggan lain di
     neraca dan daftar piutang tidak lagi cocok dengan neraca. */
  const receivables = Object.values(openReceivable).map(p=>({...p, sisa:p.total-p.paid})).filter(p=>Math.abs(p.sisa)>0.5);

  return {journal, inv, cards, sales, roasts, payables, receivables, loans, months, alerts, qcLog, depSchedule,
          productions, wasteLog, fgLots, fgAlloc};
}

/* --------------------- Pembacaan saldo dari jurnal ----------------------- */
function balances(from,to){
  const b={}; ACCOUNTS.forEach(a=>b[a.c]={dr:0,cr:0});
  for(const j of BOOKS.journal){
    if(from && j.date<from) continue;
    if(to   && j.date>to)   continue;
    for(const l of j.lines){ if(!b[l.acc]) b[l.acc]={dr:0,cr:0}; b[l.acc].dr+=l.dr||0; b[l.acc].cr+=l.cr||0; }
  }
  return b;
}
const dbBal = (b,c)=> (b[c]?b[c].dr-b[c].cr:0);   // saldo normal debit
const crBal = (b,c)=> (b[c]?b[c].cr-b[c].dr:0);   // saldo normal kredit

function incomeStatement(from,to){
  const b=balances(from,to);
  const rev = [{c:"4-1000"},{c:"4-9000"},{c:"4-1100"}].map(x=>({...x,n:accName(x.c),v:crBal(b,x.c)})).filter(x=>Math.abs(x.v)>0.5||x.c==="4-1000");
  const revTotal = rev.reduce((s,x)=>s+x.v,0);
  const cogs = ACCOUNTS.filter(a=>a.t==="cogs").map(a=>({c:a.c,n:a.n,v:dbBal(b,a.c)}));
  const cogsTotal = cogs.reduce((s,x)=>s+x.v,0);
  const exp = ACCOUNTS.filter(a=>a.t==="expense").map(a=>({c:a.c,n:a.n,v:dbBal(b,a.c)})).filter(x=>Math.abs(x.v)>0.5);
  const expTotal = exp.reduce((s,x)=>s+x.v,0);
  return {rev,revTotal,cogs:cogs.filter(x=>Math.abs(x.v)>0.5),cogsTotal,gross:revTotal-cogsTotal,exp,expTotal,net:revTotal-cogsTotal-expTotal};
}
function balanceSheet(to){
  const b=balances(null,to);
  const cashDetail=moneyAccounts().map(a=>({code:a.c,name:a.n,v:dbBal(b,a.c)}));
  const cash=cashDetail.reduce((s,x)=>s+x.v,0), ar=dbBal(b,"1-1200");
  const invGb=dbBal(b,"1-1310"), invRb=dbBal(b,"1-1320"), invSup=dbBal(b,"1-1330");
  const invBb=dbBal(b,"1-1340"), invFg=dbBal(b,"1-1350");
  const invTotal=invGb+invRb+invSup+invBb+invFg;
  const fixed=dbBal(b,"1-2100"), accDep=crBal(b,"1-2200");
  const assets=cash+ar+invTotal+fixed-accDep;
  const ap=crBal(b,"2-1000"), loanDue=crBal(b,"2-1100"), taxDue=crBal(b,"2-1200");
  const liab=ap+loanDue+taxDue;
  const modal=crBal(b,"3-1000"), prive=dbBal(b,"3-2000");
  const pl=incomeStatement(null,to);
  const equity=modal-prive+pl.net;
  return {cash,cashDetail,ar,invGb,invRb,invSup,invBb,invFg,invTotal,fixed,accDep,assets,ap,loanDue,taxDue,liab,modal,prive,earn:pl.net,equity,diff:assets-liab-equity};
}
function cashflow(from,to){
  const g={op:{in:0,out:0},inv:{in:0,out:0},fin:{in:0,out:0}};
  const detail={op:{},inv:{},fin:{}};
  for(const j of BOOKS.journal){
    if(from&&j.date<from) continue; if(to&&j.date>to) continue;
    const cashLines=j.lines.filter(l=>isMoney(l.acc));
    if(!cashLines.length) continue;
    const net=cashLines.reduce((s,l)=>s+(l.dr||0)-(l.cr||0),0);
    if(Math.abs(net)<0.5) continue;          // pindah dana antar kantong sendiri: bukan arus kas
    const k=j.cf||"op";
    if(net>=0) g[k].in+=net; else g[k].out+=-net;
    const label = j.desc.split(" — ")[0].split(" · ")[0];
    detail[k][label]=(detail[k][label]||0)+net;
  }
  const opNet=g.op.in-g.op.out, invNet=g.inv.in-g.inv.out, finNet=g.fin.in-g.fin.out;
  const ob=from? balances(null, prevDay(from)) : null;
  const open=ob? moneyAccounts().reduce((s,a)=>s+dbBal(ob,a.c),0) : 0;

/* ------------------------ Ringkasan stok & produk ------------------------ */
function stockRows(){

  // Roast bean: satu baris per green bean x tingkat sangrai.
  const rbKeys=new Set(Object.keys(BOOKS.inv.rb));
  for(const sku of Object.values(S.skus)) for(const bn of skuBeans(sku)) rbKeys.add(rbKey(bn.greenbeanId,bn.roastLevel));
  for(const key of [...rbKeys].sort((a,b)=>rbName(a).localeCompare(rbName(b)))){

const hasRTD = ()=> Object.values(S.skus).some(isRTD) || Object.values(S.txns).some(t=>t.type==="produce");
/* Lot botol jadi yang masih bersisa, paling cepat kedaluwarsa di atas. */
function lotAktif(skuId){

/* Status kedaluwarsa sebuah lot terhadap hari ini. */
function statusExp(exp){
  if(!exp) return {cls:"m",t:"tanpa exp",lvl:0};
